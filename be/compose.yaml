services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: bemo_erp
      POSTGRES_USER: bemo_erp
      POSTGRES_PASSWORD: bemo_erp
    ports:
      - "5432:5432"
    volumes:
      - bemo-erp-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bemo_erp -d bemo_erp"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bemo-erp-postgres:
