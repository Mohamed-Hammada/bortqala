spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bemo_erp}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
hr.jwt.secret=dev-only-secret-change-before-production-2026
hr.bootstrap.admin-username=${HR_BOOTSTRAP_ADMIN_USERNAME:admin}
hr.bootstrap.admin-password=${HR_BOOTSTRAP_ADMIN_PASSWORD:Admin@12345}
hr.bootstrap.super-admin-username=${HR_BOOTSTRAP_SUPER_ADMIN_USERNAME:superadmin}
hr.bootstrap.super-admin-password=${HR_BOOTSTRAP_SUPER_ADMIN_PASSWORD:SuperAdmin@12345}
hr.bootstrap.app-code=${HR_BOOTSTRAP_APP_CODE:DEMO}
hr.bootstrap.app-name=${HR_BOOTSTRAP_APP_NAME:Bemo Demo Company}
hr.bootstrap.demo-data=${HR_BOOTSTRAP_DEMO_DATA:false}
