      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: ${database.defaultSchemaName}.attendance_categories
      changes:
        - createTable:
            tableName: attendance_categories
            columns:
              - column: { name: id, type: VARCHAR(36), constraints: { primaryKey: true, nullable: false } }
              - column: { name: app_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: code, type: VARCHAR(50), constraints: { nullable: false } }
              - column: { name: name, type: VARCHAR(150), constraints: { nullable: false } }
              - column: { name: expected_daily_minutes, type: INT, constraints: { nullable: false } }
              - column: { name: pay_cycle, type: VARCHAR(20), constraints: { nullable: false } }
              - column: { name: attendance_mode, type: VARCHAR(20), constraints: { nullable: false } }
              - column: { name: single_punch_counts, type: BOOLEAN, defaultValueBoolean: false, constraints: { nullable: false } }
              - column: { name: work_days_mask, type: INT, constraints: { nullable: false } }
              - column: { name: active, type: BOOLEAN, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: version, type: BIGINT, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: created_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
        - addUniqueConstraint:
            tableName: attendance_categories
            columnNames: app_id, code
            constraintName: uq_attendance_categories_app_code
      rollback:
        - dropTable: { tableName: attendance_categories }

  - changeSet:
      id: create_schedule_rules_table
      author: Mohamed-Hammada
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: ${database.defaultSchemaName}.schedule_rules
      changes:
        - createTable:
            tableName: schedule_rules
            columns:
              - column: { name: id, type: VARCHAR(36), constraints: { primaryKey: true, nullable: false } }
              - column: { name: app_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: category_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: name, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: effective_from, type: date, constraints: { nullable: false } }
              - column: { name: effective_to, type: date }
              - column: { name: start_time, type: time, constraints: { nullable: false } }
              - column: { name: expected_minutes_override, type: INT }
              - column: { name: grace_minutes, type: INT, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: created_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: schedule_rules
            baseColumnNames: category_id
            constraintName: fk_schedule_rules_category_id
            referencedTableName: attendance_categories
            referencedColumnNames: id
            onDelete: CASCADE
        - addUniqueConstraint:
            tableName: schedule_rules
            columnNames: app_id, category_id, effective_from
            constraintName: uq_schedule_rules_app_category_from
        - createIndex:
            tableName: schedule_rules
            indexName: idx_schedule_rules_category_dates
            columns:
              - column: { name: category_id }
              - column: { name: effective_from }
              - column: { name: effective_to }
      rollback:
        - dropTable: { tableName: schedule_rules }

  - changeSet:
