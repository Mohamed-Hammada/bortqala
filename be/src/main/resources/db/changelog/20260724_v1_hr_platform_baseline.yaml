              - column: { name: created_by, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: created_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
              - column: { name: approved_by, type: VARCHAR(100) }
              - column: { name: approved_at, type: timestamp }
              - column: { name: exported_at, type: timestamp }
