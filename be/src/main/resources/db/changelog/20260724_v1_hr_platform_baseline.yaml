databaseChangeLog:
  - changeSet:
      id: create_apps_table
      author: Mohamed-Hammada
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: ${database.defaultSchemaName}.apps
      changes:
        - createTable:
            tableName: apps
            columns:
              - column: { name: id, type: VARCHAR(36), constraints: { primaryKey: true, nullable: false } }
              - column: { name: code, type: VARCHAR(50), constraints: { nullable: false } }
              - column: { name: name, type: VARCHAR(150), constraints: { nullable: false } }
              - column: { name: active, type: BOOLEAN, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: created_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
              - column: { name: min_password_length, type: INT, defaultValueNumeric: 8, constraints: { nullable: false } }
        - addUniqueConstraint:
            tableName: apps
            columnNames: code
            constraintName: uq_apps_code
      rollback:
        - dropTable: { tableName: apps }

  - changeSet:
      id: create_app_users_table
      author: Mohamed-Hammada
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: ${database.defaultSchemaName}.app_users
      changes:
        - createTable:
            tableName: app_users
            columns:
              - column: { name: id, type: VARCHAR(36), constraints: { primaryKey: true, nullable: false } }
              - column: { name: app_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: username, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: display_name, type: VARCHAR(150), constraints: { nullable: false } }
              - column: { name: password_hash, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: active, type: BOOLEAN, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: version, type: BIGINT, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: created_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
        - addUniqueConstraint:
            tableName: app_users
            columnNames: app_id, username
            constraintName: uq_app_users_app_username
      rollback:
        - dropTable: { tableName: app_users }

  - changeSet:
      id: create_roles_table
      author: Mohamed-Hammada
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: ${database.defaultSchemaName}.roles
      changes:
        - createTable:
            tableName: roles
            columns:
              - column: { name: code, type: VARCHAR(30), constraints: { primaryKey: true, nullable: false } }
              - column: { name: name_ar, type: VARCHAR(100), constraints: { nullable: false } }
      rollback:
        - dropTable: { tableName: roles }

  - changeSet:
      id: seed_platform_roles
      author: Mohamed-Hammada
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM roles WHERE code = 'ADMIN'
      changes:
        - insert:
            tableName: roles
            columns:
              - column: { name: code, value: ADMIN }
              - column: { name: name_ar, value: مدير النظام }
        - insert:
            tableName: roles
            columns:
              - column: { name: code, value: HR_MANAGER }
              - column: { name: name_ar, value: مدير الموارد البشرية }
        - insert:
            tableName: roles
            columns:
              - column: { name: code, value: HR_REVIEWER }
              - column: { name: name_ar, value: مراجع الحضور }
        - insert:
            tableName: roles
            columns:
              - column: { name: code, value: VIEWER }
              - column: { name: name_ar, value: مشاهد }
      rollback:
        - delete:
            tableName: roles
            where: code IN ('ADMIN', 'HR_MANAGER', 'HR_REVIEWER', 'VIEWER')

  - changeSet:
      id: create_user_roles_table
      author: Mohamed-Hammada
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: ${database.defaultSchemaName}.user_roles
      changes:
        - createTable:
            tableName: user_roles
            columns:
              - column: { name: user_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: role_code, type: VARCHAR(30), constraints: { nullable: false } }
        - addPrimaryKey:
            tableName: user_roles
            columnNames: user_id, role_code
            constraintName: pk_user_roles
        - addForeignKeyConstraint:
            baseTableName: user_roles
            baseColumnNames: user_id
            constraintName: fk_user_roles_user_id
            referencedTableName: app_users
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: user_roles
            baseColumnNames: role_code
            constraintName: fk_user_roles_role_code
            referencedTableName: roles
            referencedColumnNames: code
      rollback:
        - dropTable: { tableName: user_roles }

  - changeSet:
