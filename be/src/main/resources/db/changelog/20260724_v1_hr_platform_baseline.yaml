            columnNames: app_id, report_id, category_id, work_date
            constraintName: uq_holiday_proposals_app_report_category_date
      rollback:
        - dropTable: { tableName: holiday_proposals }

  - changeSet:
      id: add_saas_app_scope_foreign_keys
      author: Mohamed-Hammada
      changes:
        - addForeignKeyConstraint: { baseTableName: app_users, baseColumnNames: app_id, constraintName: fk_app_users_app_id, referencedTableName: apps, referencedColumnNames: id }
        - addForeignKeyConstraint: { baseTableName: attendance_categories, baseColumnNames: app_id, constraintName: fk_attendance_categories_app_id, referencedTableName: apps, referencedColumnNames: id }
        - addForeignKeyConstraint: { baseTableName: schedule_rules, baseColumnNames: app_id, constraintName: fk_schedule_rules_app_id, referencedTableName: apps, referencedColumnNames: id }
        - addForeignKeyConstraint: { baseTableName: employees, baseColumnNames: app_id, constraintName: fk_employees_app_id, referencedTableName: apps, referencedColumnNames: id }
        - addForeignKeyConstraint: { baseTableName: confirmed_holidays, baseColumnNames: app_id, constraintName: fk_confirmed_holidays_app_id, referencedTableName: apps, referencedColumnNames: id }
