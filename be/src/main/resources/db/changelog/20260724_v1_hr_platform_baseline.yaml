              - column: { name: punched_at, type: "TIMESTAMP WITH TIME ZONE", constraints: { nullable: false } }
              - column: { name: raw_line, type: TEXT, constraints: { nullable: false } }
              - column: { name: row_number, type: INT, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: punch_records
            baseColumnNames: batch_id
            constraintName: fk_punch_records_batch_id
            referencedTableName: import_batches
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: punch_records
            baseColumnNames: employee_id
            constraintName: fk_punch_records_employee_id
            referencedTableName: employees
            referencedColumnNames: id
        - addUniqueConstraint:
            tableName: punch_records
            columnNames: app_id, batch_id, row_number
            constraintName: uq_punch_records_app_batch_row
        - createIndex:
            tableName: punch_records
            indexName: idx_punch_records_employee_time
            columns:
              - column: { name: employee_id }
              - column: { name: punched_at }
      rollback:
        - dropTable: { tableName: punch_records }

