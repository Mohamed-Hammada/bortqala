databaseChangeLog:
  - changeSet:
      id: 20260729-46-unit-conversions
      author: system
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: unit_conversions
      changes:
        - createTable:
            tableName: unit_conversions
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: app_id
                  type: VARCHAR(36)
                  constraints: { nullable: false }
              - column:
                  name: from_uom_id
                  type: VARCHAR(36)
                  constraints: { nullable: false }
              - column:
                  name: to_uom_id
                  type: VARCHAR(36)
                  constraints: { nullable: false }
              - column:
                  name: factor
                  type: NUMERIC(19,6)
                  constraints: { nullable: false }
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints: { nullable: false }
              - column:
                  name: created_by
                  type: VARCHAR(100)
                  constraints: { nullable: false }
        - addUniqueConstraint:
            tableName: unit_conversions
            columnNames: app_id, from_uom_id, to_uom_id
            constraintName: uk_uc_from_to
        - addForeignKeyConstraint:
            baseTableName: unit_conversions
            baseColumnNames: from_uom_id
            referencedTableName: unit_of_measures
            referencedColumnNames: id
            constraintName: fk_uc_from_uom
        - addForeignKeyConstraint:
            baseTableName: unit_conversions
            baseColumnNames: to_uom_id
            referencedTableName: unit_of_measures
            referencedColumnNames: id
            constraintName: fk_uc_to_uom
