databaseChangeLog:
  - changeSet:
      id: 20260819_v286_inventory_site_warehouse_schema
      author: wolfn
      changes:
        - addColumn:
            tableName: stock_movements
            columns:
              - column:
                  name: project_id
                  type: VARCHAR(36)
              - column:
                  name: wbs_node_id
                  type: VARCHAR(36)
              - column:
                  name: cost_code_id
                  type: VARCHAR(36)
              - column:
                  name: lot_number
                  type: VARCHAR(100)
              - column:
                  name: serial_number
                  type: VARCHAR(100)
              - column:
                  name: expiry_date
                  type: VARCHAR(10)
              - column:
                  name: bin_id
                  type: VARCHAR(36)
        - addColumn:
            tableName: inventory_items
            columns:
              - column:
                  name: barcode
                  type: VARCHAR(100)
              - column:
                  name: barcode_aliases
                  type: VARCHAR(500)
              - column:
                  name: tracking_type
                  type: VARCHAR(30)
                  defaultValue: "NONE"
              - column:
                  name: shelf_life_days
                  type: INT
              - column:
                  name: is_dead_stock
                  type: BOOLEAN
                  defaultValueBoolean: false
        - createIndex:
            indexName: idx_sm_project_id
            tableName: stock_movements
            columns:
              - column:
                  name: project_id
        - createIndex:
            indexName: idx_inv_barcode
            tableName: inventory_items
            columns:
              - column:
                  name: barcode
