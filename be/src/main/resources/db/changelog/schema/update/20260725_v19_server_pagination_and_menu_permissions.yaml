databaseChangeLog:
  - changeSet:
      id: add_allowed_menus_and_default_page_size
      author: Mohamed-Hammada
      changes:
        - addColumn:
            tableName: app_users
            columns:
              - column:
                  name: allowed_menus
                  type: VARCHAR(1000)
                  defaultValue: "dashboard,employees,categories,reports,imports,parties,operations,users,settings"
        - addColumn:
            tableName: user_preferences
            columns:
              - column:
                  name: default_page_size
                  type: INT
                  defaultValueNumeric: 25

