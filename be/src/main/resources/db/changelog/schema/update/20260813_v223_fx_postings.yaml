databaseChangeLog:
  - changeSet:
      id: 20260813_v223_001_fx_postings
      author: codex
      changes:
        - createTable:
            tableName: fx_postings
            columns:
              - column: { name: id, type: VARCHAR(36), constraints: { primaryKey: true, nullable: false } }
              - column: { name: app_id, type: VARCHAR(50), constraints: { nullable: false } }
              - column: { name: type, type: VARCHAR(20), constraints: { nullable: false } }
              - column: { name: source_document_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: foreign_amount, type: "DECIMAL(19,4)", constraints: { nullable: false } }
              - column: { name: transaction_rate, type: "DECIMAL(19,8)", constraints: { nullable: false } }
              - column: { name: closing_rate, type: "DECIMAL(19,8)", constraints: { nullable: false } }
              - column: { name: gain_loss_amount, type: "DECIMAL(19,2)", constraints: { nullable: false } }
              - column: { name: rate_source, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: effective_date, type: DATE, constraints: { nullable: false } }
              - column: { name: fiscal_period_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: journal_entry_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: reversal_journal_entry_id, type: VARCHAR(36) }
              - column: { name: operation_id, type: VARCHAR(80), constraints: { nullable: false } }
              - column: { name: status, type: VARCHAR(20), constraints: { nullable: false } }
              - column: { name: created_at, type: BIGINT, constraints: { nullable: false } }
        - addUniqueConstraint: { tableName: fx_postings, columnNames: "app_id,operation_id", constraintName: uq_fx_posting_operation }
      rollback:
        - dropTable: { tableName: fx_postings }
