databaseChangeLog:
  - changeSet:
      id: 20260727-24-ensure-min-password-length
      author: hr-platform
      validCheckSum: ANY
      preConditions:
        - onFail: MARK_RAN
        - not:
            columnExists:
              tableName: apps
              columnName: min_password_length
      changes:
        - addColumn:
            tableName: apps
            columns:
              - column:
                  name: min_password_length
                  type: INT
                  defaultValueNumeric: 8
                  constraints: { nullable: false }
