databaseChangeLog:
  - changeSet:
      id: 20260812_v203_001_payroll_calculation_policies
      author: codex
      changes:
        - createTable:
            tableName: payroll_calculation_policies
            columns:
              - column: { name: id, type: VARCHAR(36), constraints: { primaryKey: true, nullable: false } }
              - column: { name: app_id, type: VARCHAR(50), constraints: { nullable: false } }
              - column: { name: name, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: effective_from, type: DATE, constraints: { nullable: false } }
              - column: { name: effective_to, type: DATE }
              - column: { name: working_hour_divisor, type: "DECIMAL(10,2)", constraints: { nullable: false } }
              - column: { name: overtime_multiplier, type: "DECIMAL(10,4)", constraints: { nullable: false } }
              - column: { name: active, type: BOOLEAN, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: version, type: BIGINT, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
        - createIndex:
            tableName: payroll_calculation_policies
            indexName: ix_payroll_policy_app_effective
            columns:
              - column: { name: app_id }
              - column: { name: effective_from }
        - addUniqueConstraint:
            tableName: payroll_calculation_policies
            columnNames: app_id, effective_from
            constraintName: uq_payroll_policy_app_effective_from

  - changeSet:
      id: 20260812_v203_002_expand_payroll_snapshots
      author: codex
      changes:
        - addColumn:
            tableName: payroll_input_snapshots
            columns:
              - column: { name: period_start, type: DATE, defaultValueDate: '2000-01-01', constraints: { nullable: false } }
              - column: { name: period_end, type: DATE, defaultValueDate: '2000-01-01', constraints: { nullable: false } }
              - column: { name: base_salary, type: "DECIMAL(15,2)", defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: worked_minutes, type: BIGINT, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: overtime_minutes, type: BIGINT, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: late_minutes, type: BIGINT, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: payroll_policy_id, type: VARCHAR(36), defaultValue: legacy-standard, constraints: { nullable: false } }
              - column: { name: payroll_policy_version, type: BIGINT, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: working_hour_divisor, type: "DECIMAL(10,2)", defaultValueNumeric: 240, constraints: { nullable: false } }
              - column: { name: overtime_multiplier, type: "DECIMAL(10,4)", defaultValueNumeric: 1.5, constraints: { nullable: false } }
              - column: { name: advance_balance, type: "DECIMAL(15,2)", defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: advance_deduction, type: "DECIMAL(15,2)", defaultValueNumeric: 0, constraints: { nullable: false } }
        - addUniqueConstraint:
            tableName: payroll_input_snapshots
            columnNames: app_id, employee_id, period_id
            constraintName: uq_payroll_snapshot_employee_period
