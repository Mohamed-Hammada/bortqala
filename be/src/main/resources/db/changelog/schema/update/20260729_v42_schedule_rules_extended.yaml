databaseChangeLog:
  - changeSet:
      id: 20260729-42-schedule-rules-extended
      author: hr-platform
      validCheckSum: ANY
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: schedule_rules
        - not:
            columnExists:
              tableName: schedule_rules
              columnName: end_time
      changes:
        - addColumn:
            tableName: schedule_rules
            columns:
              - column:
                  name: end_time
                  type: TIME
              - column:
                  name: scope
                  type: VARCHAR(20)
                  defaultValue: ALL
                  constraints: { nullable: false }
              - column:
                  name: scope_category_id
                  type: VARCHAR(36)
        - addForeignKeyConstraint:
            baseTableName: schedule_rules
            baseColumnNames: scope_category_id
            constraintName: fk_schedule_rules_scope_category
            referencedTableName: attendance_categories
            referencedColumnNames: id
            onDelete: SET NULL
        - createIndex:
            tableName: schedule_rules
            indexName: idx_schedule_rules_scope
            columns:
              - column: { name: scope }
        - createIndex:
            tableName: schedule_rules
            indexName: idx_schedule_rules_scope_category
            columns:
              - column: { name: scope_category_id }
      rollback:
        - dropIndex:
            tableName: schedule_rules
            indexName: idx_schedule_rules_scope
        - dropIndex:
            tableName: schedule_rules
            indexName: idx_schedule_rules_scope_category
        - dropForeignKeyConstraint:
            baseTableName: schedule_rules
            constraintName: fk_schedule_rules_scope_category
        - dropColumn:
            tableName: schedule_rules
            columns:
              - column:
                  name: end_time
              - column:
                  name: scope
              - column:
                  name: scope_category_id
