databaseChangeLog:
  - changeSet:
      id: 20260802-v84-optimistic-locking-aggregates
      author: Mohamed-Hammada
      comment: Adds the optimistic-lock version column to the mutable trade, manufacturing, workforce and treasury aggregates so concurrent state transitions are detected with 409 conflicts.
      changes:
        - addColumn:
            tableName: purchase_orders
            columns:
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - addColumn:
            tableName: goods_receipts
            columns:
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
