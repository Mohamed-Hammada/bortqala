databaseChangeLog:
  - changeSet:
      id: add_app_session_timeout
      author: Mohamed-Hammada
      validCheckSum: "*"
      changes:
        - addColumn:
            tableName: apps
            columns:
              - column:
                  name: session_timeout_minutes
                  type: INT
                  defaultValueNumeric: 480
                  constraints: { nullable: false }
              - column:
                  name: session_timeout_enabled
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints: { nullable: false }
              - column:
                  name: show_report_presets
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints: { nullable: false }
      rollback:
        - dropColumn: { tableName: apps, columnName: session_timeout_minutes }
        - dropColumn: { tableName: apps, columnName: session_timeout_enabled }
        - dropColumn: { tableName: apps, columnName: show_report_presets }


