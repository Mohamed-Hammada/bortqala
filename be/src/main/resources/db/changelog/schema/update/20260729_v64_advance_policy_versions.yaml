databaseChangeLog:
  - changeSet:
      id: version_workforce_advance_policies
      author: Mohamed-Hammada
      validCheckSum: ANY
      changes:
        - dropUniqueConstraint:
            tableName: workforce_advance_policies
            constraintName: uk_advance_policy_scope
        - addColumn:
            tableName: workforce_advance_policies
            columns:
              - column: { name: version, type: INT, defaultValueNumeric: 1, constraints: { nullable: false } }
              - column: { name: effective_from, type: DATE, defaultValueDate: "2000-01-01", constraints: { nullable: false } }
              - column: { name: effective_to, type: DATE }
              - column: { name: scope_key, type: VARCHAR(36), defaultValue: GLOBAL, constraints: { nullable: false } }
        - sql:
            sql: UPDATE workforce_advance_policies SET scope_key = COALESCE(scope_id, 'GLOBAL')
        - addUniqueConstraint:
            tableName: workforce_advance_policies
            columnNames: app_id, scope_type, scope_key, version
            constraintName: uk_advance_policy_scope_version
        - createIndex:
            tableName: workforce_advance_policies
            indexName: idx_advance_policy_effective
            columns:
              - column: { name: app_id }
              - column: { name: scope_type }
              - column: { name: scope_key }
              - column: { name: effective_from }
              - column: { name: effective_to }
      rollback:
        - dropIndex: { tableName: workforce_advance_policies, indexName: idx_advance_policy_effective }
        - dropUniqueConstraint: { tableName: workforce_advance_policies, constraintName: uk_advance_policy_scope_version }
        - dropColumn: { tableName: workforce_advance_policies, columnName: scope_key }
        - dropColumn: { tableName: workforce_advance_policies, columnName: effective_to }
        - dropColumn: { tableName: workforce_advance_policies, columnName: effective_from }
        - dropColumn: { tableName: workforce_advance_policies, columnName: version }
        - addUniqueConstraint:
            tableName: workforce_advance_policies
            columnNames: app_id, scope_type, scope_id
            constraintName: uk_advance_policy_scope

  - changeSet:
      id: snapshot_advance_policy_on_transactions
      author: Mohamed-Hammada
      validCheckSum: ANY
      changes:
        - addColumn:
            tableName: workforce_advances
            columns:
              - column: { name: applied_policy_id, type: VARCHAR(36) }
              - column: { name: applied_policy_version, type: INT }
              - column: { name: applied_policy_snapshot, type: VARCHAR(1000) }
        - addColumn:
            tableName: worker_settlements
            columns:
              - column: { name: advance_policy_snapshot, type: VARCHAR(2000) }
      rollback:
        - dropColumn: { tableName: worker_settlements, columnName: advance_policy_snapshot }
        - dropColumn: { tableName: workforce_advances, columnName: applied_policy_snapshot }
        - dropColumn: { tableName: workforce_advances, columnName: applied_policy_version }
        - dropColumn: { tableName: workforce_advances, columnName: applied_policy_id }
