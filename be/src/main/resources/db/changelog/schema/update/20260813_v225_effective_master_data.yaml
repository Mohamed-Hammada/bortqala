databaseChangeLog:
  - changeSet:
      id: 20260813_v225_001_effective_master_data
      author: codex
      changes:
        - createTable:
            tableName: effective_master_values
            columns:
              - column: { name: id, type: VARCHAR(36), constraints: { primaryKey: true, nullable: false } }
              - column: { name: app_id, type: VARCHAR(50), constraints: { nullable: false } }
              - column: { name: master_type, type: VARCHAR(50), constraints: { nullable: false } }
              - column: { name: master_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: value_key, type: VARCHAR(80), constraints: { nullable: false } }
              - column: { name: value_text, type: VARCHAR(1000), constraints: { nullable: false } }
              - column: { name: effective_from, type: DATE, constraints: { nullable: false } }
              - column: { name: effective_to, type: DATE }
              - column: { name: reason, type: VARCHAR(500), constraints: { nullable: false } }
              - column: { name: created_by, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: created_at, type: BIGINT, constraints: { nullable: false } }
        - createIndex: { tableName: effective_master_values, indexName: ix_effective_master_lookup, columns: [{ column: { name: app_id } }, { column: { name: master_type } }, { column: { name: master_id } }, { column: { name: value_key } }, { column: { name: effective_from } }] }
      rollback:
        - dropTable: { tableName: effective_master_values }
