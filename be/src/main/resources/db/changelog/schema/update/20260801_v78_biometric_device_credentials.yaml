databaseChangeLog:
  - changeSet:
      id: 20260801-v78-biometric-device-credentials
      author: codex
      comment: Stores optional biometric device credentials with the password encrypted at rest (AES/GCM); plaintext is never persisted.
      changes:
        - addColumn:
            tableName: biometric_devices
            columns:
              - column:
                  name: device_username
                  type: varchar(150)
                  constraints:
                    nullable: true
              - column:
                  name: device_password_enc
                  type: varchar(1000)
                  constraints:
                    nullable: true
      rollback:
        - dropColumn:
            tableName: biometric_devices
            columnName: device_password_enc
        - dropColumn:
            tableName: biometric_devices
            columnName: device_username
