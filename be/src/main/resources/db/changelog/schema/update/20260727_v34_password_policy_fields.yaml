databaseChangeLog:
  - changeSet:
      id: 20260727-34-password-policy-fields
      author: hr-platform
      validCheckSum: ANY
      preConditions:
        - onFail: MARK_RAN
        - not:
            columnExists:
              tableName: apps
              columnName: require_uppercase
      changes:
        - addColumn:
            tableName: apps
            columns:
              - column:
                  name: require_uppercase
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints: { nullable: false }
              - column:
                  name: require_lowercase
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints: { nullable: false }
              - column:
                  name: require_numbers
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints: { nullable: false }
              - column:
                  name: require_special_chars
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints: { nullable: false }
              - column:
                  name: disallow_spaces
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints: { nullable: false }
              - column:
                  name: max_password_length
                  type: INT
                  defaultValueNumeric: 128
                  constraints: { nullable: false }
              - column:
                  name: password_expiry_days
                  type: INT
                  defaultValueNumeric: 0
                  constraints: { nullable: false }
              - column:
                  name: password_history_count
                  type: INT
                  defaultValueNumeric: 0
                  constraints: { nullable: false }
