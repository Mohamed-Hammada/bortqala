databaseChangeLog:
  - changeSet:
      id: 20260729-41-purchase-order-line-columns
      author: hr-platform
      validCheckSum: ANY
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: purchase_order_lines
        - not:
            columnExists:
              tableName: purchase_order_lines
              columnName: item_category
      changes:
        - addColumn:
            tableName: purchase_order_lines
            columns:
              - column:
                  name: item_category
                  type: VARCHAR(100)
              - column:
                  name: unit_of_measure
                  type: VARCHAR(50)
              - column:
                  name: created_at
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
      rollback:
        - dropColumn:
            tableName: purchase_order_lines
            columns:
              - column:
                  name: item_category
              - column:
                  name: unit_of_measure
              - column:
                  name: created_at
