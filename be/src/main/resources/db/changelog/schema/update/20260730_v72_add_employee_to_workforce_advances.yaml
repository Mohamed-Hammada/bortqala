databaseChangeLog:
  - changeSet:
      id: add_employee_id_to_workforce_advances
      author: Mohamed-Hammada
      preConditions:
        - onFail: MARK_RAN
        - not:
            columnExists:
              tableName: workforce_advances
              columnName: employee_id
      changes:
        - addColumn:
            tableName: workforce_advances
            columns:
              - column:
                  name: employee_id
                  type: VARCHAR(36)
      rollback:
        - dropColumn:
            tableName: workforce_advances
            columnName: employee_id

  - changeSet:
      id: create_index_idx_workforce_advances_employee_id
      author: Mohamed-Hammada
      preConditions:
        onFail: MARK_RAN
        and:
          - tableExists:
              tableName: workforce_advances
          - not:
              indexExists:
                indexName: idx_workforce_advances_employee_id
      changes:
        - createIndex:
            indexName: idx_workforce_advances_employee_id
            tableName: workforce_advances
            columns:
              - column:
                  name: employee_id
      rollback:
        - dropIndex:
            indexName: idx_workforce_advances_employee_id
            tableName: workforce_advances

  - changeSet:
      id: add_fk_workforce_advances_employee_id
      author: Mohamed-Hammada
      preConditions:
        onFail: MARK_RAN
        and:
          - tableExists:
              tableName: workforce_advances
          - tableExists:
              tableName: employees
          - not:
              foreignKeyConstraintExists:
                foreignKeyName: fk_workforce_advances_employee_id
      changes:
        - addForeignKeyConstraint:
            baseTableName: workforce_advances
            baseColumnNames: employee_id
            constraintName: fk_workforce_advances_employee_id
            referencedTableName: employees
            referencedColumnNames: id
            onDelete: RESTRICT
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: workforce_advances
            constraintName: fk_workforce_advances_employee_id
