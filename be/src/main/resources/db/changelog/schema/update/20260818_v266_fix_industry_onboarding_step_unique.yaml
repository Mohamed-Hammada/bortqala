databaseChangeLog:
  - changeSet:
      id: 20260818_v266_fix_industry_onboarding_step_unique
      author: Mohamed-Hammada
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DO $$
              DECLARE
                  current_cols text;
              BEGIN
                  SELECT string_agg(a.attname, ',' ORDER BY u.ordinality)
                  INTO current_cols
                  FROM pg_constraint c
                  JOIN pg_class t
                    ON t.oid = c.conrelid
                  CROSS JOIN LATERAL unnest(c.conkey)
                    WITH ORDINALITY AS u(attnum, ordinality)
                  JOIN pg_attribute a
                    ON a.attrelid = t.oid
                   AND a.attnum = u.attnum
                  WHERE t.relname = 'industry_onboarding_steps'
                    AND c.conname = 'uk_industry_onboarding_step'
                    AND c.contype = 'u';

                  IF current_cols IS DISTINCT FROM
                     'app_id,tenant_pack_id,step_key' THEN

                      ALTER TABLE industry_onboarding_steps
                      DROP CONSTRAINT IF EXISTS uk_industry_onboarding_step;

                      ALTER TABLE industry_onboarding_steps
                      ADD CONSTRAINT uk_industry_onboarding_step
                      UNIQUE (app_id, tenant_pack_id, step_key);
                  END IF;
              END $$;
        - sql:
            dbms: h2
            splitStatements: true
            sql: |
              ALTER TABLE industry_onboarding_steps DROP CONSTRAINT IF EXISTS uk_industry_onboarding_step;
              ALTER TABLE industry_onboarding_steps ADD CONSTRAINT uk_industry_onboarding_step UNIQUE (app_id, tenant_pack_id, step_key);
