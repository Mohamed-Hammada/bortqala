databaseChangeLog:
  - changeSet:
      id: 20260907-v462-executive-analytics-p1-indexes
      author: bemo-tech-lead
      comment: >
        Deep-engineering remediation (2026-09-07, Performance Review P-1): ExecutiveAnalyticsService
        no longer loads these tables' entire tenant history via findAll() + Java-side filtering —
        it now issues targeted, date/amount/status-scoped queries. These indexes are what makes
        those queries actually index-served rather than full (if narrower) table scans.
      changes:
        - createIndex:
            indexName: idx_customer_invoices_app_outstanding
            tableName: customer_invoices
            columns:
              - column: { name: app_id }
              - column: { name: outstanding_amount }
        - createIndex:
            indexName: idx_customer_invoices_app_invoice_date
            tableName: customer_invoices
            columns:
              - column: { name: app_id }
              - column: { name: invoice_date }
        - createIndex:
            indexName: idx_customer_invoices_app_customer
            tableName: customer_invoices
            columns:
              - column: { name: app_id }
              - column: { name: customer_id }
        - createIndex:
            indexName: idx_supplier_invoices_app_status
            tableName: supplier_invoices
            columns:
              - column: { name: app_id }
              - column: { name: status }
        - createIndex:
            indexName: idx_pos_transactions_app_created_at
            tableName: pos_transactions
            columns:
              - column: { name: app_id }
              - column: { name: created_at }
        - createIndex:
            indexName: idx_sales_quotations_app_quote_date
            tableName: sales_quotations
            columns:
              - column: { name: app_id }
              - column: { name: quotation_date }
        - createIndex:
            indexName: idx_customer_receipts_app_receipt_date
            tableName: customer_receipts
            columns:
              - column: { name: app_id }
              - column: { name: receipt_date }
        - createIndex:
            indexName: idx_expense_claims_app_spent_on
            tableName: expense_claims
            columns:
              - column: { name: app_id }
              - column: { name: spent_on }
        - createIndex:
            indexName: idx_sales_delivery_lines_app_created_at
            tableName: sales_delivery_lines
            columns:
              - column: { name: app_id }
              - column: { name: created_at }
