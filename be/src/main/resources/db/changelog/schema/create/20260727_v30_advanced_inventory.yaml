databaseChangeLog:
  - changeSet:
      id: 20260727-30-create-advanced-inventory-tables
      author: system
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: inventory_lots
      changes:
        - createTable:
            tableName: inventory_lots
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: app_id
                  type: VARCHAR(36)
                  constraints: { nullable: false }
              - column:
                  name: item_id
                  type: VARCHAR(36)
                  constraints: { nullable: false }
              - column:
                  name: lot_number
                  type: VARCHAR(50)
                  constraints: { nullable: false }
              - column:
                  name: manufactured_date
                  type: DATE
              - column:
                  name: expiration_date
                  type: DATE
              - column:
                  name: quantity
                  type: NUMERIC(12,2)
                  defaultValueNumeric: 0.00
                  constraints: { nullable: false }
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints: { nullable: false }
              - column:
                  name: created_at
                  type: BIGINT
                  constraints: { nullable: false }

        - createTable:
            tableName: inventory_serials
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: app_id
                  type: VARCHAR(36)
                  constraints: { nullable: false }
              - column:
                  name: item_id
                  type: VARCHAR(36)
                  constraints: { nullable: false }
              - column:
                  name: serial_number
                  type: VARCHAR(100)
                  constraints: { nullable: false }
              - column:
                  name: warehouse_id
                  type: VARCHAR(36)
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: IN_STOCK
                  constraints: { nullable: false }
              - column:
                  name: created_at
                  type: BIGINT
                  constraints: { nullable: false }

        - createTable:
            tableName: fifo_layers
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: app_id
                  type: VARCHAR(36)
                  constraints: { nullable: false }
              - column:
                  name: item_id
                  type: VARCHAR(36)
                  constraints: { nullable: false }
              - column:
                  name: received_date
                  type: DATE
                  constraints: { nullable: false }
              - column:
                  name: initial_quantity
                  type: NUMERIC(12,2)
                  constraints: { nullable: false }
              - column:
                  name: remaining_quantity
                  type: NUMERIC(12,2)
                  constraints: { nullable: false }
              - column:
                  name: unit_cost
                  type: NUMERIC(15,2)
                  constraints: { nullable: false }
              - column:
                  name: created_at
                  type: BIGINT
                  constraints: { nullable: false }
