databaseChangeLog:
  - changeSet:
      id: create_employee_assignments_table
      author: Mohamed-Hammada
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: ${database.defaultSchemaName}.employee_assignments
      changes:
        - createTable:
            tableName: employee_assignments
            columns:
              - column: { name: id, type: VARCHAR(36), constraints: { primaryKey: true, nullable: false } }
              - column: { name: app_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: employee_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: category_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: effective_from, type: date, constraints: { nullable: false } }
              - column: { name: effective_to, type: date }
              - column: { name: created_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
        - addUniqueConstraint:
            tableName: employee_assignments
            columnNames: app_id, employee_id, effective_from
            constraintName: uq_employee_assignments_app_employee_from
        - addForeignKeyConstraint:
            baseTableName: employee_assignments
            baseColumnNames: app_id
            constraintName: fk_employee_assignments_app_id
            referencedTableName: apps
            referencedColumnNames: id
        - addForeignKeyConstraint:
            baseTableName: employee_assignments
            baseColumnNames: employee_id
            constraintName: fk_employee_assignments_employee_id
            referencedTableName: employees
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: employee_assignments
            baseColumnNames: category_id
            constraintName: fk_employee_assignments_category_id
            referencedTableName: attendance_categories
            referencedColumnNames: id
        - createIndex:
            tableName: employee_assignments
            indexName: idx_employee_assignments_employee_dates
            columns:
              - column: { name: employee_id }
              - column: { name: effective_from }
              - column: { name: effective_to }
      rollback:
        - dropTable: { tableName: employee_assignments }
