databaseChangeLog:
  - changeSet:
      id: 20260830-v444-001
      author: bemo-team
      changes:
        - createTable:
            tableName: srv_rental_items
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: app_id
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: code
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: name_en
                  type: VARCHAR(255)
              - column:
                  name: category
                  type: VARCHAR(100)
              - column:
                  name: rate_daily
                  type: DECIMAL(14,2)
                  defaultValueNumeric: 0.00
              - column:
                  name: rate_weekly
                  type: DECIMAL(14,2)
                  defaultValueNumeric: 0.00
              - column:
                  name: rate_monthly
                  type: DECIMAL(14,2)
                  defaultValueNumeric: 0.00
              - column:
                  name: deposit_amount
                  type: DECIMAL(14,2)
                  defaultValueNumeric: 0.00
              - column:
                  name: status
                  type: VARCHAR(30)
                  defaultValue: AVAILABLE
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: BIGINT
                  constraints:
                    nullable: false

