              - column: { name: app_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: advance_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: entry_type, type: VARCHAR(30), constraints: { nullable: false } }
              - column: { name: amount, type: "NUMERIC(12, 2)", constraints: { nullable: false } }
              - column: { name: balance_after, type: "NUMERIC(12, 2)", constraints: { nullable: false } }
              - column: { name: notes, type: VARCHAR(500) }
              - column: { name: created_by, type: VARCHAR(160) }
              - column: { name: created_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
