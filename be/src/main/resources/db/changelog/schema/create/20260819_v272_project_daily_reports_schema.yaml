databaseChangeLog:
  - changeSet:
      id: 20260819-v272-001
      author: bemo-architect
      changes:
        - createTable:
            tableName: project_daily_reports
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tenant_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: project_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: report_number
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: report_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: shift
                  type: VARCHAR(32)
                  defaultValue: DAY
                  constraints:
                    nullable: false
              - column:
                  name: weather_condition
                  type: VARCHAR(32)
              - column:
                  name: temperature_celsius
                  type: DECIMAL(5,2)
              - column:
                  name: status
                  type: VARCHAR(32)
                  defaultValue: DRAFT
                  constraints:
                    nullable: false
              - column:
                  name: site_engineer_user_id
                  type: VARCHAR(64)
              - column:
                  name: approver_user_id
                  type: VARCHAR(64)
              - column:
                  name: approved_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: reopened_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: general_notes
                  type: CLOB
              - column:
                  name: blockers_and_issues
                  type: CLOB
              - column:
                  name: safety_observations
                  type: CLOB
              - column:
                  name: total_workforce_count
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: total_equipment_count
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

  - changeSet:
      id: 20260819-v272-002
      author: bemo-architect
      changes:
        - addUniqueConstraint:
            tableName: project_daily_reports
            columnNames: tenant_id, project_id, report_date, shift
            constraintName: uq_project_daily_report_date_shift
        - createIndex:
            tableName: project_daily_reports
            indexName: idx_dpr_project_date
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: project_id
              - column:
                  name: report_date

