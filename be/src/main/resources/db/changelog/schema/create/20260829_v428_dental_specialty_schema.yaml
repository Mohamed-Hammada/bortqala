databaseChangeLog:
  - changeSet:
      id: 20260829-v428-001
      author: bemo-medical
      changes:
        - createTable:
            tableName: dental_records
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_dental_records
              - column:
                  name: app_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: patient_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: visit_id
                  type: VARCHAR(36)
              - column:
                  name: tooth_number
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: condition
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: surface
                  type: VARCHAR(20)
              - column:
                  name: notes
                  type: VARCHAR(500)
              - column:
                  name: noted_on
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

  - changeSet:
      id: 20260829-v428-002
      author: bemo-medical
      changes:
        - createTable:
            tableName: dental_treatment_plans
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_dental_treatment_plans
              - column:
                  name: app_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: patient_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(160)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: "ACTIVE"
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

  - changeSet:
      id: 20260829-v428-003
      author: bemo-medical
      changes:
        - createTable:
            tableName: dental_treatment_plan_items
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_dental_treatment_plan_items
              - column:
                  name: app_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: plan_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: tooth_number
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: procedure_text
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: estimated_cost
                  type: NUMERIC(15, 2)
                  defaultValueNumeric: 0.00
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: "PLANNED"
                  constraints:
                    nullable: false
              - column:
                  name: completed_at
                  type: BIGINT
              - column:
                  name: visit_id
                  type: VARCHAR(36)
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

  - changeSet:
      id: 20260829-v428-004
      author: bemo-medical
      changes:
        - createTable:
