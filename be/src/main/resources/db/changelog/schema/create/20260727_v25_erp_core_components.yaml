databaseChangeLog:
  - changeSet:
      id: 20260727-25-create-erp-core-components
      author: system
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: companies
      changes:
        - createTable:
            tableName: companies
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: app_id
                  type: VARCHAR(36)
                  constraints: { nullable: false }
              - column:
                  name: code
                  type: VARCHAR(50)
                  constraints: { nullable: false }
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints: { nullable: false }
              - column:
                  name: tax_number
                  type: VARCHAR(100)
              - column:
                  name: commercial_registry
                  type: VARCHAR(100)
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints: { nullable: false }
              - column:
                  name: created_at
                  type: BIGINT
                  constraints: { nullable: false }
              - column:
                  name: updated_at
                  type: BIGINT
                  constraints: { nullable: false }

        - createTable:
            tableName: branches
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints: { primaryKey: true, nullable: false }
              - column:
