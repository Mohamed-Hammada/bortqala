                  type: VARCHAR(36)
                  constraints: { nullable: false }
              - column:
                  name: company_id
                  type: VARCHAR(36)
                  constraints: { nullable: false }
              - column:
                  name: code
                  type: VARCHAR(50)
                  constraints: { nullable: false }
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints: { nullable: false }
              - column:
                  name: location
                  type: VARCHAR(255)
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints: { nullable: false }
              - column:
                  name: created_at
                  type: BIGINT
                  constraints: { nullable: false }
              - column:
                  name: updated_at
                  type: BIGINT
                  constraints: { nullable: false }

        - createTable:
            tableName: warehouses
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: app_id
                  type: VARCHAR(36)
                  constraints: { nullable: false }
              - column:
                  name: branch_id
                  type: VARCHAR(36)
                  constraints: { nullable: false }
