databaseChangeLog:
  - changeSet:
      id: 20260727-31-create-manufacturing-and-qc-tables
      author: system
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: boms
      changes:
        - createTable:
            tableName: boms
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: app_id
                  type: VARCHAR(36)
                  constraints: { nullable: false }
              - column:
                  name: bom_code
                  type: VARCHAR(50)
                  constraints: { nullable: false }
              - column:
                  name: finished_good_name
                  type: VARCHAR(255)
                  constraints: { nullable: false }
              - column:
                  name: yield_quantity
                  type: NUMERIC(12,2)
                  defaultValueNumeric: 1.00
                  constraints: { nullable: false }
              - column:
                  name: notes
                  type: VARCHAR(500)
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints: { nullable: false }
              - column:
                  name: created_at
                  type: BIGINT
                  constraints: { nullable: false }
              - column:
                  name: updated_at
                  type: BIGINT
                  constraints: { nullable: false }

        - createTable:
            tableName: bom_lines
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: app_id
                  type: VARCHAR(36)
                  constraints: { nullable: false }
              - column:
                  name: bom_id
                  type: VARCHAR(36)
                  constraints: { nullable: false }
              - column:
                  name: raw_material_name
                  type: VARCHAR(255)
                  constraints: { nullable: false }
              - column:
                  name: required_quantity
                  type: NUMERIC(12,2)
                  constraints: { nullable: false }
              - column:
                  name: scrap_percentage
                  type: NUMERIC(5,2)
                  defaultValueNumeric: 0.00
                  constraints: { nullable: false }

        - createTable:
            tableName: production_orders
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: app_id
                  type: VARCHAR(36)
                  constraints: { nullable: false }
              - column:
                  name: order_number
                  type: VARCHAR(50)
                  constraints: { nullable: false }
              - column:
                  name: bom_id
                  type: VARCHAR(36)
                  constraints: { nullable: false }
              - column:
                  name: target_quantity
                  type: NUMERIC(12,2)
                  constraints: { nullable: false }
              - column:
                  name: start_date
                  type: DATE
                  constraints: { nullable: false }
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: PLANNED
                  constraints: { nullable: false }
              - column:
                  name: created_at
                  type: BIGINT
                  constraints: { nullable: false }
              - column:
                  name: updated_at
                  type: BIGINT
                  constraints: { nullable: false }

        - createTable:
            tableName: quality_inspections
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: app_id
                  type: VARCHAR(36)
                  constraints: { nullable: false }
              - column:
                  name: inspection_number
                  type: VARCHAR(50)
                  constraints: { nullable: false }
              - column:
                  name: inspection_date
                  type: DATE
                  constraints: { nullable: false }
              - column:
                  name: source_type
                  type: VARCHAR(50)
                  constraints: { nullable: false }
              - column:
                  name: passed_quantity
                  type: NUMERIC(12,2)
                  constraints: { nullable: false }
              - column:
                  name: failed_quantity
                  type: NUMERIC(12,2)
                  constraints: { nullable: false }
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: PASSED
                  constraints: { nullable: false }
              - column:
                  name: inspector_name
                  type: VARCHAR(100)
                  constraints: { nullable: false }
              - column:
                  name: notes
                  type: VARCHAR(500)
              - column:
                  name: created_at
                  type: BIGINT
                  constraints: { nullable: false }
