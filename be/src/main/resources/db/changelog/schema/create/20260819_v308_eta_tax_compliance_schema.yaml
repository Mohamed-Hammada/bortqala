databaseChangeLog:
  - changeSet:
      id: 20260819_v308_eta_tax_compliance_schema
      author: wolfn
      changes:
        - createTable:
            tableName: eta_configs
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: app_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: client_id
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: client_secret
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: issuer_tax_id
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: issuer_name
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: environment
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: token_url
                  type: VARCHAR(255)
              - column:
                  name: api_base_url
                  type: VARCHAR(255)
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: BIGINT
                  constraints:
                    nullable: false

