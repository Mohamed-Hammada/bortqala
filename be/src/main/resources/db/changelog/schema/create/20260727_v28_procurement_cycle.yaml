databaseChangeLog:
  - changeSet:
      id: 20260727-28-create-procurement-tables
      author: system
      validCheckSum: ANY
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: purchase_requests
      changes:
        - createTable:
            tableName: purchase_requests
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: app_id
                  type: VARCHAR(36)
                  constraints: { nullable: false }
              - column:
                  name: request_number
                  type: VARCHAR(50)
                  constraints: { nullable: false }
              - column:
                  name: request_date
                  type: DATE
                  constraints: { nullable: false }
              - column:
                  name: requested_by
                  type: VARCHAR(100)
                  constraints: { nullable: false }
              - column:
                  name: notes
                  type: VARCHAR(500)
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: DRAFT
                  constraints: { nullable: false }
              - column:
                  name: created_at
                  type: BIGINT
                  constraints: { nullable: false }
              - column:
                  name: updated_at
                  type: BIGINT
                  constraints: { nullable: false }

        - createTable:
            tableName: purchase_request_lines
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: app_id
                  type: VARCHAR(36)
                  constraints: { nullable: false }
              - column:
                  name: purchase_request_id
                  type: VARCHAR(36)
                  constraints: { nullable: false }
              - column:
                  name: item_name
                  type: VARCHAR(255)
                  constraints: { nullable: false }
              - column:
                  name: quantity
                  type: NUMERIC(12,2)
                  constraints: { nullable: false }
              - column:
                  name: unit_price_estimate
                  type: NUMERIC(12,2)

        - createTable:
            tableName: purchase_orders
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: app_id
                  type: VARCHAR(36)
                  constraints: { nullable: false }
              - column:
                  name: po_number
                  type: VARCHAR(50)
                  constraints: { nullable: false }
              - column:
                  name: po_date
                  type: DATE
                  constraints: { nullable: false }
              - column:
                  name: supplier_id
                  type: VARCHAR(36)
                  constraints: { nullable: false }
              - column:
                  name: purchase_request_id
                  type: VARCHAR(36)
              - column:
                  name: payment_terms
                  type: VARCHAR(255)
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: DRAFT
                  constraints: { nullable: false }
              - column:
                  name: total_amount
                  type: NUMERIC(15,2)
                  defaultValueNumeric: 0.00
                  constraints: { nullable: false }
              - column:
                  name: created_at
                  type: BIGINT
                  constraints: { nullable: false }
              - column:
                  name: updated_at
                  type: BIGINT
                  constraints: { nullable: false }

        - createTable:
            tableName: purchase_order_lines
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: app_id
                  type: VARCHAR(36)
                  constraints: { nullable: false }
              - column:
                  name: purchase_order_id
                  type: VARCHAR(36)
                  constraints: { nullable: false }
              - column:
                  name: item_name
                  type: VARCHAR(255)
                  constraints: { nullable: false }
              - column:
                  name: quantity
                  type: NUMERIC(12,2)
                  constraints: { nullable: false }
              - column:
                  name: unit_price
                  type: NUMERIC(12,2)
                  constraints: { nullable: false }
              - column:
                  name: line_total
                  type: NUMERIC(15,2)
                  constraints: { nullable: false }

        - createTable:
            tableName: goods_receipts
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: app_id
                  type: VARCHAR(36)
                  constraints: { nullable: false }
              - column:
                  name: grn_number
                  type: VARCHAR(50)
                  constraints: { nullable: false }
              - column:
                  name: receipt_date
                  type: DATE
                  constraints: { nullable: false }
              - column:
                  name: purchase_order_id
                  type: VARCHAR(36)
                  constraints: { nullable: false }
              - column:
                  name: supplier_id
                  type: VARCHAR(36)
                  constraints: { nullable: false }
              - column:
                  name: warehouse_id
                  type: VARCHAR(36)
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: POSTED
                  constraints: { nullable: false }
              - column:
                  name: created_at
                  type: BIGINT
                  constraints: { nullable: false }

        - createTable:
            tableName: supplier_invoices
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: app_id
                  type: VARCHAR(36)
                  constraints: { nullable: false }
              - column:
                  name: invoice_number
                  type: VARCHAR(50)
                  constraints: { nullable: false }
              - column:
                  name: supplier_id
                  type: VARCHAR(36)
                  constraints: { nullable: false }
              - column:
                  name: purchase_order_id
                  type: VARCHAR(36)
              - column:
                  name: invoice_date
                  type: DATE
                  constraints: { nullable: false }
              - column:
                  name: total_amount
                  type: NUMERIC(15,2)
                  constraints: { nullable: false }
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: UNPAID
                  constraints: { nullable: false }
              - column:
                  name: created_at
                  type: BIGINT
                  constraints: { nullable: false }
              - column:
                  name: updated_at
                  type: BIGINT
                  constraints: { nullable: false }

        - createTable:
            tableName: supplier_payments
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: app_id
                  type: VARCHAR(36)
                  constraints: { nullable: false }
              - column:
                  name: payment_number
                  type: VARCHAR(50)
                  constraints: { nullable: false }
              - column:
                  name: payment_date
                  type: DATE
                  constraints: { nullable: false }
              - column:
                  name: supplier_id
                  type: VARCHAR(36)
                  constraints: { nullable: false }
              - column:
                  name: supplier_invoice_id
                  type: VARCHAR(36)
                  constraints: { nullable: false }
              - column:
                  name: amount
                  type: NUMERIC(15,2)
                  constraints: { nullable: false }
              - column:
                  name: payment_method
                  type: VARCHAR(30)
                  constraints: { nullable: false }
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: POSTED
                  constraints: { nullable: false }
              - column:
                  name: created_at
                  type: BIGINT
                  constraints: { nullable: false }
