databaseChangeLog:
  - changeSet:
      id: 20260727-26-create-finance-system-tables
      author: system
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: accounts
      changes:
        - createTable:
            tableName: accounts
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: app_id
                  type: VARCHAR(36)
                  constraints: { nullable: false }
              - column:
                  name: code
                  type: VARCHAR(50)
                  constraints: { nullable: false }
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints: { nullable: false }
              - column:
                  name: type
                  type: VARCHAR(30)
                  constraints: { nullable: false }
              - column:
                  name: parent_id
                  type: VARCHAR(36)
              - column:
                  name: is_header
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints: { nullable: false }
              - column:
                  name: currency
                  type: VARCHAR(10)
                  defaultValue: EGP
                  constraints: { nullable: false }
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints: { nullable: false }
              - column:
                  name: created_at
                  type: BIGINT
                  constraints: { nullable: false }
              - column:
                  name: updated_at
                  type: BIGINT
                  constraints: { nullable: false }

        - createTable:
            tableName: journal_entries
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: app_id
                  type: VARCHAR(36)
                  constraints: { nullable: false }
              - column:
                  name: entry_number
                  type: VARCHAR(50)
                  constraints: { nullable: false }
              - column:
                  name: entry_date
                  type: DATE
                  constraints: { nullable: false }
              - column:
                  name: description
                  type: VARCHAR(500)
                  constraints: { nullable: false }
              - column:
                  name: reference
                  type: VARCHAR(100)
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: DRAFT
                  constraints: { nullable: false }
              - column:
                  name: fiscal_period_id
                  type: VARCHAR(36)
              - column:
                  name: posted_by
                  type: VARCHAR(100)
              - column:
                  name: posted_at
                  type: BIGINT
              - column:
                  name: created_at
                  type: BIGINT
                  constraints: { nullable: false }
              - column:
                  name: updated_at
                  type: BIGINT
                  constraints: { nullable: false }

        - createTable:
            tableName: journal_entry_lines
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: app_id
                  type: VARCHAR(36)
                  constraints: { nullable: false }
              - column:
                  name: journal_entry_id
                  type: VARCHAR(36)
                  constraints: { nullable: false }
              - column:
                  name: account_id
                  type: VARCHAR(36)
                  constraints: { nullable: false }
              - column:
                  name: party_id
                  type: VARCHAR(36)
              - column:
                  name: debit
                  type: NUMERIC(15,2)
                  defaultValueNumeric: 0.00
                  constraints: { nullable: false }
              - column:
                  name: credit
                  type: NUMERIC(15,2)
                  defaultValueNumeric: 0.00
                  constraints: { nullable: false }
              - column:
                  name: memo
                  type: VARCHAR(255)

        - createTable:
            tableName: bank_accounts
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: app_id
                  type: VARCHAR(36)
                  constraints: { nullable: false }
              - column:
                  name: bank_name
                  type: VARCHAR(255)
                  constraints: { nullable: false }
              - column:
                  name: account_number
                  type: VARCHAR(100)
                  constraints: { nullable: false }
              - column:
                  name: iban
                  type: VARCHAR(100)
              - column:
                  name: swift_code
                  type: VARCHAR(50)
              - column:
                  name: account_id
                  type: VARCHAR(36)
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints: { nullable: false }
              - column:
                  name: created_at
                  type: BIGINT
                  constraints: { nullable: false }
              - column:
                  name: updated_at
                  type: BIGINT
                  constraints: { nullable: false }

        - createTable:
            tableName: tax_rates
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: app_id
                  type: VARCHAR(36)
                  constraints: { nullable: false }
              - column:
                  name: code
                  type: VARCHAR(50)
                  constraints: { nullable: false }
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints: { nullable: false }
              - column:
                  name: rate_percentage
                  type: NUMERIC(5,2)
                  constraints: { nullable: false }
              - column:
                  name: tax_type
                  type: VARCHAR(30)
                  constraints: { nullable: false }
              - column:
                  name: account_id
                  type: VARCHAR(36)
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints: { nullable: false }
              - column:
                  name: created_at
                  type: BIGINT
                  constraints: { nullable: false }
              - column:
                  name: updated_at
                  type: BIGINT
                  constraints: { nullable: false }

        - createTable:
            tableName: currencies
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: app_id
                  type: VARCHAR(36)
                  constraints: { nullable: false }
              - column:
                  name: code
                  type: VARCHAR(10)
                  constraints: { nullable: false }
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints: { nullable: false }
              - column:
                  name: symbol
                  type: VARCHAR(10)
                  constraints: { nullable: false }
              - column:
                  name: is_base
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints: { nullable: false }
              - column:
                  name: exchange_rate
                  type: NUMERIC(12,4)
                  defaultValueNumeric: 1.0000
                  constraints: { nullable: false }
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints: { nullable: false }
              - column:
                  name: created_at
                  type: BIGINT
                  constraints: { nullable: false }
              - column:
                  name: updated_at
                  type: BIGINT
                  constraints: { nullable: false }
