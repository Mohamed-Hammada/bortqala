databaseChangeLog:
  - changeSet:
      id: 20260819_v297_employee_contracts_schema
      author: wolfn
      changes:
        - createTable:
            tableName: employee_contracts
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: app_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: contract_number
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: employee_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: contract_type
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: start_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: end_date
                  type: DATE
              - column:
                  name: probation_end_date
                  type: DATE
              - column:
                  name: notice_period_days
                  type: INT
                  defaultValueNumeric: 30
                  constraints:
                    nullable: false
              - column:
                  name: basic_salary
                  type: NUMERIC(15, 2)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: housing_allowance
                  type: NUMERIC(15, 2)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: transportation_allowance
                  type: NUMERIC(15, 2)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: other_allowances
                  type: NUMERIC(15, 2)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: gross_salary
                  type: NUMERIC(15, 2)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: job_title
                  type: VARCHAR(200)
              - column:
                  name: department_id
                  type: VARCHAR(36)
              - column:
                  name: notes
                  type: VARCHAR(1000)
              - column:
                  name: amendment_reason
                  type: VARCHAR(500)
              - column:
                  name: previous_contract_id
                  type: VARCHAR(36)
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: BIGINT
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_emp_contracts_app_emp
            tableName: employee_contracts
            columns:
              - column:
                  name: app_id
              - column:
                  name: employee_id
        - createIndex:
            indexName: idx_emp_contracts_app_num
            tableName: employee_contracts
            columns:
              - column:
                  name: app_id
              - column:
                  name: contract_number
