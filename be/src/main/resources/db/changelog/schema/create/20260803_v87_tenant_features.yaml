databaseChangeLog:
  - changeSet:
      id: 20260803-v87-tenant-features
      author: jules
      comment: Creates tenant_features table to control which incomplete modules are enabled per tenant.
      changes:
        - createTable:
            tableName: tenant_features
            columns:
              - column:
                  name: app_id
                  type: varchar(36)
                  constraints:
                    nullable: false
              - column:
                  name: feature_key
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: enabled
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: config_json
                  type: varchar(2000)
              - column:
                  name: version
                  type: bigint
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: varchar(160)
              - column:
                  name: updated_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: tenant_features
            columnNames: app_id, feature_key
            constraintName: pk_tenant_features
