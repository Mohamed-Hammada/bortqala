databaseChangeLog:
  - changeSet:
      id: 20260808-v133-category-scope-unification
      author: bemo-erp
      comment: "REM-002: unifies employee and worker categories onto a single canonical attendance_categories row. Adds a scope column (EMPLOYEE / WORKER / BOTH) to attendance_categories and a category_id link column to worker_categories so a worker category is a worker-specific configuration row pointing at the canonical category. The tenant-aware unique (app_id, code) constraint on attendance_categories already exists since the v1 baseline."
      changes:
        - addColumn:
            tableName: attendance_categories
            columns:
              - column: { name: scope, type: VARCHAR(20), defaultValue: "EMPLOYEE", constraints: { nullable: false } }
        - addColumn:
            tableName: worker_categories
            columns:
              - column: { name: category_id, type: VARCHAR(36) }
        - createIndex:
            tableName: worker_categories
            indexName: ix_worker_categories_app_category
            columns:
              - column: { name: app_id }
              - column: { name: category_id }
      rollback:
        - dropIndex: { tableName: worker_categories, indexName: ix_worker_categories_app_category }
        - dropColumn: { tableName: worker_categories, columnName: category_id }
        - dropColumn: { tableName: attendance_categories, columnName: scope }
