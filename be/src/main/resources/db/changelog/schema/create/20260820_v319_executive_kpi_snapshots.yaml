databaseChangeLog:
  - changeSet:
      id: 20260820-v319-001
      author: bemo-audit-team
      changes:
        - createTable:
            tableName: executive_kpi_snapshots
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: app_id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: snapshot_date
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: period_key
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: category
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: kpi_key
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: target_value
                  type: DECIMAL(19, 4)
              - column:
                  name: actual_value
                  type: DECIMAL(19, 4)
                  constraints:
                    nullable: false
              - column:
                  name: variance_value
                  type: DECIMAL(19, 4)
              - column:
                  name: variance_percent
                  type: DECIMAL(7, 2)
              - column:
                  name: trend_direction
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: reconciliation_status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: drilldown_url
                  type: VARCHAR(255)
              - column:
                  name: metadata_json
                  type: VARCHAR(2000)
              - column:
                  name: created_at
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_kpi_snapshot_app_period
            tableName: executive_kpi_snapshots
            columns:
              - column:
                  name: app_id
              - column:
                  name: period_key
        - createIndex:
            indexName: idx_kpi_snapshot_app_category
            tableName: executive_kpi_snapshots
            columns:
              - column:
                  name: app_id
              - column:
                  name: category
        - createIndex:
            indexName: idx_kpi_snapshot_app_key
            tableName: executive_kpi_snapshots
            columns:
              - column:
                  name: app_id
              - column:
                  name: kpi_key
