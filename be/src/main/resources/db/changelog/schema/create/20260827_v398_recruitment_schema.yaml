databaseChangeLog:
  - changeSet:
      id: 20260827_v398_recruitment_schema
      author: wolfn
      validCheckSum: ANY
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: job_openings
      changes:
        - createTable:
            tableName: job_openings
            columns:
              - column: { name: id, type: varchar(36), constraints: { nullable: false, primaryKey: true } }
              - column: { name: app_id, type: varchar(50), constraints: { nullable: false } }
              - column: { name: title_ar, type: varchar(300), constraints: { nullable: false } }
              - column: { name: title_en, type: varchar(300), constraints: { nullable: false } }
              - column: { name: department_id, type: varchar(50) }
              - column: { name: headcount, type: int, constraints: { nullable: false }, defaultValueNumeric: 1 }
              - column: { name: status, type: varchar(20), constraints: { nullable: false }, defaultValue: "DRAFT" }
              - column: { name: description, type: varchar(4000) }
              - column: { name: published, type: boolean, constraints: { nullable: false }, defaultValueBoolean: false }
              - column: { name: version, type: bigint, constraints: { nullable: false }, defaultValueNumeric: 0 }
              - column: { name: created_at, type: bigint, constraints: { nullable: false } }
              - column: { name: updated_at, type: bigint, constraints: { nullable: false } }
        - createTable:
            tableName: job_applications
            columns:
              - column: { name: id, type: varchar(36), constraints: { nullable: false, primaryKey: true } }
              - column: { name: app_id, type: varchar(50), constraints: { nullable: false } }
              - column: { name: opening_id, type: varchar(36), constraints: { nullable: false } }
              - column: { name: full_name, type: varchar(200), constraints: { nullable: false } }
              - column: { name: phone, type: varchar(50) }
              - column: { name: email, type: varchar(200) }
              - column: { name: source, type: varchar(50) }
              - column: { name: cv_attachment_id, type: varchar(100) }
              - column: { name: stage, type: varchar(20), constraints: { nullable: false }, defaultValue: "NEW" }
              - column: { name: rating, type: int }
              - column: { name: notes, type: varchar(4000) }
              - column: { name: converted_employee_id, type: varchar(36) }
              - column: { name: version, type: bigint, constraints: { nullable: false }, defaultValueNumeric: 0 }
              - column: { name: created_at, type: bigint, constraints: { nullable: false } }
              - column: { name: updated_at, type: bigint, constraints: { nullable: false } }
        - createTable:
            tableName: application_stage_events
            columns:
              - column: { name: id, type: varchar(36), constraints: { nullable: false, primaryKey: true } }
              - column: { name: app_id, type: varchar(50), constraints: { nullable: false } }
              - column: { name: application_id, type: varchar(36), constraints: { nullable: false } }
              - column: { name: from_stage, type: varchar(20), constraints: { nullable: false } }
              - column: { name: to_stage, type: varchar(20), constraints: { nullable: false } }
              - column: { name: actor, type: varchar(100), constraints: { nullable: false } }
              - column: { name: note, type: varchar(1000) }
              - column: { name: event_at, type: bigint, constraints: { nullable: false } }
      rollback:
        - dropTable:
            tableName: application_stage_events
        - dropTable:
            tableName: job_applications
        - dropTable:
            tableName: job_openings