databaseChangeLog:
  - changeSet:
      id: 20260819_v290_treasury_cash_cheque_schema
      author: wolfn
      changes:
        - createTable:
            tableName: cashboxes
            ifNotExists: true
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: app_id
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: code
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: branch_id
                  type: VARCHAR(36)
              - column:
                  name: currency
                  type: VARCHAR(10)
                  defaultValue: "EGP"
                  constraints:
                    nullable: false
              - column:
                  name: custodian_user_id
                  type: VARCHAR(100)
              - column:
                  name: gl_account_id
                  type: VARCHAR(36)
              - column:
                  name: current_balance
                  type: "DECIMAL(19, 4)"
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

        - createTable:
            tableName: cashbox_transactions
            ifNotExists: true
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: app_id
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: cashbox_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: transaction_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: "DECIMAL(19, 4)"
                  constraints:
                    nullable: false
              - column:
                  name: voucher_number
                  type: VARCHAR(50)
              - column:
                  name: counterparty_party_id
                  type: VARCHAR(36)
              - column:
                  name: description
                  type: VARCHAR(500)
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: "POSTED"
                  constraints:
                    nullable: false
              - column:
                  name: transaction_date
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: VARCHAR(100)
              - column:
                  name: created_at
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: BIGINT
                  constraints:
                    nullable: false

        - createTable:
            tableName: commercial_cheques
            ifNotExists: true
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: app_id
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: cheque_number
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: cheque_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: bank_name
                  type: VARCHAR(100)
              - column:
                  name: bank_account_id
                  type: VARCHAR(36)
              - column:
                  name: drawer_payee_name
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: party_id
                  type: VARCHAR(36)
              - column:
                  name: amount
                  type: "DECIMAL(19, 4)"
                  constraints:
                    nullable: false
              - column:
                  name: currency
                  type: VARCHAR(10)
                  defaultValue: "EGP"
                  constraints:
                    nullable: false
              - column:
                  name: issue_date
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: due_date
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: "RECEIVED"
                  constraints:
                    nullable: false
              - column:
                  name: bounce_reason
                  type: VARCHAR(255)
              - column:
                  name: notes
                  type: VARCHAR(500)
              - column:
                  name: journal_entry_id
                  type: VARCHAR(36)
              - column:
                  name: created_at
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

        - createIndex:
            indexName: idx_cb_app_code
            tableName: cashboxes
            columns:
              - column:
                  name: app_id
              - column:
                  name: code
        - createIndex:
            indexName: idx_cbt_cashbox
            tableName: cashbox_transactions
            columns:
              - column:
                  name: cashbox_id
        - createIndex:
            indexName: idx_chq_app_number
            tableName: commercial_cheques
            columns:
              - column:
                  name: app_id
              - column:
                  name: cheque_number
