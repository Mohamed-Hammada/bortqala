databaseChangeLog:
  - changeSet:
      id: 20260819-v278-project-claims-schema
      author: bemo-architect
      changes:
        # 1. Project Progress Claims Table
        - createTable:
            tableName: project_progress_claims
            columns:
              - column: { name: id, type: VARCHAR(36), constraints: { primaryKey: true, nullable: false } }
              - column: { name: app_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: claim_number, type: VARCHAR(64), constraints: { nullable: false } }
              - column: { name: claim_type, type: VARCHAR(30), defaultValue: "OWNER_IPC", constraints: { nullable: false } }
              - column: { name: claim_kind, type: VARCHAR(30), defaultValue: "INTERIM", constraints: { nullable: false } }
              - column: { name: claim_sequence_number, type: INT, defaultValueNumeric: 1, constraints: { nullable: false } }
              - column: { name: project_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: party_id, type: VARCHAR(36) }
              - column: { name: period_start_date, type: DATE, constraints: { nullable: false } }
              - column: { name: period_end_date, type: DATE, constraints: { nullable: false } }
              - column: { name: submission_date, type: BIGINT }
              - column: { name: currency_code, type: VARCHAR(10), defaultValue: "EGP", constraints: { nullable: false } }
              - column: { name: previous_gross_amount, type: "NUMERIC(18, 2)", defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: current_gross_amount, type: "NUMERIC(18, 2)", defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: cumulative_gross_amount, type: "NUMERIC(18, 2)", defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: previous_retention_amount, type: "NUMERIC(18, 2)", defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: current_retention_amount, type: "NUMERIC(18, 2)", defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: cumulative_retention_amount, type: "NUMERIC(18, 2)", defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: previous_advance_recovery_amount, type: "NUMERIC(18, 2)", defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: current_advance_recovery_amount, type: "NUMERIC(18, 2)", defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: cumulative_advance_recovery_amount, type: "NUMERIC(18, 2)", defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: current_tax_amount, type: "NUMERIC(18, 2)", defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: current_deductions_amount, type: "NUMERIC(18, 2)", defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: current_net_payable_amount, type: "NUMERIC(18, 2)", defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: cumulative_net_paid_amount, type: "NUMERIC(18, 2)", defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: status, type: VARCHAR(30), defaultValue: "DRAFT", constraints: { nullable: false } }
              - column: { name: certified_by_user_id, type: VARCHAR(36) }
              - column: { name: certified_at, type: BIGINT }
              - column: { name: certification_notes, type: TEXT }
              - column: { name: posted_finance_journal_id, type: VARCHAR(36) }
              - column: { name: posted_invoice_id, type: VARCHAR(36) }
              - column: { name: posted_at, type: BIGINT }
              - column: { name: notes, type: TEXT }
              - column: { name: created_at, type: BIGINT, constraints: { nullable: false } }
              - column: { name: updated_at, type: BIGINT, constraints: { nullable: false } }
              - column: { name: version, type: BIGINT, defaultValueNumeric: 0, constraints: { nullable: false } }

        - addUniqueConstraint:
            tableName: project_progress_claims
            columnNames: app_id, claim_number
            constraintName: uq_prj_claims_app_num

        - createIndex:
            tableName: project_progress_claims
            indexName: idx_prj_claims_app_prj
            columns:
              - column: { name: app_id }
              - column: { name: project_id }
              - column: { name: claim_type }

        # 2. Progress Claim Lines Table
        - createTable:
            tableName: progress_claim_lines
            columns:
              - column: { name: id, type: VARCHAR(36), constraints: { primaryKey: true, nullable: false } }
              - column: { name: app_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: claim_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: line_type, type: VARCHAR(30), defaultValue: "BOQ_ITEM", constraints: { nullable: false } }
              - column: { name: wbs_node_id, type: VARCHAR(36) }
              - column: { name: item_code, type: VARCHAR(50), constraints: { nullable: false } }
              - column: { name: description, type: VARCHAR(500), constraints: { nullable: false } }
              - column: { name: unit_of_measure, type: VARCHAR(30), constraints: { nullable: false } }
              - column: { name: contract_quantity, type: "NUMERIC(18, 4)", defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: unit_rate, type: "NUMERIC(18, 4)", defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: previous_quantity, type: "NUMERIC(18, 4)", defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: current_quantity, type: "NUMERIC(18, 4)", defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: cumulative_quantity, type: "NUMERIC(18, 4)", defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: previous_amount, type: "NUMERIC(18, 2)", defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: current_amount, type: "NUMERIC(18, 2)", defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: cumulative_amount, type: "NUMERIC(18, 2)", defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: percent_complete, type: "NUMERIC(5, 2)", defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: remarks, type: VARCHAR(500) }
              - column: { name: sort_order, type: INT, defaultValueNumeric: 0, constraints: { nullable: false } }

        - createIndex:
            tableName: progress_claim_lines
            indexName: idx_claim_lines_app_claim
            columns:
              - column: { name: app_id }
              - column: { name: claim_id }
              - column: { name: sort_order }

        # 3. Progress Claim Adjustments Table
        - createTable:
            tableName: progress_claim_adjustments
            columns:
              - column: { name: id, type: VARCHAR(36), constraints: { primaryKey: true, nullable: false } }
              - column: { name: app_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: claim_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: adjustment_type, type: VARCHAR(30), constraints: { nullable: false } }
              - column: { name: description, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: percentage_rate, type: "NUMERIC(5, 2)" }
              - column: { name: calculation_basis_amount, type: "NUMERIC(18, 2)", defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: adjustment_amount, type: "NUMERIC(18, 2)", defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: is_addition, type: BOOLEAN, defaultValueBoolean: false, constraints: { nullable: false } }
              - column: { name: notes, type: TEXT }

        - createIndex:
            tableName: progress_claim_adjustments
            indexName: idx_claim_adj_app_claim
            columns:
              - column: { name: app_id }
              - column: { name: claim_id }
