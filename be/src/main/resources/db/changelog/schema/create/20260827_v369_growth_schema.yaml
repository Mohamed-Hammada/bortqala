databaseChangeLog:
  - changeSet:
      id: 20260827_v369_growth_schema
      author: wolfn
      validCheckSum: ANY
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: loyalty_accounts
      changes:
        - createTable:
            tableName: loyalty_accounts
            columns:
              - column: { name: id, type: varchar(36), constraints: { nullable: false, primaryKey: true } }
              - column: { name: app_id, type: varchar(50), constraints: { nullable: false } }
              - column: { name: party_id, type: varchar(36), constraints: { nullable: false } }
              - column: { name: points_balance, type: numeric(15,2), constraints: { nullable: false }, defaultValueNumeric: 0 }
              - column: { name: total_earned, type: numeric(15,2), constraints: { nullable: false }, defaultValueNumeric: 0 }
              - column: { name: total_redeemed, type: numeric(15,2), constraints: { nullable: false }, defaultValueNumeric: 0 }
              - column: { name: total_expired, type: numeric(15,2), constraints: { nullable: false }, defaultValueNumeric: 0 }
              - column: { name: version, type: bigint, constraints: { nullable: false }, defaultValueNumeric: 0 }
              - column: { name: created_at, type: bigint, constraints: { nullable: false } }
              - column: { name: updated_at, type: bigint, constraints: { nullable: false } }
        - addUniqueConstraint:
            tableName: loyalty_accounts
            columnNames: app_id, party_id
            constraintName: uq_loyalty_account_app_party
        - createIndex:
            tableName: loyalty_accounts
            indexName: idx_loyalty_account_app
            columns:
              - column: { name: app_id }
        - createIndex:
            tableName: loyalty_accounts
            indexName: idx_loyalty_account_party
            columns:
              - column: { name: party_id }
      rollback:
        - dropTable:
            tableName: loyalty_accounts

  - changeSet:
