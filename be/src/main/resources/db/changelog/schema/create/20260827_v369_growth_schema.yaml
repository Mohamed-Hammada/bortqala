              - column: { name: loyalty_account_id, type: varchar(36), constraints: { nullable: false } }
              - column: { name: party_id, type: varchar(36), constraints: { nullable: false } }
              - column: { name: type, type: varchar(20), constraints: { nullable: false } }
              - column: { name: points, type: numeric(15,2), constraints: { nullable: false } }
              - column: { name: running_balance, type: numeric(15,2), constraints: { nullable: false } }
              - column: { name: reference_type, type: varchar(50) }
