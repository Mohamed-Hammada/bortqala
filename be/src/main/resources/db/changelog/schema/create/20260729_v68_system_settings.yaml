databaseChangeLog:
  - changeSet:
      id: 20260729-v68-create-system-settings
      author: Mohamed-Hammada
      comment: Stores durable global runtime settings such as the client cache generation.
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: ${database.defaultSchemaName}.system_settings
      changes:
        - createTable:
            tableName: system_settings
            columns:
              - column:
                  name: setting_key
                  type: varchar(100)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: setting_value
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: varchar(150)
              - column:
                  name: change_reason
                  type: varchar(500)
      rollback:
        - dropTable:
            tableName: system_settings
