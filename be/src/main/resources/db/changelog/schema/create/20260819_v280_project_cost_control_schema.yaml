databaseChangeLog:
  - changeSet:
      id: 20260819-v280-project-cost-control-schema
      author: bemo-architect
      changes:
        # 1. Project Budget Versions Table
        - createTable:
            tableName: project_budget_versions
            columns:
              - column: { name: id, type: VARCHAR(36), constraints: { primaryKey: true, nullable: false } }
              - column: { name: app_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: project_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: version_number, type: INT, defaultValueNumeric: 1, constraints: { nullable: false } }
              - column: { name: version_name, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: status, type: VARCHAR(30), defaultValue: "DRAFT", constraints: { nullable: false } }
              - column: { name: approved_by_user_id, type: VARCHAR(36) }
              - column: { name: approved_at, type: BIGINT }
              - column: { name: total_budget_amount, type: "NUMERIC(18, 2)", defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: notes, type: TEXT }
              - column: { name: created_at, type: BIGINT, constraints: { nullable: false } }
              - column: { name: updated_at, type: BIGINT, constraints: { nullable: false } }
              - column: { name: version, type: BIGINT, defaultValueNumeric: 0, constraints: { nullable: false } }

        - addUniqueConstraint:
            tableName: project_budget_versions
            columnNames: app_id, project_id, version_number
            constraintName: uq_prj_budget_ver_num

        - createIndex:
            tableName: project_budget_versions
            indexName: idx_prj_budget_ver_app_prj
            columns:
              - column: { name: app_id }
              - column: { name: project_id }
              - column: { name: status }

        # 2. Project Budget Lines Table
        - createTable:
            tableName: project_budget_lines
            columns:
              - column: { name: id, type: VARCHAR(36), constraints: { primaryKey: true, nullable: false } }
              - column: { name: app_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: budget_version_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: project_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: wbs_node_id, type: VARCHAR(36) }
              - column: { name: cost_code_id, type: VARCHAR(36) }
              - column: { name: cost_category, type: VARCHAR(30), defaultValue: "MATERIAL", constraints: { nullable: false } }
              - column: { name: description, type: VARCHAR(500), constraints: { nullable: false } }
              - column: { name: budget_quantity, type: "NUMERIC(18, 4)", defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: unit_of_measure, type: VARCHAR(30), defaultValue: "PCS", constraints: { nullable: false } }
              - column: { name: budget_unit_rate, type: "NUMERIC(18, 4)", defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: budget_amount, type: "NUMERIC(18, 2)", defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: sort_order, type: INT, defaultValueNumeric: 0, constraints: { nullable: false } }

        - createIndex:
            tableName: project_budget_lines
            indexName: idx_budget_lines_app_ver
            columns:
              - column: { name: app_id }
              - column: { name: budget_version_id }
              - column: { name: sort_order }

        # 3. Project Cost Ledger Entries Table
        - createTable:
            tableName: project_cost_ledger_entries
            columns:
              - column: { name: id, type: VARCHAR(36), constraints: { primaryKey: true, nullable: false } }
              - column: { name: app_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: project_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: wbs_node_id, type: VARCHAR(36) }
              - column: { name: cost_code_id, type: VARCHAR(36) }
              - column: { name: cost_category, type: VARCHAR(30), defaultValue: "MATERIAL", constraints: { nullable: false } }
              - column: { name: entry_type, type: VARCHAR(30), constraints: { nullable: false } }
              - column: { name: source_module, type: VARCHAR(50), constraints: { nullable: false } }
              - column: { name: source_document_id, type: VARCHAR(36) }
              - column: { name: source_document_number, type: VARCHAR(64) }
              - column: { name: entry_date, type: DATE, constraints: { nullable: false } }
              - column: { name: description, type: VARCHAR(500), constraints: { nullable: false } }
              - column: { name: quantity, type: "NUMERIC(18, 4)", defaultValueNumeric: 0 }
              - column: { name: unit_rate, type: "NUMERIC(18, 4)", defaultValueNumeric: 0 }
              - column: { name: amount, type: "NUMERIC(18, 2)", defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: currency_code, type: VARCHAR(10), defaultValue: "EGP", constraints: { nullable: false } }
              - column: { name: posted_at, type: BIGINT }
              - column: { name: created_at, type: BIGINT, constraints: { nullable: false } }

        - createIndex:
            tableName: project_cost_ledger_entries
            indexName: idx_cost_ledger_app_prj_type
            columns:
              - column: { name: app_id }
              - column: { name: project_id }
              - column: { name: entry_type }
              - column: { name: entry_date }

        # 4. Project Forecast EAC Table
        - createTable:
            tableName: project_forecast_eac
            columns:
              - column: { name: id, type: VARCHAR(36), constraints: { primaryKey: true, nullable: false } }
              - column: { name: app_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: project_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: wbs_node_id, type: VARCHAR(36) }
              - column: { name: cost_code_id, type: VARCHAR(36) }
              - column: { name: cost_category, type: VARCHAR(30), defaultValue: "MATERIAL", constraints: { nullable: false } }
              - column: { name: budget_amount, type: "NUMERIC(18, 2)", defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: actual_cost_to_date, type: "NUMERIC(18, 2)", defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: committed_cost, type: "NUMERIC(18, 2)", defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: estimate_to_complete, type: "NUMERIC(18, 2)", defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: estimate_at_completion, type: "NUMERIC(18, 2)", defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: variance_at_completion, type: "NUMERIC(18, 2)", defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: forecast_profit_margin_percent, type: "NUMERIC(5, 2)", defaultValueNumeric: 0 }
              - column: { name: notes, type: TEXT }
              - column: { name: updated_at, type: BIGINT, constraints: { nullable: false } }

        - createIndex:
            tableName: project_forecast_eac
            indexName: idx_prj_forecast_app_prj
            columns:
              - column: { name: app_id }
              - column: { name: project_id }
