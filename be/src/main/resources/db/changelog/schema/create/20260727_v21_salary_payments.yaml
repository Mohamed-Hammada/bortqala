databaseChangeLog:
  - changeSet:
      id: 20260727-21-salary-payments-table
      author: system
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: salary_payment
      changes:
        - createTable:
            tableName: salary_payment
            columns:
              - column:
                  name: id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: app_id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_salary_payment_app
                    references: apps(id)
              - column:
                  name: employee_id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_salary_payment_employee
                    references: employees(id)
              - column:
                  name: report_id
                  type: VARCHAR(64)
              - column:
                  name: period_year
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: period_month
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: period_kind
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: period_start
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: period_end
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: gross_amount
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false
              - column:
                  name: advances_deducted
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false
              - column:
                  name: other_deductions
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false
              - column:
                  name: bonuses
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false
              - column:
                  name: net_amount
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false
              - column:
                  name: payment_status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: paid_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: payment_method
                  type: VARCHAR(32)
              - column:
                  name: reference_code
                  type: VARCHAR(100)
              - column:
                  name: note
                  type: VARCHAR(500)
              - column:
                  name: created_by
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_salary_payment_app_emp_period
            tableName: salary_payment
            columns:
              - column:
                  name: app_id
              - column:
                  name: employee_id
              - column:
                  name: period_year
              - column:
                  name: period_month

  - changeSet:
      id: 20260727-21-append-payroll-to-allowed-menus
      author: system
      runOnChange: true
      validCheckSum: "*"
      changes:
        - sql:
            dbms: postgresql
            splitStatements: true
            sql: |
              UPDATE app_users SET allowed_menus = CONCAT(allowed_menus, ',payroll') WHERE allowed_menus IS NOT NULL AND allowed_menus NOT LIKE '%payroll%';
        - sql:
            dbms: h2
            splitStatements: true
            sql: |
              UPDATE app_users SET allowed_menus = CONCAT(allowed_menus, ',payroll') WHERE allowed_menus IS NOT NULL AND allowed_menus NOT LIKE '%payroll%';
