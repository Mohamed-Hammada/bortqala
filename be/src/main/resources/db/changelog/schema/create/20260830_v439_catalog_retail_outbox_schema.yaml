databaseChangeLog:
  - changeSet:
      id: 20260830-v439-create-catalog-retail-outbox-schema
      author: Mohamed-Hammada
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: catalog_products
      changes:
        - createTable:
            tableName: catalog_products
            columns:
              - column: { name: id, type: VARCHAR(36), constraints: { primaryKey: true, nullable: false } }
              - column: { name: app_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: sku, type: VARCHAR(60), constraints: { nullable: false } }
              - column: { name: slug, type: VARCHAR(120), constraints: { nullable: false } }
              - column: { name: name, type: VARCHAR(200), constraints: { nullable: false } }
              - column: { name: name_ar, type: VARCHAR(200) }
              - column: { name: description, type: VARCHAR(1000) }
              - column: { name: category_slug, type: VARCHAR(60), constraints: { nullable: false } }
              - column: { name: category_name, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: brand_slug, type: VARCHAR(60), constraints: { nullable: false } }
              - column: { name: brand_name, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: public_price, type: "DECIMAL(15,2)", constraints: { nullable: false } }
              - column: { name: compare_at_price, type: "DECIMAL(15,2)" }
              - column: { name: currency, type: VARCHAR(10), defaultValue: "EGP", constraints: { nullable: false } }
              - column: { name: stock_status, type: VARCHAR(30), defaultValue: "IN_STOCK", constraints: { nullable: false } }
              - column: { name: image_url, type: VARCHAR(500) }
              - column: { name: specifications_json, type: CLOB }
              - column: { name: is_published, type: BOOLEAN, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: is_featured, type: BOOLEAN, defaultValueBoolean: false, constraints: { nullable: false } }
              - column: { name: created_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }

        - createTable:
            tableName: retail_serialized_devices
            columns:
              - column: { name: id, type: VARCHAR(36), constraints: { primaryKey: true, nullable: false } }
              - column: { name: app_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: serial_number, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: imei, type: VARCHAR(50) }
              - column: { name: brand, type: VARCHAR(60), constraints: { nullable: false } }
              - column: { name: model, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: cpu, type: VARCHAR(80), constraints: { nullable: false } }
              - column: { name: cpu_generation, type: VARCHAR(40) }
              - column: { name: ram_gb, type: INT, constraints: { nullable: false } }
              - column: { name: ram_type, type: VARCHAR(30) }
              - column: { name: storage_gb, type: INT, constraints: { nullable: false } }
              - column: { name: storage_type, type: VARCHAR(30), constraints: { nullable: false } }
              - column: { name: gpu, type: VARCHAR(80) }
              - column: { name: screen_size_inch, type: "DECIMAL(4,1)" }
              - column: { name: resolution, type: VARCHAR(30) }
              - column: { name: refresh_rate_hz, type: INT }
              - column: { name: os, type: VARCHAR(50) }
              - column: { name: keyboard_layout, type: VARCHAR(30) }
              - column: { name: color, type: VARCHAR(40) }
              - column: { name: condition_grade, type: VARCHAR(30), defaultValue: "NEW", constraints: { nullable: false } }
              - column: { name: purchase_price, type: "DECIMAL(15,2)", constraints: { nullable: false } }
              - column: { name: selling_price, type: "DECIMAL(15,2)", constraints: { nullable: false } }
              - column: { name: status, type: VARCHAR(30), defaultValue: "IN_STOCK", constraints: { nullable: false } }
              - column: { name: supplier_id, type: VARCHAR(36) }
              - column: { name: purchase_date, type: timestamp }
              - column: { name: supplier_warranty_months, type: INT, defaultValueNumeric: 12 }
              - column: { name: customer_id, type: VARCHAR(36) }
              - column: { name: customer_name, type: VARCHAR(150) }
              - column: { name: sale_date, type: timestamp }
              - column: { name: customer_warranty_months, type: INT, defaultValueNumeric: 12 }
              - column: { name: warranty_end_date, type: timestamp }
              - column: { name: version, type: BIGINT, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: created_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }

        - createTable:
            tableName: retail_device_repair_tickets
            columns:
              - column: { name: id, type: VARCHAR(36), constraints: { primaryKey: true, nullable: false } }
              - column: { name: app_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: ticket_number, type: VARCHAR(50), constraints: { nullable: false } }
              - column: { name: device_id, type: VARCHAR(36) }
              - column: { name: serial_number, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: customer_name, type: VARCHAR(150), constraints: { nullable: false } }
              - column: { name: customer_phone, type: VARCHAR(40), constraints: { nullable: false } }
              - column: { name: reported_issue, type: VARCHAR(500), constraints: { nullable: false } }
              - column: { name: diagnosis, type: VARCHAR(500) }
              - column: { name: technician_notes, type: VARCHAR(500) }
              - column: { name: cost_amount, type: "DECIMAL(15,2)", defaultValueNumeric: 0.00 }
              - column: { name: charged_amount, type: "DECIMAL(15,2)", defaultValueNumeric: 0.00 }
              - column: { name: status, type: VARCHAR(30), defaultValue: "RECEIVED", constraints: { nullable: false } }
              - column: { name: is_under_warranty, type: BOOLEAN, defaultValueBoolean: false, constraints: { nullable: false } }
              - column: { name: version, type: BIGINT, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: created_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }

        - createTable:
            tableName: sys_outbox_events
            columns:
              - column: { name: id, type: VARCHAR(36), constraints: { primaryKey: true, nullable: false } }
              - column: { name: app_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: event_type, type: VARCHAR(80), constraints: { nullable: false } }
              - column: { name: aggregate_type, type: VARCHAR(80), constraints: { nullable: false } }
              - column: { name: aggregate_id, type: VARCHAR(60), constraints: { nullable: false } }
              - column: { name: payload_json, type: CLOB, constraints: { nullable: false } }
              - column: { name: status, type: VARCHAR(30), defaultValue: "PENDING", constraints: { nullable: false } }
              - column: { name: retry_count, type: INT, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: max_retries, type: INT, defaultValueNumeric: 5, constraints: { nullable: false } }
              - column: { name: last_error, type: VARCHAR(500) }
              - column: { name: created_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
              - column: { name: processed_at, type: timestamp }

        - createIndex:
            tableName: catalog_products
            indexName: idx_catalog_app_slug
            columns:
              - column: { name: app_id }
              - column: { name: slug }

        - createIndex:
            tableName: catalog_products
            indexName: idx_catalog_app_category
            columns:
              - column: { name: app_id }
              - column: { name: category_slug }

        - createIndex:
            tableName: retail_serialized_devices
            indexName: idx_retail_device_app_serial
            columns:
              - column: { name: app_id }
              - column: { name: serial_number }

        - createIndex:
            tableName: sys_outbox_events
            indexName: idx_outbox_app_status
            columns:
              - column: { name: app_id }
              - column: { name: status }

      rollback:
        - dropTable: { tableName: sys_outbox_events }
        - dropTable: { tableName: retail_device_repair_tickets }
        - dropTable: { tableName: retail_serialized_devices }
        - dropTable: { tableName: catalog_products }
