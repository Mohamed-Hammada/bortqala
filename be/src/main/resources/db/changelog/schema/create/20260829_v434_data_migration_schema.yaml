databaseChangeLog:
  - changeSet:
      id: 20260829-v434-create-data-migration-schema
      author: Mohamed-Hammada
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: sys_data_migration_batches
      changes:
        - createTable:
            tableName: sys_data_migration_batches
            columns:
              - column: { name: id, type: VARCHAR(36), constraints: { primaryKey: true, nullable: false } }
              - column: { name: app_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: entity_type, type: VARCHAR(40), constraints: { nullable: false } }
              - column: { name: status, type: VARCHAR(30), constraints: { nullable: false } }
              - column: { name: file_name, type: VARCHAR(255) }
              - column: { name: total_records, type: INT, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: imported_records, type: INT, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: rejected_records, type: INT, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: duplicate_records, type: INT, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: total_amount, type: "DECIMAL(18,2)", defaultValueNumeric: 0.00 }
              - column: { name: gl_account_code, type: VARCHAR(50) }
              - column: { name: gl_balance_match, type: BOOLEAN, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: created_by, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: started_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
              - column: { name: completed_at, type: timestamp }
              - column: { name: version, type: BIGINT, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: created_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }

        - createTable:
            tableName: sys_data_migration_records
            columns:
              - column: { name: id, type: VARCHAR(36), constraints: { primaryKey: true, nullable: false } }
              - column: { name: app_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: batch_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: row_number, type: INT, constraints: { nullable: false } }
              - column: { name: raw_json_data, type: CLOB, constraints: { nullable: false } }
              - column: { name: status, type: VARCHAR(30), constraints: { nullable: false } }
              - column: { name: error_message, type: VARCHAR(500) }
              - column: { name: created_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }

        - createIndex:
            tableName: sys_data_migration_batches
            indexName: idx_migration_batch_app_entity
            columns:
              - column: { name: app_id }
              - column: { name: entity_type }

        - createIndex:
            tableName: sys_data_migration_records
            indexName: idx_migration_record_batch_row
            columns:
              - column: { name: batch_id }
              - column: { name: row_number }

      rollback:
        - dropTable: { tableName: sys_data_migration_records }
        - dropTable: { tableName: sys_data_migration_batches }
