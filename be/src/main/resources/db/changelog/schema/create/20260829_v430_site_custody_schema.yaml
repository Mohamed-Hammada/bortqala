databaseChangeLog:
  - changeSet:
      id: 20260829-v430-001
      author: bemo-platform
      changes:
        - createTable:
            tableName: project_site_custodies
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: app_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: project_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: custody_code
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: custodian_employee_id
                  type: VARCHAR(36)
              - column:
                  name: custodian_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: custody_type
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: initial_amount
                  type: DECIMAL(14,2)
                  constraints:
                    nullable: false
              - column:
                  name: remaining_balance
                  type: DECIMAL(14,2)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: issued_at
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: settled_at
                  type: BIGINT
              - column:
                  name: notes
                  type: TEXT
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: BIGINT
                  constraints:
                    nullable: false

