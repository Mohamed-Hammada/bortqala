databaseChangeLog:
  - changeSet:
      id: 20260908-v465-daily-report-attachments
      author: Claude
      comment: >
        Roadmap item 02 (Daily Site Progress & Field Reporting) quality gap: "No attachment/evidence
        model." Adds a real file-backed evidence attachment table for ProjectDailyReport, following
        the same byte[]-in-bytea storage pattern already established by SupplierDocument.
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: daily_report_attachments
      changes:
        - createTable:
            tableName: daily_report_attachments
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tenant_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: daily_report_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: file_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: content_type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: file_size
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: file_content
                  type: bytea
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(500)
              - column:
                  name: uploaded_by
                  type: VARCHAR(64)
              - column:
                  name: uploaded_at
                  type: timestamp
                  constraints:
                    nullable: false
        - createIndex:
            tableName: daily_report_attachments
            indexName: idx_dpr_attachments_report_id
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: daily_report_id
      rollback:
        - dropTable:
            tableName: daily_report_attachments
