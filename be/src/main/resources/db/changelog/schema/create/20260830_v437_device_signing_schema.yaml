databaseChangeLog:
  - changeSet:
      id: 20260830-v437-create-device-signing-schema
      author: Mohamed-Hammada
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: sec_user_devices
      changes:
        - createTable:
            tableName: sec_user_devices
            columns:
              - column: { name: id, type: VARCHAR(36), constraints: { primaryKey: true, nullable: false } }
              - column: { name: app_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: user_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: device_identifier, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: device_name, type: VARCHAR(150), constraints: { nullable: false } }
              - column: { name: public_key, type: VARCHAR(2048), constraints: { nullable: false } }
              - column: { name: algorithm, type: VARCHAR(50), constraints: { nullable: false } }
              - column: { name: status, type: VARCHAR(30), defaultValue: "ACTIVE", constraints: { nullable: false } }
              - column: { name: revoked_reason, type: VARCHAR(255) }
              - column: { name: enrolled_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
              - column: { name: revoked_at, type: timestamp }
              - column: { name: last_used_at, type: timestamp }
              - column: { name: version, type: BIGINT, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: created_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }

        - createTable:
            tableName: sec_device_signing_challenges
            columns:
              - column: { name: id, type: VARCHAR(36), constraints: { primaryKey: true, nullable: false } }
              - column: { name: app_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: user_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: device_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: nonce, type: VARCHAR(128), constraints: { nullable: false } }
              - column: { name: operation_type, type: VARCHAR(60), constraints: { nullable: false } }
              - column: { name: payload_hash, type: VARCHAR(64), constraints: { nullable: false } }
              - column: { name: status, type: VARCHAR(30), defaultValue: "PENDING", constraints: { nullable: false } }
              - column: { name: expires_at, type: timestamp, constraints: { nullable: false } }
              - column: { name: created_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }

        - createTable:
            tableName: sec_device_signature_logs
            columns:
              - column: { name: id, type: VARCHAR(36), constraints: { primaryKey: true, nullable: false } }
              - column: { name: app_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: user_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: device_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: challenge_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: operation_type, type: VARCHAR(60), constraints: { nullable: false } }
              - column: { name: signature_value, type: VARCHAR(1024), constraints: { nullable: false } }
              - column: { name: status, type: VARCHAR(30), constraints: { nullable: false } }
              - column: { name: verified_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }

        - createIndex:
            tableName: sec_user_devices
            indexName: idx_user_devices_app_user
            columns:
              - column: { name: app_id }
              - column: { name: user_id }

        - createIndex:
            tableName: sec_device_signing_challenges
            indexName: idx_challenge_app_user
            columns:
              - column: { name: app_id }
              - column: { name: user_id }

        - createIndex:
            tableName: sec_device_signature_logs
            indexName: idx_sig_log_app_user
            columns:
              - column: { name: app_id }
              - column: { name: user_id }

      rollback:
        - dropTable: { tableName: sec_device_signature_logs }
        - dropTable: { tableName: sec_device_signing_challenges }
        - dropTable: { tableName: sec_user_devices }
