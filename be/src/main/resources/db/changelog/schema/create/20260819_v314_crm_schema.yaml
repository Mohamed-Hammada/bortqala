                  constraints:
                    nullable: false

        - createTable:
            tableName: crm_conversations
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: app_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: channel_type
