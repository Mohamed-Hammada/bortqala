databaseChangeLog:
  - changeSet:
      id: 20260819_v314_crm_schema
      author: wolfn
      changes:
        - createTable:
            tableName: crm_leads
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: app_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: lead_code
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: phone
                  type: VARCHAR(50)
              - column:
                  name: email
                  type: VARCHAR(100)
              - column:
                  name: company_name
                  type: VARCHAR(150)
              - column:
                  name: source
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: estimated_value
                  type: NUMERIC(15, 2)
                  defaultValueNumeric: 0.0
                  constraints:
                    nullable: false
              - column:
                  name: assigned_sales_agent_id
                  type: VARCHAR(36)
              - column:
                  name: business_party_id
                  type: VARCHAR(36)
              - column:
                  name: notes
                  type: VARCHAR(1000)
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: BIGINT
                  constraints:
                    nullable: false

        - createTable:
            tableName: crm_activities
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: app_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: lead_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: activity_type
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: summary
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: details
                  type: VARCHAR(1000)
              - column:
                  name: due_date
                  type: BIGINT
              - column:
                  name: completed_at
                  type: BIGINT
              - column:
                  name: assigned_to_user_id
                  type: VARCHAR(36)
              - column:
                  name: created_at
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: BIGINT
                  constraints:
                    nullable: false

        - createTable:
            tableName: crm_channel_configs
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: app_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: channel_type
                  type: VARCHAR(30)
                  constraints:
