databaseChangeLog:
  - changeSet:
      id: 20260905-v459-owner-executive-cockpit-schema
      author: bemo-tech-lead
      comment: "TASK-05: Owner Executive Cockpit & Profit Pulse schema with period targets and variance tracking."
      changes:
        - createTable:
            tableName: executive_cockpit_targets
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: app_id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: period_key
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: target_revenue
                  type: NUMERIC(15, 2)
              - column:
                  name: target_gross_margin_percent
                  type: NUMERIC(5, 2)
              - column:
                  name: target_max_opex
                  type: NUMERIC(15, 2)
              - column:
                  name: target_min_liquidity
                  type: NUMERIC(15, 2)
              - column:
                  name: target_max_overdue_ar
                  type: NUMERIC(15, 2)
              - column:
                  name: notes
                  type: VARCHAR(500)
              - column:
                  name: created_at
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: executive_cockpit_targets
            columnNames: app_id, period_key
            constraintName: uq_exec_cockpit_targets_app_period
        - createIndex:
            tableName: executive_cockpit_targets
            indexName: idx_exec_cockpit_targets_app
            columns:
              - column:
                  name: app_id
