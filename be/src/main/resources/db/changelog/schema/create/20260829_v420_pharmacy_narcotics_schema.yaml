                  constraints:
                    nullable: false
              - column:
                  name: patient_id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: prescriber_doctor_id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: dispenser_user_id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: second_signer_id
                  type: VARCHAR(64)
              - column:
                  name: status
                  type: VARCHAR(32)
