databaseChangeLog:
  - changeSet:
      id: 20260829_v420_01
      author: squad-medical
      changes:
        - createTable:
            tableName: pharmacy_items
            columns:
              - column:
                  name: id
                  type: VARCHAR(64)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: app_id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: item_id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: trade_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: generic_name
                  type: VARCHAR(255)
              - column:
                  name: dosage_form
                  type: VARCHAR(64)
                  defaultValue: TABLET
                  constraints:
                    nullable: false
              - column:
                  name: strength_text
                  type: VARCHAR(128)
              - column:
                  name: is_controlled
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: control_schedule
                  type: VARCHAR(32)
              - column:
                  name: created_at
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_pharmacy_items_tenant_item
            tableName: pharmacy_items
            columns:
              - column:
                  name: app_id
              - column:
                  name: item_id

  - changeSet:
      id: 20260829_v420_02
      author: squad-medical
      changes:
        - createTable:
            tableName: pharmacy_dispense_records
            columns:
              - column:
