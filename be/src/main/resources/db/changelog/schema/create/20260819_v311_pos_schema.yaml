databaseChangeLog:
  - changeSet:
      id: 20260819_v311_pos_schema
      author: wolfn
      validCheckSum: ANY
      changes:
        - createTable:
            tableName: pos_terminals
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: app_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: terminal_code
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: terminal_name
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: branch_id
                  type: VARCHAR(36)
              - column:
                  name: warehouse_id
                  type: VARCHAR(36)
              - column:
                  name: cashbox_id
                  type: VARCHAR(36)
              - column:
                  name: status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: BIGINT
                  constraints:
                    nullable: false

        - createTable:
            tableName: pos_sessions
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: app_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: session_number
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: terminal_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: cashier_user_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: opened_at
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: closed_at
                  type: BIGINT
              - column:
                  name: opening_float
                  type: NUMERIC(15, 2)
                  defaultValueNumeric: 0.0
                  constraints:
                    nullable: false
              - column:
                  name: closing_actual_cash
                  type: NUMERIC(15, 2)
              - column:
                  name: closing_calculated_cash
                  type: NUMERIC(15, 2)
              - column:
                  name: closing_actual_card
                  type: NUMERIC(15, 2)
              - column:
                  name: closing_calculated_card
                  type: NUMERIC(15, 2)
              - column:
                  name: cash_variance
                  type: NUMERIC(15, 2)
              - column:
                  name: card_variance
                  type: NUMERIC(15, 2)
              - column:
                  name: status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: notes
                  type: VARCHAR(500)
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: BIGINT
                  constraints:
                    nullable: false

        - createTable:
            tableName: pos_transactions
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: app_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: transaction_number
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: session_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: terminal_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: cashier_user_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: customer_id
                  type: VARCHAR(36)
              - column:
                  name: transaction_type
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: payment_method
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: subtotal
                  type: NUMERIC(15, 2)
                  defaultValueNumeric: 0.0
                  constraints:
                    nullable: false
              - column:
                  name: discount_amount
                  type: NUMERIC(15, 2)
                  defaultValueNumeric: 0.0
                  constraints:
                    nullable: false
              - column:
                  name: tax_amount
                  type: NUMERIC(15, 2)
                  defaultValueNumeric: 0.0
                  constraints:
                    nullable: false
              - column:
                  name: total_amount
                  type: NUMERIC(15, 2)
                  defaultValueNumeric: 0.0
                  constraints:
                    nullable: false
              - column:
                  name: cash_tendered
                  type: NUMERIC(15, 2)
                  defaultValueNumeric: 0.0
              - column:
                  name: change_amount
                  type: NUMERIC(15, 2)
                  defaultValueNumeric: 0.0
              - column:
                  name: status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: original_transaction_id
                  type: VARCHAR(36)
              - column:
                  name: client_offline_id
                  type: VARCHAR(100)
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: BIGINT
                  constraints:
                    nullable: false

        - createTable:
            tableName: pos_transaction_lines
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: app_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: transaction_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: item_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: item_code
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: item_name
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: NUMERIC(12, 3)
                  constraints:
                    nullable: false
              - column:
                  name: unit_price
                  type: NUMERIC(15, 2)
                  constraints:
                    nullable: false
              - column:
                  name: discount_rate
                  type: NUMERIC(5, 2)
