                  constraints:
                    nullable: false
              - column:
                  name: discount_amount
                  type: NUMERIC(15, 2)
                  defaultValueNumeric: 0.0
                  constraints:
                    nullable: false
              - column:
                  name: tax_amount
                  type: NUMERIC(15, 2)
                  defaultValueNumeric: 0.0
                  constraints:
                    nullable: false
              - column:
                  name: line_total
                  type: NUMERIC(15, 2)
                  constraints:
                    nullable: false
              - column:
                  name: notes
                  type: VARCHAR(500)

        - createIndex:
            indexName: idx_pos_term_app
            tableName: pos_terminals
            columns:
              - column:
                  name: app_id

        - createIndex:
            indexName: idx_pos_ses_app_term
            tableName: pos_sessions
            columns:
              - column:
                  name: app_id
              - column:
                  name: terminal_id

        - createIndex:
            indexName: idx_pos_txn_app_ses
            tableName: pos_transactions
            columns:
              - column:
                  name: app_id
              - column:
                  name: session_id

        - createIndex:
            indexName: idx_pos_txnl_app_txn
            tableName: pos_transaction_lines
            columns:
              - column:
                  name: app_id
              - column:
                  name: transaction_id
