databaseChangeLog:
  - changeSet:
      id: create_product_analytics_activation
      author: Mohamed-Hammada
      preConditions:
        - onFail: HALT
        - tableExists: { tableName: apps }
        - not: { tableExists: { tableName: product_events } }
      changes:
        - createTable:
            tableName: product_events
            columns:
              - column: { name: id, type: varchar(36), constraints: { primaryKey: true, nullable: false } }
              - column: { name: app_id, type: varchar(36), constraints: { nullable: false, foreignKeyName: fk_product_event_app, references: apps(id) } }
              - column: { name: event_name, type: varchar(80), constraints: { nullable: false } }
              - column: { name: feature_key, type: varchar(120), constraints: { nullable: false } }
              - column: { name: properties_json, type: varchar(2000), constraints: { nullable: false } }
              - column: { name: operation_id, type: varchar(80), constraints: { nullable: false } }
              - column: { name: actor, type: varchar(100), constraints: { nullable: false } }
              - column: { name: occurred_at, type: timestamp with time zone, constraints: { nullable: false } }
        - addUniqueConstraint: { tableName: product_events, columnNames: app_id,operation_id, constraintName: uk_product_event_operation }
        - createIndex: { tableName: product_events, indexName: ix_product_event_tenant_time, columns: [ { column: { name: app_id } }, { column: { name: occurred_at } }, { column: { name: event_name } } ] }
        - createTable:
            tableName: product_event_daily_aggregates
            columns:
              - column: { name: id, type: varchar(36), constraints: { primaryKey: true, nullable: false } }
              - column: { name: app_id, type: varchar(36), constraints: { nullable: false, foreignKeyName: fk_product_daily_app, references: apps(id) } }
              - column: { name: event_date, type: date, constraints: { nullable: false } }
              - column: { name: event_name, type: varchar(80), constraints: { nullable: false } }
              - column: { name: feature_key, type: varchar(120), constraints: { nullable: false } }
              - column: { name: event_count, type: bigint, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamp with time zone, constraints: { nullable: false } }
              - column: { name: version, type: bigint, defaultValueNumeric: 0, constraints: { nullable: false } }
        - addUniqueConstraint: { tableName: product_event_daily_aggregates, columnNames: app_id,event_date,event_name,feature_key, constraintName: uk_product_daily_dimension }
        - createTable:
            tableName: activation_milestones
            columns:
              - column: { name: id, type: varchar(36), constraints: { primaryKey: true, nullable: false } }
              - column: { name: app_id, type: varchar(36), constraints: { nullable: false, foreignKeyName: fk_activation_milestone_app, references: apps(id) } }
              - column: { name: milestone_key, type: varchar(80), constraints: { nullable: false } }
              - column: { name: source_event_id, type: varchar(36), constraints: { nullable: false } }
              - column: { name: achieved_at, type: timestamp with time zone, constraints: { nullable: false } }
        - addUniqueConstraint: { tableName: activation_milestones, columnNames: app_id,milestone_key, constraintName: uk_activation_milestone }
      rollback:
        - dropTable: { tableName: activation_milestones }
        - dropTable: { tableName: product_event_daily_aggregates }
        - dropTable: { tableName: product_events }
