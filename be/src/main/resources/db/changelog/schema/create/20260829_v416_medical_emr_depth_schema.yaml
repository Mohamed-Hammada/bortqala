databaseChangeLog:
  - changeSet:
      id: 20260829_v416_01
      author: squad-medical
      changes:
        - createTable:
            tableName: patient_allergies
            columns:
              - column:
                  name: id
                  type: VARCHAR(64)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: app_id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: patient_id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: substance
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: severity
                  type: VARCHAR(32)
                  defaultValue: MODERATE
                  constraints:
                    nullable: false
              - column:
                  name: reaction_notes
                  type: VARCHAR(1000)
              - column:
                  name: noted_at
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_patient_allergies_tenant_patient
            tableName: patient_allergies
            columns:
              - column:
                  name: app_id
              - column:
                  name: patient_id

