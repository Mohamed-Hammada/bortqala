databaseChangeLog:
  - changeSet:
      id: 20260820-v328-01-create-school-tables
      author: bemo-platform
      changes:
        - createTable:
            tableName: school_student_enrollments
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tenant_id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: student_code
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: student_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: grade_level
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: academic_year
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: guardian_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: guardian_phone
                  type: VARCHAR(64)
              - column:
                  name: total_tuition_fee
                  type: DECIMAL(18, 2)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: transport_fee
                  type: DECIMAL(18, 2)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: books_fee
                  type: DECIMAL(18, 2)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(32)
                  defaultValue: ACTIVE
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: BIGINT
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_school_enrollment_tenant
            tableName: school_student_enrollments
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: student_code

        - createTable:
            tableName: school_tuition_invoices
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tenant_id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: enrollment_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: invoice_number
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: installment_name
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
              - column:
                  name: due_date
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: amount_due
                  type: DECIMAL(18, 2)
                  constraints:
                    nullable: false
              - column:
                  name: amount_paid
                  type: DECIMAL(18, 2)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(32)
                  defaultValue: PENDING
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: BIGINT
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_tuition_inv_tenant_enrollment
            tableName: school_tuition_invoices
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: enrollment_id

  - changeSet:
      id: 20260820-v328-02-create-tourism-tables
      author: bemo-platform
      changes:
