                  constraints:
                    nullable: false
              - column:
                  name: travel_date
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: return_date
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: travelers_count
