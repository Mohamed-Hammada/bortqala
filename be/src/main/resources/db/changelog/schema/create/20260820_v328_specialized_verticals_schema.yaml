                  constraints:
                    nullable: false
              - column:
                  name: flight_cost
                  type: DECIMAL(18, 2)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: excursion_cost
                  type: DECIMAL(18, 2)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: gross_margin
                  type: DECIMAL(18, 2)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(32)
                  defaultValue: CONFIRMED
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: BIGINT
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_tourism_tenant_code
            tableName: tourism_package_bookings
