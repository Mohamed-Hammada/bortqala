databaseChangeLog:
  - changeSet:
      id: 20260819-v282-project-executive-dashboard-schema
      author: bemo-architect
      changes:
        - createTable:
            tableName: project_executive_snapshots
            columns:
              - column: { name: id, type: VARCHAR(36), constraints: { primaryKey: true, nullable: false } }
              - column: { name: app_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: snapshot_date, type: DATE, constraints: { nullable: false } }
              - column: { name: total_projects_count, type: INT, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: active_projects_count, type: INT, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: total_contract_value, type: "NUMERIC(18, 2)", defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: total_budget_value, type: "NUMERIC(18, 2)", defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: total_committed_value, type: "NUMERIC(18, 2)", defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: total_actual_value, type: "NUMERIC(18, 2)", defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: total_recognized_revenue, type: "NUMERIC(18, 2)", defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: total_cash_and_banks, type: "NUMERIC(18, 2)", defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: portfolio_gross_margin_percent, type: "NUMERIC(5, 2)", defaultValueNumeric: 0 }
              - column: { name: created_at, type: BIGINT, constraints: { nullable: false } }

        - createIndex:
            tableName: project_executive_snapshots
            indexName: idx_prj_exec_snap_app_date
            columns:
              - column: { name: app_id }
              - column: { name: snapshot_date }
