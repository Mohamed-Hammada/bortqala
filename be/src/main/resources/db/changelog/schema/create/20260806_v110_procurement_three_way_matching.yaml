databaseChangeLog:
  - changeSet:
      id: 20260806_v110_procurement_three_way_matching
      author: Antigravity
      changes:
        - createTable:
            tableName: procurement_three_way_matches
            columns:
              - column: { name: id, type: VARCHAR(36), constraints: { primaryKey: true, nullable: false } }
              - column: { name: app_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: purchase_order_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: goods_receipt_id, type: VARCHAR(36) }
              - column: { name: supplier_invoice_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: match_status, type: VARCHAR(30), constraints: { nullable: false } }
              - column: { name: price_variance_amount, type: "NUMERIC(19, 2)", defaultValueNumeric: 0 }
              - column: { name: quantity_variance_amount, type: "NUMERIC(19, 2)", defaultValueNumeric: 0 }
              - column: { name: tolerance_percentage, type: "NUMERIC(5, 2)", defaultValueNumeric: 0 }
              - column: { name: variance_reason, type: VARCHAR(500) }
              - column: { name: resolved_by, type: VARCHAR(160) }
              - column: { name: resolved_at, type: timestamp }
              - column: { name: created_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
