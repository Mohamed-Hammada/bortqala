databaseChangeLog:
  - changeSet:
      id: 20260806_v106_approval_workflow_engine
      author: Antigravity
      changes:
        - createTable:
            tableName: approval_workflow_definitions
            columns:
              - column: { name: id, type: VARCHAR(36), constraints: { primaryKey: true, nullable: false } }
              - column: { name: app_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: document_type, type: VARCHAR(50), constraints: { nullable: false } }
              - column: { name: name, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: active, type: BOOLEAN, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: version, type: INT, defaultValueNumeric: 1, constraints: { nullable: false } }
              - column: { name: created_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }

        - createTable:
            tableName: approval_workflow_steps
            columns:
              - column: { name: id, type: VARCHAR(36), constraints: { primaryKey: true, nullable: false } }
              - column: { name: app_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: workflow_definition_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: step_order, type: INT, constraints: { nullable: false } }
              - column: { name: step_code, type: VARCHAR(50), constraints: { nullable: false } }
              - column: { name: name, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: required_role, type: VARCHAR(50) }
              - column: { name: required_user_id, type: VARCHAR(36) }
              - column: { name: amount_from, type: "NUMERIC(19, 2)" }
              - column: { name: amount_to, type: "NUMERIC(19, 2)" }
              - column: { name: minimum_approvals, type: INT, defaultValueNumeric: 1 }
              - column: { name: allow_self_approval, type: BOOLEAN, defaultValueBoolean: false }
              - column: { name: escalation_hours, type: INT }

        - createTable:
            tableName: approval_instances
            columns:
              - column: { name: id, type: VARCHAR(36), constraints: { primaryKey: true, nullable: false } }
              - column: { name: app_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: workflow_definition_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: document_type, type: VARCHAR(50), constraints: { nullable: false } }
              - column: { name: document_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: current_step_order, type: INT, defaultValueNumeric: 1, constraints: { nullable: false } }
              - column: { name: status, type: VARCHAR(30), defaultValue: "SUBMITTED", constraints: { nullable: false } }
              - column: { name: submitted_by, type: VARCHAR(160), constraints: { nullable: false } }
              - column: { name: submitted_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
              - column: { name: completed_at, type: timestamp }
              - column: { name: version, type: BIGINT, defaultValueNumeric: 0, constraints: { nullable: false } }

        - createTable:
            tableName: approval_decisions
            columns:
              - column: { name: id, type: VARCHAR(36), constraints: { primaryKey: true, nullable: false } }
              - column: { name: app_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: instance_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: step_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: decision, type: VARCHAR(30), constraints: { nullable: false } }
              - column: { name: comment, type: VARCHAR(1000) }
              - column: { name: decided_by, type: VARCHAR(160), constraints: { nullable: false } }
              - column: { name: decided_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
              - column: { name: delegated_from, type: VARCHAR(160) }
