databaseChangeLog:
  - changeSet:
      id: create_business_parties
      author: Mohamed-Hammada
      validCheckSum: ANY
      changes:
        - createTable:
            tableName: business_parties
            columns:
              - column: { name: id, type: VARCHAR(36), constraints: { primaryKey: true, nullable: false } }
              - column: { name: app_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: code, type: VARCHAR(50), constraints: { nullable: false } }
              - column: { name: name, type: VARCHAR(160), constraints: { nullable: false } }
              - column: { name: party_type, type: VARCHAR(80), constraints: { nullable: false } }
              - column: { name: contact_person, type: VARCHAR(160) }
              - column: { name: phone, type: VARCHAR(50) }
              - column: { name: notes, type: VARCHAR(1000) }
              - column: { name: active, type: BOOLEAN, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: version, type: BIGINT, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: created_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
        - addUniqueConstraint:
            tableName: business_parties
            columnNames: app_id, code
            constraintName: uq_business_parties_app_code
        - addForeignKeyConstraint:
            baseTableName: business_parties
            baseColumnNames: app_id
            constraintName: fk_business_parties_app_id
            referencedTableName: apps
            referencedColumnNames: id
      rollback:
        - dropTable: { tableName: business_parties }

  - changeSet:
      id: seed_business_party_translations
      author: Mohamed-Hammada
      validCheckSum: ANY
      changes:
        - loadData:
            tableName: translations
            file: db/changelog/data/insert/files/business_party_translations_v10.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            separator: ;
      rollback:
        - delete:
            tableName: translations
            where: id LIKE 'x10-%'
