databaseChangeLog:
  - changeSet:
      id: 20260806-v114-01
      author: bemo-erp
      comment: Create user_shortcut_profiles table
      changes:
        - createTable:
            tableName: user_shortcut_profiles
            columns:
              - column:
                  name: id
                  type: varchar(36)
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_user_shortcut_profiles
              - column:
                  name: app_id
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: varchar(36)
                  constraints:
                    nullable: false
              - column:
                  name: profile_mode
                  type: varchar(20)
                  defaultValue: DEFAULT
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: bigint
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

  - changeSet:
      id: 20260806-v114-02
      author: bemo-erp
      comment: Add unique constraint to user_shortcut_profiles
      changes:
        - addUniqueConstraint:
            tableName: user_shortcut_profiles
            columnNames: app_id, user_id
            constraintName: uk_user_shortcut_profile_app_user

  - changeSet:
      id: 20260806-v114-03
      author: bemo-erp
      comment: Create user_screen_shortcuts table
      changes:
        - createTable:
            tableName: user_screen_shortcuts
            columns:
              - column:
                  name: id
                  type: varchar(36)
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_user_screen_shortcuts
              - column:
                  name: app_id
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: profile_id
                  type: varchar(36)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_user_screen_shortcut_profile
                    referencedTableName: user_shortcut_profiles
                    referencedColumnNames: id
                    deleteCascade: true
              - column:
                  name: page_code
                  type: varchar(80)
                  constraints:
                    nullable: false
              - column:
                  name: second_key_code
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: enabled
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: sort_order
                  type: integer
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

  - changeSet:
      id: 20260806-v114-04
      author: bemo-erp
      comment: Add unique constraints to user_screen_shortcuts
      changes:
        - addUniqueConstraint:
            tableName: user_screen_shortcuts
            columnNames: app_id, profile_id, second_key_code
            constraintName: uk_user_shortcut_profile_key
        - addUniqueConstraint:
            tableName: user_screen_shortcuts
            columnNames: app_id, profile_id, page_code
            constraintName: uk_user_shortcut_profile_page

  - changeSet:
      id: 20260806-v114-05
      author: bemo-erp
      comment: Add index to user_screen_shortcuts profile_id
      changes:
        - createIndex:
            indexName: idx_user_screen_shortcut_profile
            tableName: user_screen_shortcuts
            columns:
              - column:
                  name: app_id
              - column:
                  name: profile_id
