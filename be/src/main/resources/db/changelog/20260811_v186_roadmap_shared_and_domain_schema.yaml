databaseChangeLog:
  - changeSet:
      id: 20260811_v186_001_create_posting_profiles
      author: nemo
      changes:
        - createTable:
            tableName: posting_profiles
            columns:
              - column: { name: id, type: VARCHAR(36), constraints: { primaryKey: true, nullable: false } }
              - column: { name: app_id, type: VARCHAR(50), constraints: { nullable: false } }
              - column: { name: code, type: VARCHAR(50), constraints: { nullable: false } }
              - column: { name: business_event, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: effective_from, type: DATE, constraints: { nullable: false } }
              - column: { name: effective_to, type: DATE }
              - column: { name: active, type: BOOLEAN, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: created_at, type: BIGINT, constraints: { nullable: false } }
              - column: { name: updated_at, type: BIGINT, constraints: { nullable: false } }
              - column: { name: version, type: BIGINT, defaultValueNumeric: 0, constraints: { nullable: false } }
        - createTable:
            tableName: posting_profile_lines
            columns:
              - column: { name: id, type: VARCHAR(36), constraints: { primaryKey: true, nullable: false } }
              - column: { name: profile_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: line_no, type: INT, constraints: { nullable: false } }
              - column: { name: side, type: VARCHAR(10), constraints: { nullable: false } }
              - column: { name: account_source, type: VARCHAR(50), constraints: { nullable: false } }
              - column: { name: fixed_account_id, type: VARCHAR(36) }
              - column: { name: amount_source, type: VARCHAR(50), constraints: { nullable: false } }

