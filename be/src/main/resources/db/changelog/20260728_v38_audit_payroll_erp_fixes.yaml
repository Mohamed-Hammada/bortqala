databaseChangeLog:
  - changeSet:
      id: 20260728-38-audit-payroll-erp-fixes
      author: hr-platform
      validCheckSum: ANY
      changes:
        - sql:
            splitStatements: true
            sql: |
              -- 1. Fix Employee 001 name & invalid test names
              UPDATE employees
              SET full_name = 'محمد أحمد علي'
              WHERE employee_code IN ('001', 'EMP-001', '1') OR UPPER(full_name) = 'MMMM';

              -- 2. Cleanup test data
              DELETE FROM employee_code_sequences WHERE category_id IN (SELECT id FROM attendance_categories WHERE code = 'QA_CAT_20260726');
              DELETE FROM attendance_categories WHERE code = 'QA_CAT_20260726';
              DELETE FROM employees WHERE employee_code IN ('SECURITY-QA-20260726-EMP-INVALID', 'SECURITY-QA-20260726-RETEST-NODEVICE');

              -- 3. Ensure Default Organization for DEMO App
              INSERT INTO companies (id, app_id, code, name, tax_number, commercial_registry, active, created_at, updated_at)
              SELECT '30000000-0000-0000-0000-000000000001', a.id, 'DEMO-CO', 'شركة البرتقالة للتصدير والتصنيع (Bemo Demo)', 'EG-123456789', 'CR-987654', TRUE, 1753574400000, 1753574400000
              FROM apps a
              WHERE UPPER(a.code) = 'DEMO'
                AND NOT EXISTS (SELECT 1 FROM companies c WHERE c.app_id = a.id);

              INSERT INTO branches (id, app_id, company_id, code, name, location, active, created_at, updated_at)
              SELECT '30000000-0000-0000-0000-000000000002', c.app_id, c.id, 'BR-MAIN', 'الفرع الرئيسي - الجيزة / النوبارية', 'الجيزة - مصر', TRUE, 1753574400000, 1753574400000
              FROM companies c
              WHERE c.code = 'DEMO-CO'
                AND NOT EXISTS (SELECT 1 FROM branches b WHERE b.company_id = c.id);

              INSERT INTO warehouses (id, app_id, branch_id, code, name, location, active, created_at, updated_at)
              SELECT '30000000-0000-0000-0000-000000000003', b.app_id, b.id, 'WH-MAIN', 'المستودع الرئيسي للمحاصيل والمنتجات', 'النوبارية - البحيرة', TRUE, 1753574400000, 1753574400000
              FROM branches b
              WHERE b.code = 'BR-MAIN'
                AND NOT EXISTS (SELECT 1 FROM warehouses w WHERE w.branch_id = b.id);

              INSERT INTO departments (id, app_id, company_id, code, name, active, created_at, updated_at)
              SELECT '30000000-0000-0000-0000-000000000004', c.app_id, c.id, 'DEP-GEN', 'إدارة الموارد البشرية والعمليات', TRUE, 1753574400000, 1753574400000
              FROM companies c
              WHERE c.code = 'DEMO-CO'
                AND NOT EXISTS (SELECT 1 FROM departments d WHERE d.company_id = c.id);

              -- 4. Insert Missing Key Translations
              INSERT INTO translations (id, translation_key, locale, text_value)
              VALUES ('i18n-v38-ar-01', 'payroll.maxAdvanceDeduction', 'ar-EG', 'أقصى خصم سلفة متاح ({balance} ج.م)')
              ON CONFLICT (translation_key, locale) DO UPDATE SET text_value = EXCLUDED.text_value;

              INSERT INTO translations (id, translation_key, locale, text_value)
              VALUES ('i18n-v38-en-01', 'payroll.maxAdvanceDeduction', 'en-US', 'Max advance deduction available ({balance} EGP)')
              ON CONFLICT (translation_key, locale) DO UPDATE SET text_value = EXCLUDED.text_value;

              INSERT INTO translations (id, translation_key, locale, text_value)
              VALUES ('i18n-v38-ar-02', 'reports.emptyNoRecords', 'ar-EG', 'لا توجد سجلات حضور / لا ينطبق')
              ON CONFLICT (translation_key, locale) DO UPDATE SET text_value = EXCLUDED.text_value;

              INSERT INTO translations (id, translation_key, locale, text_value)
              VALUES ('i18n-v38-en-02', 'reports.emptyNoRecords', 'en-US', 'No attendance records / N/A')
              ON CONFLICT (translation_key, locale) DO UPDATE SET text_value = EXCLUDED.text_value;

              INSERT INTO translations (id, translation_key, locale, text_value)
              VALUES ('i18n-v38-ar-03', 'action.expandAll', 'ar-EG', 'فتح كل القوائم')
              ON CONFLICT (translation_key, locale) DO UPDATE SET text_value = EXCLUDED.text_value;

              INSERT INTO translations (id, translation_key, locale, text_value)
              VALUES ('i18n-v38-en-03', 'action.expandAll', 'en-US', 'Expand All')
              ON CONFLICT (translation_key, locale) DO UPDATE SET text_value = EXCLUDED.text_value;

  - changeSet:
      id: 20260728-38-seed-demo-currencies
      author: Mohamed-Hammada
      validCheckSum: ANY
      comment: Seed default currencies for DEMO app
      changes:
        - sql:
            splitStatements: true
            sql: |
              INSERT INTO currencies (id, app_id, code, name, symbol, is_base, exchange_rate, active, created_at, updated_at)
              SELECT gen_random_uuid()::text, a.id, 'EGP', 'الجنيه المصري', 'ج.م', TRUE, 1.0, TRUE, extract(epoch from now())*1000, extract(epoch from now())*1000
              FROM apps a WHERE UPPER(a.code) = 'DEMO'
              AND NOT EXISTS (SELECT 1 FROM currencies c WHERE c.app_id = a.id AND c.code = 'EGP');

              INSERT INTO currencies (id, app_id, code, name, symbol, is_base, exchange_rate, active, created_at, updated_at)
              SELECT gen_random_uuid()::text, a.id, 'USD', 'الدولار الأمريكي', '$', FALSE, 50.0, TRUE, extract(epoch from now())*1000, extract(epoch from now())*1000
              FROM apps a WHERE UPPER(a.code) = 'DEMO'
              AND NOT EXISTS (SELECT 1 FROM currencies c WHERE c.app_id = a.id AND c.code = 'USD');

              INSERT INTO app_translations (id, app_id, translation_key, locale, text_value, created_at, updated_at)
              SELECT 'en-38-001', a.id, 'users.passwordMinLength', 'ar-EG', 'كلمة المرور يجب أن لا تقل عن {min} أحرف.', 1753574400000, 1753574400000
              FROM apps a WHERE UPPER(a.code) = 'DEMO'
              AND NOT EXISTS (SELECT 1 FROM app_translations t WHERE t.app_id = a.id AND t.translation_key = 'users.passwordMinLength' AND t.locale = 'ar-EG');

              INSERT INTO app_translations (id, app_id, translation_key, locale, text_value, created_at, updated_at)
              SELECT 'en-38-002', a.id, 'users.passwordMinLength', 'en-US', 'Password must be at least {min} characters.', 1753574400000, 1753574400000
              FROM apps a WHERE UPPER(a.code) = 'DEMO'
              AND NOT EXISTS (SELECT 1 FROM app_translations t WHERE t.app_id = a.id AND t.translation_key = 'users.passwordMinLength' AND t.locale = 'en-US');

              INSERT INTO currencies (id, app_id, code, name, symbol, is_base, exchange_rate, active, created_at, updated_at)
              SELECT gen_random_uuid()::text, a.id, 'EUR', 'اليورو', '€', FALSE, 55.0, TRUE, extract(epoch from now())*1000, extract(epoch from now())*1000
              FROM apps a WHERE UPPER(a.code) = 'DEMO'
              AND NOT EXISTS (SELECT 1 FROM currencies c WHERE c.app_id = a.id AND c.code = 'EUR');

  - changeSet:
      id: 20260728-38-advance-long-term-fields
      author: Mohamed-Hammada  
      changes:
        - addColumn:
            tableName: workforce_advances
            columns:
              - column: { name: first_installment_date, type: VARCHAR(10) }
              - column: { name: deduction_mode, type: VARCHAR(20), defaultValue: AUTO }
              - column: { name: deferral_periods, type: INT, defaultValueNumeric: 0 }
