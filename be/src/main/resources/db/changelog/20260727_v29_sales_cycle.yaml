databaseChangeLog:
  - changeSet:
      id: 20260727-29-create-sales-tables
      author: system
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: sales_quotations
      changes:
        - createTable:
            tableName: sales_quotations
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: app_id
                  type: VARCHAR(36)
                  constraints: { nullable: false }
              - column:
                  name: quotation_number
                  type: VARCHAR(50)
                  constraints: { nullable: false }
              - column:
                  name: quotation_date
                  type: DATE
                  constraints: { nullable: false }
              - column:
                  name: customer_id
                  type: VARCHAR(36)
                  constraints: { nullable: false }
              - column:
                  name: total_amount
                  type: NUMERIC(15,2)
                  defaultValueNumeric: 0.00
                  constraints: { nullable: false }
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: DRAFT
                  constraints: { nullable: false }
              - column:
                  name: created_at
                  type: BIGINT
                  constraints: { nullable: false }
              - column:
                  name: updated_at
                  type: BIGINT
                  constraints: { nullable: false }

        - createTable:
            tableName: sales_orders
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: app_id
                  type: VARCHAR(36)
                  constraints: { nullable: false }
              - column:
                  name: so_number
                  type: VARCHAR(50)
                  constraints: { nullable: false }
              - column:
                  name: so_date
                  type: DATE
                  constraints: { nullable: false }
              - column:
                  name: customer_id
                  type: VARCHAR(36)
                  constraints: { nullable: false }
              - column:
                  name: quotation_id
                  type: VARCHAR(36)
              - column:
                  name: total_amount
                  type: NUMERIC(15,2)
                  defaultValueNumeric: 0.00
                  constraints: { nullable: false }
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: DRAFT
                  constraints: { nullable: false }
              - column:
                  name: created_at
                  type: BIGINT
                  constraints: { nullable: false }
              - column:
                  name: updated_at
                  type: BIGINT
                  constraints: { nullable: false }

        - createTable:
            tableName: sales_order_lines
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: app_id
                  type: VARCHAR(36)
                  constraints: { nullable: false }
              - column:
                  name: sales_order_id
                  type: VARCHAR(36)
                  constraints: { nullable: false }
              - column:
                  name: item_name
                  type: VARCHAR(255)
                  constraints: { nullable: false }
              - column:
                  name: quantity
                  type: NUMERIC(12,2)
                  constraints: { nullable: false }
              - column:
                  name: unit_price
                  type: NUMERIC(12,2)
                  constraints: { nullable: false }
              - column:
                  name: line_total
                  type: NUMERIC(15,2)
                  constraints: { nullable: false }

        - createTable:
            tableName: delivery_notes
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: app_id
                  type: VARCHAR(36)
                  constraints: { nullable: false }
              - column:
                  name: delivery_number
                  type: VARCHAR(50)
                  constraints: { nullable: false }
              - column:
                  name: delivery_date
                  type: DATE
                  constraints: { nullable: false }
              - column:
                  name: sales_order_id
                  type: VARCHAR(36)
                  constraints: { nullable: false }
              - column:
                  name: customer_id
                  type: VARCHAR(36)
                  constraints: { nullable: false }
              - column:
                  name: warehouse_id
                  type: VARCHAR(36)
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: POSTED
                  constraints: { nullable: false }
              - column:
                  name: created_at
                  type: BIGINT
                  constraints: { nullable: false }

        - createTable:
            tableName: customer_invoices
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: app_id
                  type: VARCHAR(36)
                  constraints: { nullable: false }
              - column:
                  name: invoice_number
                  type: VARCHAR(50)
                  constraints: { nullable: false }
              - column:
                  name: customer_id
                  type: VARCHAR(36)
                  constraints: { nullable: false }
              - column:
                  name: sales_order_id
                  type: VARCHAR(36)
              - column:
                  name: invoice_date
                  type: DATE
                  constraints: { nullable: false }
              - column:
                  name: total_amount
                  type: NUMERIC(15,2)
                  constraints: { nullable: false }
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: UNPAID
                  constraints: { nullable: false }
              - column:
                  name: created_at
                  type: BIGINT
                  constraints: { nullable: false }
              - column:
                  name: updated_at
                  type: BIGINT
                  constraints: { nullable: false }

        - createTable:
            tableName: customer_payments
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: app_id
                  type: VARCHAR(36)
                  constraints: { nullable: false }
              - column:
                  name: payment_number
                  type: VARCHAR(50)
                  constraints: { nullable: false }
              - column:
                  name: payment_date
                  type: DATE
                  constraints: { nullable: false }
              - column:
                  name: customer_id
                  type: VARCHAR(36)
                  constraints: { nullable: false }
              - column:
                  name: customer_invoice_id
                  type: VARCHAR(36)
                  constraints: { nullable: false }
              - column:
                  name: amount
                  type: NUMERIC(15,2)
                  constraints: { nullable: false }
              - column:
                  name: payment_method
                  type: VARCHAR(30)
                  constraints: { nullable: false }
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: POSTED
                  constraints: { nullable: false }
              - column:
                  name: created_at
                  type: BIGINT
                  constraints: { nullable: false }
