databaseChangeLog:
  - changeSet:
      id: 20260829_v414_medical_clinic_allowed_menus
      author: wolfn
      comment: "Grant medical clinic menus to existing users (WP-15 Medical Clinic MVP)"
      changes:
        - sql:
            sql: |
              UPDATE app_users SET allowed_menus = CONCAT(COALESCE(allowed_menus, ''), ',clinic-patients,clinic-queue,clinic-commissions')
              WHERE allowed_menus IS NOT NULL AND allowed_menus NOT LIKE '%clinic-patients%';
      rollback:
        - sql:
            sql: |
              UPDATE app_users SET allowed_menus = REPLACE(REPLACE(REPLACE(allowed_menus, ',clinic-patients', ''), ',clinic-queue', ''), ',clinic-commissions', '')
              WHERE allowed_menus IS NOT NULL;
