databaseChangeLog:
  - changeSet:
      id: 20260829-v426-011
      author: bemo-medical
      changes:
        - update:
            tableName: app_users
            columns:
              - column:
                  name: allowed_menus
                  valueComputed: "CASE WHEN allowed_menus IS NULL OR allowed_menus = '' THEN 'hospital-ops' WHEN allowed_menus NOT LIKE '%hospital-ops%' THEN CONCAT(allowed_menus, ',hospital-ops') ELSE allowed_menus END"
