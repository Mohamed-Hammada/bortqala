databaseChangeLog:
  - changeSet:
      id: 20260820_v321_executive_analytics_allowed_menus
      author: wolfn
      validCheckSum: ANY
      comment: "Grant the executive-analytics screen to existing users for Feature 26 Executive Reporting & Analytics."
      changes:
        - sql:
            sql: |
              UPDATE app_users SET allowed_menus = CONCAT(COALESCE(allowed_menus, ''), ',executive-analytics')
              WHERE allowed_menus IS NOT NULL AND allowed_menus NOT LIKE '%executive-analytics%';
      rollback:
        - sql:
            sql: |
              UPDATE app_users SET allowed_menus = REPLACE(allowed_menus, ',executive-analytics', '')
              WHERE allowed_menus IS NOT NULL;
