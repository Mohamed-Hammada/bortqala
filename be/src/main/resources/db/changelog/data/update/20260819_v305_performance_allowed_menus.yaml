databaseChangeLog:
  - changeSet:
      id: 20260819_v305_performance_allowed_menus
      author: wolfn
      comment: "Grant the performance screen to existing users for Feature 20 HR Performance & KPIs."
      changes:
        - sql:
            sql: |
              UPDATE app_users SET allowed_menus = CONCAT(COALESCE(allowed_menus, ''), ',performance')
              WHERE allowed_menus IS NOT NULL AND allowed_menus NOT LIKE '%performance%';
      rollback:
        - sql:
            sql: |
              UPDATE app_users SET allowed_menus = REPLACE(allowed_menus, ',performance', '')
              WHERE allowed_menus IS NOT NULL;
