databaseChangeLog:
  - changeSet:
      id: 20260829-v428-006
      author: bemo-medical
      changes:
        - update:
            tableName: app_users
            columns:
              - column:
                  name: allowed_menus
                  valueComputed: "CASE WHEN allowed_menus IS NULL OR allowed_menus = '' THEN 'dental-charting' WHEN allowed_menus NOT LIKE '%dental-charting%' THEN CONCAT(allowed_menus, ',dental-charting') ELSE allowed_menus END"
