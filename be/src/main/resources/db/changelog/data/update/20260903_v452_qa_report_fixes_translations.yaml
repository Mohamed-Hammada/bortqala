databaseChangeLog:
  - changeSet:
      id: 20260903-v452-qa-report-fix-translations
      author: bemo-erp
      comment: "QA-REPORT-002..013: inline/save error copy, no-match empty state, leave date-range validation, expenses load error, parties tax-id, and the PROJECT_MANAGER role i18n keys."
      changes:
        - sql:
            splitStatements: true
            sql: |
              INSERT INTO translations (id, translation_key, locale, text_value, created_at, updated_at)
              SELECT 't-009001-ar', 'leaves.invalidDateRange', 'ar-EG', 'تاريخ النهاية يجب أن يكون بعد تاريخ البداية.', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP
              WHERE NOT EXISTS (SELECT 1 FROM translations WHERE translation_key = 'leaves.invalidDateRange' AND locale = 'ar-EG');
              INSERT INTO translations (id, translation_key, locale, text_value, created_at, updated_at)
              SELECT 't-009001-en', 'leaves.invalidDateRange', 'en-US', 'End date must be after the start date.', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP
              WHERE NOT EXISTS (SELECT 1 FROM translations WHERE translation_key = 'leaves.invalidDateRange' AND locale = 'en-US');
              INSERT INTO translations (id, translation_key, locale, text_value, created_at, updated_at)
              SELECT 't-009002-ar', 'expenses.loadErrorTitle', 'ar-EG', 'تعذر تحميل المصروفات', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP
              WHERE NOT EXISTS (SELECT 1 FROM translations WHERE translation_key = 'expenses.loadErrorTitle' AND locale = 'ar-EG');
              INSERT INTO translations (id, translation_key, locale, text_value, created_at, updated_at)
              SELECT 't-009002-en', 'expenses.loadErrorTitle', 'en-US', 'Unable to load expenses', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP
              WHERE NOT EXISTS (SELECT 1 FROM translations WHERE translation_key = 'expenses.loadErrorTitle' AND locale = 'en-US');
              INSERT INTO translations (id, translation_key, locale, text_value, created_at, updated_at)
              SELECT 't-009003-ar', 'parties.taxIdRequired', 'ar-EG', 'رقم التسجيل الضريبي مطلوب للموردين.', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP
