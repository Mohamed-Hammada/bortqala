databaseChangeLog:
  - changeSet:
      id: 20260808-v130-access-role-detail-translations
      author: bemo-erp
      comment: "Adds the access role-detail expander labels used by the Users page (users.page.html) so the Arabic/English UI no longer falls back to raw keys."
      changes:
        - sql:
            sql: |
              INSERT INTO translations (id, translation_key, locale, text_value) VALUES ('v130-001', 'access.showRoleDetails', 'ar-EG', 'عرض تفاصيل الدور');
              INSERT INTO translations (id, translation_key, locale, text_value) VALUES ('v130-002', 'access.showRoleDetails', 'en-US', 'Show role details');
              INSERT INTO translations (id, translation_key, locale, text_value) VALUES ('v130-003', 'access.hideRoleDetails', 'ar-EG', 'إخفاء تفاصيل الدور');
              INSERT INTO translations (id, translation_key, locale, text_value) VALUES ('v130-004', 'access.hideRoleDetails', 'en-US', 'Hide role details');
      rollback:
        - sql:
            sql: |
              DELETE FROM translations WHERE id IN ('v130-001', 'v130-002', 'v130-003', 'v130-004');
