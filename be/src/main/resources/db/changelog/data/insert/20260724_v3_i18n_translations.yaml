databaseChangeLog:
  - changeSet:
      id: create_platform_translations
      author: Mohamed-Hammada
      validCheckSum: ANY
      changes:
        - createTable:
            tableName: translations
            columns:
              - column: { name: id, type: VARCHAR(36), constraints: { primaryKey: true, nullable: false } }
              - column: { name: translation_key, type: VARCHAR(150), constraints: { nullable: false } }
              - column: { name: locale, type: VARCHAR(10), constraints: { nullable: false } }
              - column: { name: text_value, type: TEXT, constraints: { nullable: false } }
              - column: { name: created_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
        - addUniqueConstraint:
            tableName: translations
            columnNames: translation_key, locale
            constraintName: uq_translations_key_locale
        - loadData:
            tableName: translations
            file: db/changelog/data/insert/files/translations.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            separator: ;
            columns:
              - column: { header: id, name: id, type: STRING }
              - column: { header: translation_key, name: translation_key, type: STRING }
              - column: { header: locale, name: locale, type: STRING }
              - column: { header: text_value, name: text_value, type: STRING }
      rollback:
        - dropTable: { tableName: translations }
