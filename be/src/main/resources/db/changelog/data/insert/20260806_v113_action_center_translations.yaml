databaseChangeLog:
  - changeSet:
      id: 20260806-v113-action-center-translations
      author: Antigravity
      comment: "Bilingual translations for Action Center and Notifications."
      changes:
        - loadData:
            tableName: translations
            file: db/changelog/data/insert/files/20260806_v113_action_center_translations.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            separator: ;
            columns:
              - column: { header: id, name: id, type: STRING }
              - column: { header: translation_key, name: translation_key, type: STRING }
              - column: { header: locale, name: locale, type: STRING }
              - column: { header: text_value, name: text_value, type: STRING }
      rollback:
        - delete: { tableName: translations, where: "id LIKE 'v113-%'" }
