databaseChangeLog:
  - changeSet:
      id: 20260725-v17-operations-enum-translations
      author: codex
      validCheckSum: ANY
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM translations WHERE id = 'x17-ar-001'
      changes:
        - loadData:
            tableName: translations
            file: db/changelog/data/insert/files/operations_enum_translations_v17.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            separator: ;
      rollback:
        - delete:
            tableName: translations
            where: id LIKE 'x17-%'
