databaseChangeLog:
  - changeSet:
      id: 20260817-v263-inline-locale-i18n-cleanup
      author: wolfn
      comment: Replace all inline ar/en ternaries with DB-backed i18n keys (attendance, workforce import, workflow, subscription, imports). Entitlements keys already exist in v246.
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: "SELECT COUNT(*) FROM translations WHERE id LIKE 'v263-%'"
      changes:
        - loadData:
            tableName: translations
            file: db/changelog/data/insert/files/20260817_v263_inline_locale_i18n_cleanup.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            separator: ;
            columns:
              - column: { header: id, name: id, type: STRING }
              - column: { header: translation_key, name: translation_key, type: STRING }
              - column: { header: locale, name: locale, type: STRING }
              - column: { header: text_value, name: text_value, type: STRING }
      rollback:
        - delete: { tableName: translations, where: "id LIKE 'v263-%'" }
