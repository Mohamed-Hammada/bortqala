databaseChangeLog:
  - changeSet:
      id: 20260729-v65-user-dialog-translations
      author: codex
      changes:
        - loadData:
            tableName: translations
            file: db/changelog/data/insert/files/user_dialog_translations_v65.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            separator: ;
            columns:
              - column: { header: id, name: id, type: STRING }
              - column: { header: translation_key, name: translation_key, type: STRING }
              - column: { header: locale, name: locale, type: STRING }
              - column: { header: text_value, name: text_value, type: STRING }
      rollback:
        - delete: { tableName: translations, where: "id LIKE 'x65-%'" }
