databaseChangeLog:
  - changeSet:
      id: 20260815-v252-attendance-browser-i18n
      author: wolfn
      comment: Arabic and English copy for attendance month and employee details explorer.
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: "SELECT COUNT(*) FROM translations WHERE id LIKE 'v252-%'"
      changes:
        - loadData:
            tableName: translations
            file: db/changelog/data/insert/files/20260815_v252_attendance_browser_i18n.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            separator: ;
            columns:
              - column: { header: id, name: id, type: STRING }
              - column: { header: translation_key, name: translation_key, type: STRING }
              - column: { header: locale, name: locale, type: STRING }
              - column: { header: text_value, name: text_value, type: STRING }
      rollback:
        - delete: { tableName: translations, where: "id LIKE 'v252-%'" }
