databaseChangeLog:
  - changeSet:
      id: 20260810-v191-confirm-missing-ui-translations
      author: bemo-erp
      validCheckSum: ANY
      comment: "Bilingual translations for missing confirm dialog keys (approve/post payroll period) and success/static keys referenced by the frontend that were absent from the translations table."
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck: { expectedResult: 0, sql: "SELECT COUNT(*) FROM translations WHERE id LIKE 'v191-%'" }
      changes:
        - loadData:
            file: db/changelog/data/insert/files/20260810_v191_confirm_missing_ui_translations.csv
            separator: ;
            tableName: translations
            encoding: UTF-8
            columns:
              - column: { header: id, name: id, type: STRING }
              - column: { header: key, name: translation_key, type: STRING }
              - column: { header: locale, name: locale, type: STRING }
              - column: { header: text, name: text_value, type: STRING }
      rollback:
        - delete: { tableName: translations, where: "id LIKE 'v191-%'" }
