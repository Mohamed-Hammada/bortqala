databaseChangeLog:
  - changeSet:
      id: 20260806-v115-screen-shortcut-translations
      author: bemo-erp
      validCheckSum: ANY
      comment: "Bilingual translations for Dynamic Screen Shortcuts."
      changes:
        - loadData:
            tableName: translations
            file: db/changelog/data/insert/files/20260806_v115_screen_shortcut_translations.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            separator: ;
            columns:
              - column: { header: id, name: id, type: STRING }
              - column: { header: translation_key, name: translation_key, type: STRING }
              - column: { header: locale, name: locale, type: STRING }
              - column: { header: text_value, name: text_value, type: STRING }
      rollback:
        - delete: { tableName: translations, where: "id LIKE 'v115-%'" }
