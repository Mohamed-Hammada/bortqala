databaseChangeLog:
  - changeSet:
      id: 20260808-v139-shortcut-edit-translations
      author: bemo-erp
      validCheckSum: ANY
      comment: "REM-008: bilingual labels for the compact shortcut-settings rows - edit pencil, row-level save, cancel, search-by-target filter, and a11y names."
      changes:
        - loadData:
            tableName: translations
            file: db/changelog/data/insert/files/20260808_v139_shortcut_edit_translations.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            separator: ;
            columns:
              - column: { header: id, name: id, type: STRING }
              - column: { header: translation_key, name: translation_key, type: STRING }
              - column: { header: locale, name: locale, type: STRING }
              - column: { header: text_value, name: text_value, type: STRING }
      rollback:
        - delete: { tableName: translations, where: "id LIKE 'v139-%'" }
