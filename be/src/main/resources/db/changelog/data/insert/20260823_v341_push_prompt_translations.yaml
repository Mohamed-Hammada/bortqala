databaseChangeLog:
  - changeSet:
      id: 20260823-v341-push-prompt-translations
      author: bemo-erp
      validCheckSum: ANY
      comment: "WP-09: bilingual copy for the first-login web-push enablement prompt (title, hint, enable, not-now, never-ask) plus the browser-denied hint surfaced in Settings."
      changes:
        - loadData:
            tableName: translations
            file: db/changelog/data/insert/files/20260823_v341_push_prompt_translations.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            separator: ;
            columns:
              - column: { header: id, name: id, type: STRING }
              - column: { header: translation_key, name: translation_key, type: STRING }
              - column: { header: locale, name: locale, type: STRING }
              - column: { header: text_value, name: text_value, type: STRING }
      rollback:
        - delete: { tableName: translations, where: "id LIKE 'v341-%'" }
