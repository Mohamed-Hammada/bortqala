databaseChangeLog:
  - changeSet:
      id: 20260812-v196-notification-send-translations
      author: codex
      changes:
        - loadData:
            file: db/changelog/data/insert/files/20260812_v196_notification_send_translations.csv
            separator: ";"
            tableName: translations
            columns:
              - column: { header: id, name: id, type: STRING }
              - column: { header: key, name: translation_key, type: STRING }
              - column: { header: locale, name: locale, type: STRING }
              - column: { header: value, name: text_value, type: STRING }
      rollback:
        - delete: { tableName: translations, where: "id LIKE 'v196-%'" }
