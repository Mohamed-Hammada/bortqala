databaseChangeLog:
  - changeSet:
      id: 20260806-v107-approval-engine-translations
      author: Antigravity
      comment: "Bilingual translations for configurable approval workflow engine machine exception keys and UI labels."
      changes:
        - loadData:
            tableName: translations
            file: db/changelog/data/insert/files/20260806_v107_approval_engine_translations.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            separator: ;
            columns:
              - column: { header: id, name: id, type: STRING }
              - column: { header: translation_key, name: translation_key, type: STRING }
              - column: { header: locale, name: locale, type: STRING }
              - column: { header: text_value, name: text_value, type: STRING }
      rollback:
        - delete: { tableName: translations, where: "id LIKE 'v107-%'" }
