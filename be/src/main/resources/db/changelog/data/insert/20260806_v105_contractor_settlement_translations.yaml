databaseChangeLog:
  - changeSet:
      id: 20260806-v105-contractor-settlement-translations
      author: Antigravity
      validCheckSum: ANY
      comment: "Bilingual translations for contractor workforce settlement lifecycle: machine exception keys, invoice linking, finance journal posting, payment recording, and contractor statements."
      changes:
        - loadData:
            tableName: translations
            file: db/changelog/data/insert/files/20260806_v105_contractor_settlement_translations.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            separator: ;
            columns:
              - column: { header: id, name: id, type: STRING }
              - column: { header: translation_key, name: translation_key, type: STRING }
              - column: { header: locale, name: locale, type: STRING }
              - column: { header: text_value, name: text_value, type: STRING }
        - update:
            tableName: translations
            where: translation_key = 'workforce.settlements.title' AND locale = 'ar-EG'
            columns:
              - column: { name: text_value, value: 'دورة تسويات المقاولين' }
        - update:
            tableName: translations
            where: translation_key = 'workforce.settlements.title' AND locale = 'en-US'
            columns:
              - column: { name: text_value, value: 'Contractor Settlement Lifecycle' }
      rollback:
        - delete: { tableName: translations, where: "id LIKE 'v105-%'" }
