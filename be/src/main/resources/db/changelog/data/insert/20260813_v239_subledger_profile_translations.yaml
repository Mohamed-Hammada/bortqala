        - loadData:
            file: db/changelog/data/insert/files/20260813_v239_subledger_profile_translations.csv
            separator: ";"
            tableName: translations
            encoding: UTF-8
      rollback:
        - delete:
            tableName: translations
            where: "translation_key IN ('SUBLEDGER_POSTING_PROFILE_REQUIRED', 'SUBLEDGER_POSTING_PROFILE_INVALID')"
