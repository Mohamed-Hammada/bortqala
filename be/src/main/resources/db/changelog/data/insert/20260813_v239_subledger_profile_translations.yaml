databaseChangeLog:
  - changeSet:
      id: 20260813_v239_001_subledger_profile_translations
      author: Mohamed-Hammada
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM translations WHERE translation_key IN ('SUBLEDGER_POSTING_PROFILE_REQUIRED', 'SUBLEDGER_POSTING_PROFILE_INVALID')
