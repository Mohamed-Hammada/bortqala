databaseChangeLog:
  - changeSet:
      id: 20260806-v111-three-way-matching-translations
      author: Antigravity
      validCheckSum: ANY
      comment: "Bilingual translations for procurement 3-way matching machine keys and UI labels."
      changes:
        - loadData:
            tableName: translations
            file: db/changelog/data/insert/files/20260806_v111_three_way_matching_translations.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            separator: ;
            columns:
              - column: { header: id, name: id, type: STRING }
              - column: { header: translation_key, name: translation_key, type: STRING }
              - column: { header: locale, name: locale, type: STRING }
              - column: { header: text_value, name: text_value, type: STRING }
      rollback:
        - delete: { tableName: translations, where: "id LIKE 'v111-%'" }
