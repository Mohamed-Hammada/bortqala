databaseChangeLog:
  - changeSet:
      id: 20260826-v349-valuation-report-translations
      author: bemo-erp
      validCheckSum: ANY
      comment: "WP-05: bilingual copy for the inventory valuation report surface and export."
      changes:
        - loadData:
            tableName: translations
            file: db/changelog/data/insert/files/20260826_v349_valuation_report_translations.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            separator: ;
            columns:
              - column: { header: id, name: id, type: STRING }
              - column: { header: translation_key, name: translation_key, type: STRING }
              - column: { header: locale, name: locale, type: STRING }
              - column: { header: text_value, name: text_value, type: STRING }
      rollback:
        - delete: { tableName: translations, where: "id LIKE 'v349-%' OR (translation_key LIKE 'export.%' AND translation_key IN ('export.sheet.inventoryValuation','export.column.itemCode','export.column.itemName','export.column.onHand','export.column.unitCost','export.column.value','export.column.method','export.column.openingGap'))" }
