databaseChangeLog:
  - changeSet:
      id: 20260812-v199-workforce-dispatch-translations
      author: codex
      changes:
        - loadData:
            file: db/changelog/data/insert/files/20260812_v199_workforce_dispatch_translations.csv
            separator: ";"
            tableName: translations
        - sql:
            sql: "UPDATE app_users SET allowed_menus = CASE WHEN allowed_menus IS NULL OR TRIM(allowed_menus) = '' THEN 'workforce-dispatch-disputes' ELSE CONCAT(allowed_menus, ',workforce-dispatch-disputes') END WHERE allowed_menus IS NOT NULL AND allowed_menus NOT LIKE '%workforce-dispatch-disputes%'"
      rollback:
        - delete: { tableName: translations, where: "id LIKE 'v199-%'" }
