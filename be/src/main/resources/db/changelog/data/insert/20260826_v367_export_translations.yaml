databaseChangeLog:
  - changeSet:
      id: 20260826_v367_export_translations
      author: wolfn
      validCheckSum: ANY
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck: { expectedResult: 0, sql: "SELECT COUNT(*) FROM translations WHERE id LIKE 'v367-%'" }
      changes:
        - loadData:
            file: db/changelog/data/insert/files/20260826_v367_export_translations.csv
            separator: ";"
            tableName: translations
            encoding: UTF-8
            columns:
              - column: { header: id, name: id, type: STRING }
              - column: { header: translation_key, name: translation_key, type: STRING }
              - column: { header: locale, name: locale, type: STRING }
              - column: { header: text_value, name: text_value, type: STRING }
      rollback:
        - delete: { tableName: translations, where: "id LIKE 'v367-%'" }
