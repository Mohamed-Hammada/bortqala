databaseChangeLog:
  - changeSet:
      id: 20260815-v251-full-ui-i18n-delta
      author: openai
      comment: Backfills translation keys appended to the V246/V247 CSVs after those changesets were already applied in some environments (workforce.ui.advances.disabled and the four I18N_IMPORT_* / I18N_INVALID_* error codes). V246/V247 accept the old checksums via validCheckSum; this changeset loads the delta on databases that were migrated before the CSV extension. Fresh databases already contain these keys and skip via MARK_RAN.
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: "SELECT COUNT(*) FROM translations WHERE translation_key IN ('workforce.ui.advances.disabled','I18N_IMPORT_EMPTY_FILE','I18N_IMPORT_MISSING_HEADER','I18N_INVALID_PAGE','I18N_INVALID_PAGE_SIZE')"
      changes:
        - loadData:
            tableName: translations
            file: db/changelog/data/insert/files/20260815_v251_full_ui_i18n_delta.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            separator: ;
            columns:
              - column: { header: id, name: id, type: STRING }
              - column: { header: translation_key, name: translation_key, type: STRING }
              - column: { header: locale, name: locale, type: STRING }
              - column: { header: text_value, name: text_value, type: STRING }
      rollback:
        - delete: { tableName: translations, where: "id LIKE 'v251-%'" }
