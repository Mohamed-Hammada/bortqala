databaseChangeLog:
  - changeSet:
      id: 20260808-v135-category-scope-translations
      author: bemo-erp
      comment: "REM-002: bilingual labels for the category scope selector (EMPLOYEE / WORKER / BOTH) on the employee and workforce category screens."
      changes:
        - loadData:
            tableName: translations
            file: db/changelog/data/insert/files/20260808_v135_category_scope_translations.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            separator: ;
            columns:
              - column: { header: id, name: id, type: STRING }
              - column: { header: translation_key, name: translation_key, type: STRING }
              - column: { header: locale, name: locale, type: STRING }
              - column: { header: text_value, name: text_value, type: STRING }
      rollback:
        - delete: { tableName: translations, where: "id LIKE 'v135-%'" }
