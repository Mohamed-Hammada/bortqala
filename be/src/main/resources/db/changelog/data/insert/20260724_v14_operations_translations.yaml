databaseChangeLog:
  - changeSet:
      id: 20260724-v14-operations-translations
      author: codex
      validCheckSum: ANY
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM translations WHERE id = 'x14-ar-001'
      changes:
        - loadData:
            tableName: translations
            file: db/changelog/data/insert/files/operations_translations_v14.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            separator: ;
      rollback:
        - delete:
            tableName: translations
            where: id LIKE 'x14-%'
