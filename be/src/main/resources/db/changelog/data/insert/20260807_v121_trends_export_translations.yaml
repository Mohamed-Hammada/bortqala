databaseChangeLog:
  - changeSet:
      id: 20260807-v121-trends-export-translations
      author: codex
      validCheckSum: ANY
      comment: Arabic/English translations for the multi-period trends dashboard surface and its Excel export columns (attendance rate, scheduled/present/exception days, overtime, paid/pending counts, gross/paid totals). Registered in next + test-h2 changelogs.
      changes:
        - loadData:
            tableName: translations
            file: db/changelog/data/insert/files/20260807_v121_trends_export_translations.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            separator: ;
            columns:
              - column: { header: id, name: id, type: STRING }
              - column: { header: translation_key, name: translation_key, type: STRING }
              - column: { header: locale, name: locale, type: STRING }
              - column: { header: text_value, name: text_value, type: STRING }
      rollback:
        - delete: { tableName: translations, where: "id LIKE 'v121-%'" }
