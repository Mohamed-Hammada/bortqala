databaseChangeLog:
  - changeSet:
      id: 20260819-v270-project-wbs-translations
      author: bemo-erp
      comment: "Arabic/English translations for P0.1 Project Kernel, WBS/BOQ Hierarchy, Cost Codes, Stakeholder Roles, and Exception Codes."
      changes:
        - loadData:
            tableName: translations
            file: db/changelog/data/insert/files/20260819_v270_project_wbs_translations.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            separator: ;
            columns:
              - column: { header: id, name: id, type: STRING }
              - column: { header: translation_key, name: translation_key, type: STRING }
              - column: { header: locale, name: locale, type: STRING }
              - column: { header: text_value, name: text_value, type: STRING }
      rollback:
        - delete: { tableName: translations, where: "id LIKE 'v270-%'" }
