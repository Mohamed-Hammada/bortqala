databaseChangeLog:
  - changeSet:
      id: 20260804-v96-error-fallbacks-i18n
      author: codex
      comment: Arabic/English translations for the remaining generic API error fallbacks (access denied, resource not found, concurrent modification, malformed request, unsupported method, unexpected error) so every error response is localized.
      changes:
        - loadData:
            tableName: translations
            file: db/changelog/data/insert/files/20260804_v96_error_fallbacks_i18n.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            separator: ;
            columns:
              - column: { header: id, name: id, type: STRING }
              - column: { header: translation_key, name: translation_key, type: STRING }
              - column: { header: locale, name: locale, type: STRING }
              - column: { header: text_value, name: text_value, type: STRING }
      rollback:
        - delete: { tableName: translations, where: "id LIKE 'v96-%'" }
