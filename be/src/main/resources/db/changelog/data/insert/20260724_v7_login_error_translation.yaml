databaseChangeLog:
  - changeSet:
      id: seed_invalid_credentials_translations
      author: Mohamed-Hammada
      validCheckSum: ANY
      changes:
        - insert:
            tableName: translations
            columns:
              - column: { name: id, value: ar-091 }
              - column: { name: translation_key, value: login.invalidCredentials }
              - column: { name: locale, value: ar-EG }
              - column: { name: text_value, value: "اسم المستخدم أو كلمة المرور غير صحيحة." }
        - insert:
            tableName: translations
            columns:
              - column: { name: id, value: en-091 }
              - column: { name: translation_key, value: login.invalidCredentials }
              - column: { name: locale, value: en-US }
              - column: { name: text_value, value: "The username or password is incorrect." }
      rollback:
        - delete:
            tableName: translations
            where: id IN ('ar-091', 'en-091')
