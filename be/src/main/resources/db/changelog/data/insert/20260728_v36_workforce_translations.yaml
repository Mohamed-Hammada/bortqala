databaseChangeLog:
  - changeSet:
      id: 20260728-v36-workforce-translations
      author: Mohamed-Hammada
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM translations WHERE id = 'x36-ar-001'
      changes:
        - loadData:
            tableName: translations
            file: db/changelog/data/insert/files/workforce_translations_v36.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            separator: ;
      rollback:
        - delete:
            tableName: translations
            where: id LIKE 'x36-%'
