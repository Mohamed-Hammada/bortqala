databaseChangeLog:
  - changeSet:
      id: seed_contractor_workforce_pack_v1
      author: Mohamed-Hammada
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck: { expectedResult: 0, sql: "SELECT COUNT(*) FROM industry_packs WHERE code='CONTRACTOR_WORKFORCE_EG'" }
      changes:
        - insert:
            tableName: industry_packs
            columns:
              - column: { name: id, value: pack-contractor-workforce-eg-v1 }
              - column: { name: code, value: CONTRACTOR_WORKFORCE_EG }
              - column: { name: name_key, value: industryPack.contractorWorkforce.name }
              - column: { name: description_key, value: industryPack.contractorWorkforce.description }
              - column: { name: pack_version, valueNumeric: 1 }
              - column: { name: country_code, value: EGY }
              - column: { name: required_features_json, value: '["workforce.enabled","workforce.attendance.enabled","workforce.dashboard.enabled","workforce.contractorAccounts.enabled","finance.enabled","procurement.enabled"]' }
              - column: { name: status, value: ACTIVE }
              - column: { name: created_at, valueComputed: CURRENT_TIMESTAMP }
              - column: { name: updated_at, valueComputed: CURRENT_TIMESTAMP }
      rollback:
        - delete: { tableName: industry_packs, where: "code='CONTRACTOR_WORKFORCE_EG'" }
  - changeSet:
      id: seed_contractor_workforce_pack_translations
      author: Mohamed-Hammada
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck: { expectedResult: 0, sql: "SELECT COUNT(*) FROM translations WHERE id LIKE 'v169-%'" }
      changes:
        - loadData:
            file: db/changelog/data/insert/files/20260809_v169_contractor_workforce_pack.csv
            separator: ;
            tableName: translations
            encoding: UTF-8
            columns:
              - column: { header: id, name: id, type: STRING }
              - column: { header: key, name: translation_key, type: STRING }
              - column: { header: locale, name: locale, type: STRING }
              - column: { header: text, name: text_value, type: STRING }
      rollback:
        - delete: { tableName: translations, where: "id LIKE 'v169-%'" }
