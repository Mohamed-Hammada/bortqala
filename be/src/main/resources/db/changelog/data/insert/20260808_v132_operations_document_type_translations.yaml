databaseChangeLog:
  - changeSet:
      id: 20260808-v132-operations-document-type-translations
      author: bemo-erp
      validCheckSum: ANY
      comment: "REM-005: Arabic/English labels for the stock-movement document type selector added to the operations transaction form."
      changes:
        - loadData:
            tableName: translations
            file: db/changelog/data/insert/files/20260808_v132_operations_document_type_translations.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            separator: ;
            columns:
              - column: { header: id, name: id, type: STRING }
              - column: { header: translation_key, name: translation_key, type: STRING }
              - column: { header: locale, name: locale, type: STRING }
              - column: { header: text_value, name: text_value, type: STRING }
      rollback:
        - delete: { tableName: translations, where: "id LIKE 'v132-%'" }
