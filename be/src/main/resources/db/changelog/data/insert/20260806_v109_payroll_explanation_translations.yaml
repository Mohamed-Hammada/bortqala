databaseChangeLog:
  - changeSet:
      id: 20260806-v109-payroll-explanation-translations
      author: Antigravity
      validCheckSum: ANY
      comment: "Bilingual translations for payroll calculation explanation keys and UI labels."
      changes:
        - loadData:
            tableName: translations
            file: db/changelog/data/insert/files/20260806_v109_payroll_explanation_translations.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            separator: ;
            columns:
              - column: { header: id, name: id, type: STRING }
              - column: { header: translation_key, name: translation_key, type: STRING }
              - column: { header: locale, name: locale, type: STRING }
              - column: { header: text_value, name: text_value, type: STRING }
      rollback:
        - delete: { tableName: translations, where: "id LIKE 'v109-%'" }
