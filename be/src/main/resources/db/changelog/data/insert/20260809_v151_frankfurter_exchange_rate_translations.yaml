databaseChangeLog:
  - changeSet:
      id: 20260809-v151-frankfurter-exchange-rate-translations
      author: bemo-erp
      comment: "Frankfurter informational exchange-rate hints: bilingual UI copy for the tax-currency online reference panel."
      changes:
        - loadData:
            tableName: translations
            file: db/changelog/data/insert/files/20260809_v151_frankfurter_exchange_rate_translations.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            separator: ;
            columns:
              - column: { header: id, name: id, type: STRING }
              - column: { header: translation_key, name: translation_key, type: STRING }
              - column: { header: locale, name: locale, type: STRING }
              - column: { header: text_value, name: text_value, type: STRING }
      rollback:
        - delete: { tableName: translations, where: "id LIKE 'v151-%'" }
