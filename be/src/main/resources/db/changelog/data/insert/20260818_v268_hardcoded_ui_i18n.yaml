databaseChangeLog:
  - changeSet:
      id: 20260818-v268-hardcoded-ui-i18n
      author: bemo-erp
      comment: "i18n: Replace all remaining hardcoded UI text with DB-backed i18n.t() keys across 10 templates (145 keys x 2 locales)."
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck: { expectedResult: 0, sql: "SELECT COUNT(*) FROM translations WHERE id LIKE 'v268-%'" }
      changes:
        - loadData:
            file: db/changelog/data/insert/files/20260818_v268_hardcoded_ui_i18n.csv
            separator: ;
            tableName: translations
            encoding: UTF-8
            columns:
              - column: { header: id, name: id, type: STRING }
              - column: { header: key, name: translation_key, type: STRING }
              - column: { header: locale, name: locale, type: STRING }
              - column: { header: text, name: text_value, type: STRING }
      rollback:
        - delete: { tableName: translations, where: "id LIKE 'v268-%'" }
