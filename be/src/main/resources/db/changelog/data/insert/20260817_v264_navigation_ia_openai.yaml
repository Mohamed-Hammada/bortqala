databaseChangeLog:
  - changeSet:
      id: 20260817-v264-navigation-information-architecture-i18n
      author: OpenAI
      comment: Add Arabic and English translations for the reviewed ERP workspace taxonomy and clearer attendance/inventory navigation labels.
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: "SELECT COUNT(*) FROM translations WHERE id LIKE 'v264-nav-ia-%'"
      changes:
        - loadData:
            tableName: translations
            file: db/changelog/data/insert/files/20260817_v264_navigation_ia_openai.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            separator: ;
            columns:
              - column: { header: id, name: id, type: STRING }
              - column: { header: translation_key, name: translation_key, type: STRING }
              - column: { header: locale, name: locale, type: STRING }
              - column: { header: text_value, name: text_value, type: STRING }
      rollback:
        - delete: { tableName: translations, where: "id LIKE 'v264-nav-ia-%'" }
