databaseChangeLog:
  - changeSet:
      id: 20260808-v128-review-and-workforce-success-translations
      author: bemo-erp
      comment: "Adds report review decision and worker category creation success strings surfaced by the TypeScript hardcoded-UI scan."
      changes:
        - loadData:
            tableName: translations
            file: db/changelog/data/insert/files/20260808_v128_review_and_workforce_success_translations.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            separator: ;
            columns:
              - column: { header: id, name: id, type: STRING }
              - column: { header: translation_key, name: translation_key, type: STRING }
              - column: { header: locale, name: locale, type: STRING }
              - column: { header: text_value, name: text_value, type: STRING }
      rollback:
        - delete: { tableName: translations, where: "id LIKE 'v128-%'" }
