databaseChangeLog:
  - changeSet:
      id: 20260808-v143-operations-references-ui-translations
      author: bemo-erp
      comment: "REM-005: Arabic/English UI labels for the stock-movement document-reference section shown in the operations transaction form (hint text and attachment removal)."
      changes:
        - loadData:
            tableName: translations
            file: db/changelog/data/insert/files/20260808_v143_operations_references_ui_translations.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            separator: ;
            columns:
              - column: { header: id, name: id, type: STRING }
              - column: { header: translation_key, name: translation_key, type: STRING }
              - column: { header: locale, name: locale, type: STRING }
              - column: { header: text_value, name: text_value, type: STRING }
      rollback:
        - delete: { tableName: translations, where: "id LIKE 'v143-%'" }
