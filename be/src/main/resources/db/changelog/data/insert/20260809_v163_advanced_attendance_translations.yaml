databaseChangeLog:
  - changeSet:
      id: seed_advanced_attendance_translations
      author: Mohamed-Hammada
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: "SELECT COUNT(*) FROM translations WHERE id LIKE 'v163-%'"
      changes:
        - loadData:
            file: db/changelog/data/insert/files/20260809_v163_advanced_attendance_translations.csv
            separator: ;
            tableName: translations
            encoding: UTF-8
            columns:
              - column: { header: id, name: id, type: STRING }
              - column: { header: key, name: translation_key, type: STRING }
              - column: { header: locale, name: locale, type: STRING }
              - column: { header: text, name: text_value, type: STRING }
      rollback:
        - delete: { tableName: translations, where: "id LIKE 'v163-%'" }
