databaseChangeLog:
  - changeSet:
      id: 20260729-v55-keyboard-shortcuts-copy
      author: codex
      validCheckSum: ANY
      changes:
        - loadData:
            tableName: translations
            file: db/changelog/data/insert/files/keyboard_shortcuts_translations_v55.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            separator: ;
            columns:
              - column: { header: id, name: id, type: STRING }
              - column: { header: translation_key, name: translation_key, type: STRING }
              - column: { header: locale, name: locale, type: STRING }
              - column: { header: text_value, name: text_value, type: STRING }
      rollback:
        - delete: { tableName: translations, where: "id LIKE 'x55-%'" }
