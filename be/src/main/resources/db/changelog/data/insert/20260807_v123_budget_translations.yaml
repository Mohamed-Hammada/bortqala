databaseChangeLog:
  - changeSet:
      id: 20260807-v123-budget-translations
      author: bemo-erp
      validCheckSum: ANY
      comment: "Arabic/English translations for the B-1 budget control & encumbrance surface: 7 backend exception codes, budgets page UI keys, the purchase-order department field, and the budget export sheet/columns. Registered in next + test-h2 changelogs."
      changes:
        - loadData:
            tableName: translations
            file: db/changelog/data/insert/files/20260807_v123_budget_translations.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            separator: ;
            columns:
              - column: { header: id, name: id, type: STRING }
              - column: { header: translation_key, name: translation_key, type: STRING }
              - column: { header: locale, name: locale, type: STRING }
              - column: { header: text_value, name: text_value, type: STRING }
      rollback:
        - delete: { tableName: translations, where: "id LIKE 'v123-%'" }
