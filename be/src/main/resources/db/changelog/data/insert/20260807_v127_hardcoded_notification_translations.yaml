databaseChangeLog:
  - changeSet:
      id: 20260807-v127-hardcoded-notification-translations
      author: bemo-erp
      comment: "Localizes notification and confirm strings surfaced by the TypeScript hardcoded-UI scan."
      changes:
        - loadData:
            tableName: translations
            file: db/changelog/data/insert/files/20260807_v127_hardcoded_notification_translations.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            separator: ;
            columns:
              - column: { header: id, name: id, type: STRING }
              - column: { header: translation_key, name: translation_key, type: STRING }
              - column: { header: locale, name: locale, type: STRING }
              - column: { header: text_value, name: text_value, type: STRING }
      rollback:
        - delete: { tableName: translations, where: "id LIKE 'v127-%'" }
