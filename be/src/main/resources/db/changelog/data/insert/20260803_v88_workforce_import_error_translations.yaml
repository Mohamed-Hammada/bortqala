databaseChangeLog:
  - changeSet:
      id: 20260803-v88-workforce-import-error-translations
      author: codex
      validCheckSum: ANY
      changes:
        - loadData:
            tableName: translations
            file: db/changelog/data/insert/files/workforce_import_error_translations_v88.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            separator: ;
            columns:
              - column: { header: id, name: id, type: STRING }
              - column: { header: translation_key, name: translation_key, type: STRING }
              - column: { header: locale, name: locale, type: STRING }
              - column: { header: text_value, name: text_value, type: STRING }
      rollback:
        - delete: { tableName: translations, where: "id LIKE 'v88-%'" }
