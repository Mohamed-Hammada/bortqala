databaseChangeLog:
  - changeSet:
      id: 20260812-v200-access-import-templates-translations
      author: codex
      changes:
        - loadData:
            file: db/changelog/data/insert/files/20260812_v200_access_import_templates_translations.csv
            separator: ";"
            tableName: translations
        - update:
            tableName: translations
            columns:
              - column: { name: value, value: "Import recipients from Excel or CSV" }
            where: "key = 'notificationsSend.excel' AND locale = 'en-US'"
        - update:
            tableName: translations
            columns:
              - column: { name: value, value: "استيراد المستلمين من إكسل أو CSV" }
            where: "key = 'notificationsSend.excel' AND locale = 'ar-EG'"
      rollback:
        - update:
            tableName: translations
            columns:
              - column: { name: value, value: "Import recipients from Excel" }
            where: "key = 'notificationsSend.excel' AND locale = 'en-US'"
        - update:
            tableName: translations
            columns:
              - column: { name: value, value: "استيراد المستلمين من إكسل" }
            where: "key = 'notificationsSend.excel' AND locale = 'ar-EG'"
        - delete: { tableName: translations, where: "id LIKE 'v200-%'" }
