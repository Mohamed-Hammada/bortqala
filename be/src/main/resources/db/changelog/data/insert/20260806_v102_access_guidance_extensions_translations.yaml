databaseChangeLog:
  - changeSet:
      id: 20260806-v102-access-guidance-extensions-translations
      author: codex
      comment: "Arabic/English translations for the access-guidance UX extensions: acknowledgement reason, admin override notice, feature-disabled and role-mismatch menu chips, empty role pages hint, catalog-unavailable save blocking and the four backend validation error codes."
      changes:
        - loadData:
            tableName: translations
            file: db/changelog/data/insert/files/20260806_v102_access_guidance_extensions_translations.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            separator: ;
            columns:
              - column: { header: id, name: id, type: STRING }
              - column: { header: translation_key, name: translation_key, type: STRING }
              - column: { header: locale, name: locale, type: STRING }
              - column: { header: text_value, name: text_value, type: STRING }
      rollback:
        - delete: { tableName: translations, where: "id LIKE 'v102-%'" }
