databaseChangeLog:
  - changeSet:
      id: 20260813_v240_001_finance_workbench_translations
      author: Mohamed-Hammada
      validCheckSum: ANY
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM translations WHERE translation_key = 'financeWorkbench.title'
      changes:
        - loadData:
            file: db/changelog/data/insert/files/20260813_v240_finance_workbench_translations.csv
            separator: ";"
            tableName: translations
            encoding: UTF-8
            columns:
              - column: { header: id, name: id, type: STRING }
              - column: { header: translation_key, name: translation_key, type: STRING }
              - column: { header: locale, name: locale, type: STRING }
              - column: { header: text_value, name: text_value, type: STRING }
      rollback:
        - delete:
            tableName: translations
            where: "translation_key LIKE 'financeWorkbench.%'"
