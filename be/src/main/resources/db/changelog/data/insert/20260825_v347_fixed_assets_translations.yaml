databaseChangeLog:
  - changeSet:
      id: 20260825-v347-fixed-assets-translations
      author: bemo-erp
      validCheckSum: ANY
      comment: "WP-04: bilingual copy for fixed-asset errors, navigation and the register UI."
      changes:
        - loadData:
            tableName: translations
            file: db/changelog/data/insert/files/20260825_v347_fixed_assets_translations.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            separator: ;
            columns:
              - column: { header: id, name: id, type: STRING }
              - column: { header: translation_key, name: translation_key, type: STRING }
              - column: { header: locale, name: locale, type: STRING }
              - column: { header: text_value, name: text_value, type: STRING }
      rollback:
        - delete: { tableName: translations, where: "id LIKE 'v347-%'" }
