databaseChangeLog:
  - changeSet:
      id: 20260826-v350-advance-deduction-policy-translations
      author: bemo-erp
      validCheckSum: ANY
      comment: "WP-07: bilingual copy for advance deduction policy errors, settings section and the employees apply action."
      changes:
        - loadData:
            tableName: translations
            file: db/changelog/data/insert/files/20260826_v350_advance_deduction_policy_translations.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            separator: ;
            columns:
              - column: { header: id, name: id, type: STRING }
              - column: { header: translation_key, name: translation_key, type: STRING }
              - column: { header: locale, name: locale, type: STRING }
              - column: { header: text_value, name: text_value, type: STRING }
      rollback:
        - delete: { tableName: translations, where: "id LIKE 'v350-%'" }
