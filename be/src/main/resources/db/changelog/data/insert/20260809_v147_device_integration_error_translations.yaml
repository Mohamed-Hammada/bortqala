databaseChangeLog:
  - changeSet:
      id: 20260809-v147-device-integration-error-translations
      author: bemo-erp
      validCheckSum: ANY
      comment: "E-2 error-codes gate: Arabic/English translation rows for the five device-integration exception codes (DEVICE_HUB_ID_INVALID, DEVICE_HUB_REGISTRATION_INVALID, DEVICE_INTEGRATION_CONFIG_INVALID, DEVICE_INTEGRATION_NOT_FOUND, DEVICE_INTEGRATION_ROUTE_UNAVAILABLE) so ApiExceptionHandler never falls back to a raw English message."
      changes:
        - loadData:
            tableName: translations
            file: db/changelog/data/insert/files/20260809_v147_device_integration_error_translations.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            separator: ;
            columns:
              - column: { header: id, name: id, type: STRING }
              - column: { header: translation_key, name: translation_key, type: STRING }
              - column: { header: locale, name: locale, type: STRING }
              - column: { header: text_value, name: text_value, type: STRING }
      rollback:
        - delete: { tableName: translations, where: "id LIKE 'v147-%'" }
