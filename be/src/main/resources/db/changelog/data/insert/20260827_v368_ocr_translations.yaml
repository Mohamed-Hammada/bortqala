databaseChangeLog:
  - changeSet:
      id: 20260827_v368_ocr_translations
      author: wolfn
      validCheckSum: ANY
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck: { expectedResult: 0, sql: "SELECT COUNT(*) FROM translations WHERE id LIKE 'v368-%'" }
      changes:
        - loadData:
            file: db/changelog/data/insert/files/20260827_v368_ocr_translations.csv
            separator: ";"
            tableName: translations
            encoding: UTF-8
            columns:
              - column:
                  name: id
                  type: STRING
              - column:
                  name: translation_key
                  type: STRING
              - column:
                  name: locale
                  type: STRING
              - column:
                  name: text_value
                  type: STRING
      rollback:
        - delete: { tableName: translations, where: "id LIKE 'v368-%'" }
