databaseChangeLog:
  - changeSet:
      id: 20260824-v344-payment-plan-translations
      author: bemo-erp
      validCheckSum: ANY
      comment: "WP-01: bilingual copy for the supplier installment-plan error."
      changes:
        - loadData:
            tableName: translations
            file: db/changelog/data/insert/files/20260824_v344_payment_plan_translations.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            separator: ;
            columns:
              - column: { header: id, name: id, type: STRING }
              - column: { header: translation_key, name: translation_key, type: STRING }
              - column: { header: locale, name: locale, type: STRING }
              - column: { header: text_value, name: text_value, type: STRING }
      rollback:
        - delete: { tableName: translations, where: "id LIKE 'v344-%' OR translation_key = 'PROC_PAYMENT_PLAN_ALREADY_EXISTS'" }
