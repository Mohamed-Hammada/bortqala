databaseChangeLog:
  - changeSet:
      id: 20260823-v343-settlement-discount-translations
      author: bemo-erp
      validCheckSum: ANY
      comment: "WP-02: bilingual copy for settlement-discount errors and payment dialog field."
      changes:
        - loadData:
            tableName: translations
            file: db/changelog/data/insert/files/20260823_v343_settlement_discount_translations.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            separator: ;
            columns:
              - column: { header: id, name: id, type: STRING }
              - column: { header: translation_key, name: translation_key, type: STRING }
              - column: { header: locale, name: locale, type: STRING }
              - column: { header: text_value, name: text_value, type: STRING }
      rollback:
        - delete: { tableName: translations, where: "id LIKE 'v343-%' OR (translation_key LIKE 'PROC_SETTLEMENT%')" }
