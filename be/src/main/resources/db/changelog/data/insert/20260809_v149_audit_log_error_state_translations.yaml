databaseChangeLog:
  - changeSet:
      id: 20260809-v149-audit-log-error-state-translations
      author: bemo-erp
      comment: "FINAL-002: bilingual copy for the audit-logs load-error state (title + hint) rendered with the existing common.retry action."
      changes:
        - loadData:
            tableName: translations
            file: db/changelog/data/insert/files/20260809_v149_audit_log_error_state_translations.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            separator: ;
            columns:
              - column: { header: id, name: id, type: STRING }
              - column: { header: translation_key, name: translation_key, type: STRING }
              - column: { header: locale, name: locale, type: STRING }
              - column: { header: text_value, name: text_value, type: STRING }
      rollback:
        - delete: { tableName: translations, where: "id LIKE 'v149-%'" }
