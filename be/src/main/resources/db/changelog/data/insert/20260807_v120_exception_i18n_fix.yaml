databaseChangeLog:
  - changeSet:
      id: 20260807-v120-exception-i18n-fix
      author: codex
      comment: Arabic/English translations for 26 backend exception codes that were introduced without DB rows (approval engine, biometric sources, screen shortcuts, procurement, notifications, fiscal periods, journal numbering). ApiExceptionHandler resolves these keys via the translation tables, so every static code must exist once per locale.
      changes:
        - loadData:
            tableName: translations
            file: db/changelog/data/insert/files/20260807_v120_exception_i18n_fix.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            separator: ;
            columns:
              - column: { header: id, name: id, type: STRING }
              - column: { header: translation_key, name: translation_key, type: STRING }
              - column: { header: locale, name: locale, type: STRING }
              - column: { header: text_value, name: text_value, type: STRING }
      rollback:
        - delete: { tableName: translations, where: "id LIKE 'v120-%'" }
