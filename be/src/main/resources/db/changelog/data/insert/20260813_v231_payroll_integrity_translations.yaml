databaseChangeLog:
  - changeSet:
      id: 20260813_v231_001_payroll_integrity_translations
      author: Mohamed-Hammada
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM translations WHERE translation_key = 'PAYROLL_STATE_TRANSITION_INVALID'
      changes:
        - loadData:
            file: db/changelog/data/insert/files/20260813_v231_payroll_integrity_translations.csv
            separator: ";"
            tableName: translations
            encoding: UTF-8
      rollback:
        - delete:
            tableName: translations
            where: "translation_key IN ('PAYROLL_STATE_TRANSITION_INVALID','PAYROLL_PAYMENT_STATE_INVALID','PAYROLL_REVERSAL_STATE_INVALID','PAYROLL_STALE_VERSION','PAYROLL_BULK_NOT_PAYABLE','PAYROLL_REGISTER_EMPTY','payroll.calculatePeriod','payroll.reviewPeriod')"
