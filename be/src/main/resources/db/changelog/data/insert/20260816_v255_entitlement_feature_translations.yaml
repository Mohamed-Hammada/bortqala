databaseChangeLog:
  - changeSet:
      id: 20260816-v255-entitlement-feature-translations
      author: OpenAI
      validCheckSum: ANY
      comment: Arabic and English translations completing the full entitlement feature catalog (biometric.fileImport.enabled and every remaining feature key), consumed by the entitlement settings page.
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: "SELECT COUNT(*) FROM translations WHERE id LIKE 'v255-%'"
      changes:
        - loadData:
            tableName: translations
            file: db/changelog/data/insert/files/20260816_v255_entitlement_feature_translations.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            separator: ;
            columns:
              - column: { header: id, name: id, type: STRING }
              - column: { header: translation_key, name: translation_key, type: STRING }
              - column: { header: locale, name: locale, type: STRING }
              - column: { header: text_value, name: text_value, type: STRING }
      rollback:
        - delete: { tableName: translations, where: "id LIKE 'v255-%'" }
