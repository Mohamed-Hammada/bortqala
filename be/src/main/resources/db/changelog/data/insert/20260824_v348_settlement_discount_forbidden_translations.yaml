databaseChangeLog:
  - changeSet:
      id: 20260824-v348-settlement-discount-forbidden-translations
      author: bemo-erp
      validCheckSum: ANY
      comment: "WP-02: bilingual copy for the settlement-discount finance-role guard and payment dialog preview."
      changes:
        - loadData:
            tableName: translations
            file: db/changelog/data/insert/files/20260824_v348_settlement_discount_forbidden_translations.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            separator: ;
            columns:
              - column: { header: id, name: id, type: STRING }
              - column: { header: translation_key, name: translation_key, type: STRING }
              - column: { header: locale, name: locale, type: STRING }
              - column: { header: text_value, name: text_value, type: STRING }
      rollback:
        - delete: { tableName: translations, where: "id LIKE 'v348-%' OR (translation_key LIKE 'PROC_SETTLEMENT%' OR translation_key LIKE 'procurement.%')" }
