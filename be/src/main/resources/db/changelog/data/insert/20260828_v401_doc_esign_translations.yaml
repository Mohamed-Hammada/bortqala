databaseChangeLog:
  - changeSet:
      id: 20260828_v401_doc_esign_translations
      author: wolfn
      validCheckSum: ANY
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck: { expectedResult: 0, sql: "SELECT COUNT(*) FROM translations WHERE id LIKE 'v401-%'" }
      changes:
        - loadData:
            file: db/changelog/data/insert/files/20260828_v401_doc_esign_translations.csv
            separator: ";"
            tableName: translations
            encoding: UTF-8
            columns:
              - column:
                  name: id
                  type: STRING
              - column:
                  name: translation_key
                  type: STRING
              - column:
                  name: locale
                  type: STRING
              - column:
                  name: text_value
                  type: STRING
      rollback:
        - delete: { tableName: translations, where: "id LIKE 'v401-%'" }