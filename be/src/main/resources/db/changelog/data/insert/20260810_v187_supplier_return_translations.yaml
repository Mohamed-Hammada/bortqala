databaseChangeLog:
  - changeSet:
      id: seed_supplier_return_translations
      author: Mohamed-Hammada
      validCheckSum: ANY
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck: { expectedResult: 0, sql: "SELECT COUNT(*) FROM translations WHERE id LIKE 'v187-%'" }
      changes:
        - loadData:
            file: db/changelog/data/insert/files/20260810_v187_supplier_return_translations.csv
            separator: ;
            tableName: translations
            encoding: UTF-8
            columns:
              - column: { header: id, name: id, type: STRING }
              - column: { header: key, name: translation_key, type: STRING }
              - column: { header: locale, name: locale, type: STRING }
              - column: { header: text, name: text_value, type: STRING }
      rollback:
        - delete: { tableName: translations, where: "id LIKE 'v187-%'" }
