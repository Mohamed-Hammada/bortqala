databaseChangeLog:
- changeSet:
    id: 20260816-v254-device-source-locked-hint-update
    author: OpenAI
    comment: Update deviceSourceLockedHint to clarify auto-create employee configuration
      availability.
    changes:
    - update:
        tableName: translations
        columns:
        - column:
            name: text_value
            value: هوية مصدر الجهاز ثابتة؛ يمكنك تعديل إعداد إنشاء الموظفين أدناه.
        where: translation_key = 'imports.deviceSourceLockedHint' AND locale = 'ar-EG'
    - update:
        tableName: translations
        columns:
        - column:
            name: text_value
            value: Device source identity is immutable - you can adjust auto-employee
              creation settings below.
        where: translation_key = 'imports.deviceSourceLockedHint' AND locale = 'en-US'
    rollback:
    - update:
        tableName: translations
        columns:
        - column:
            name: text_value
            value: 'مصدر الجهاز ثابت: لا يمكن تغيير نوعه أو تعطيله.'
        where: translation_key = 'imports.deviceSourceLockedHint' AND locale = 'ar-EG'
    - update:
        tableName: translations
        columns:
        - column:
            name: text_value
            value: 'Device sources are fixed: their type and active state cannot be
              changed.'
        where: translation_key = 'imports.deviceSourceLockedHint' AND locale = 'en-US'
