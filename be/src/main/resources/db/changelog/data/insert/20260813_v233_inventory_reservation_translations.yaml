databaseChangeLog:
  - changeSet:
      id: 20260813_v233_001_inventory_reservation_translations
      author: Mohamed-Hammada
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM translations WHERE translation_key = 'WAREHOUSE_BRANCH_REQUIRED'
      changes:
        - loadData:
            file: db/changelog/data/insert/files/20260813_v233_inventory_reservation_translations.csv
            separator: ";"
            tableName: translations
            encoding: UTF-8
      rollback:
        - delete:
            tableName: translations
            where: "translation_key IN ('WAREHOUSE_BRANCH_REQUIRED','WAREHOUSE_ITEM_ACTIVE_REQUIRED')"
