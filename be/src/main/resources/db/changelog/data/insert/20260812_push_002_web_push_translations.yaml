databaseChangeLog:
  - changeSet:
      id: 20260812_push_002_web_push_translations
      author: OpenAI
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck: { expectedResult: 0, sql: "SELECT COUNT(*) FROM translations WHERE id LIKE 'push-20260812-%'" }
      changes:
        - loadData:
            file: db/changelog/data/insert/files/20260812_push_002_web_push_translations.csv
            separator: ;
            tableName: translations
            encoding: UTF-8
            columns:
              - column: { header: id, name: id, type: STRING }
              - column: { header: key, name: translation_key, type: STRING }
              - column: { header: locale, name: locale, type: STRING }
              - column: { header: text, name: text_value, type: STRING }
      rollback:
        - delete: { tableName: translations, where: "id LIKE 'push-20260812-%'" }
