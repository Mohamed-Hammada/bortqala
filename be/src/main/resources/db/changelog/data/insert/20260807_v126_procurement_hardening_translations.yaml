databaseChangeLog:
  - changeSet:
      id: 20260807-v126-procurement-hardening-translations
      author: bemo-erp
      validCheckSum: ANY
      comment: "Localizes three-way-match resolution feedback added by the final procurement hardening patch."
      changes:
        - loadData:
            tableName: translations
            file: db/changelog/data/insert/files/20260807_v126_procurement_hardening_translations.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            separator: ;
            columns:
              - column: { header: id, name: id, type: STRING }
              - column: { header: translation_key, name: translation_key, type: STRING }
              - column: { header: locale, name: locale, type: STRING }
              - column: { header: text_value, name: text_value, type: STRING }
      rollback:
        - delete: { tableName: translations, where: "id LIKE 'v126-%'" }
