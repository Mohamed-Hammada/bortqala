databaseChangeLog:
  - changeSet:
      id: 20260807-v125-budget-menu-translations
      author: bemo-erp
      comment: "Completes the B-1 budget catalog i18n: nav.budgetsHint (shell description) and procurement.departmentHint (purchase order department helper). Registered in next + test-h2 changelogs."
      changes:
        - loadData:
            tableName: translations
            file: db/changelog/data/insert/files/20260807_v125_budget_menu_translations.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            separator: ;
            columns:
              - column: { header: id, name: id, type: STRING }
              - column: { header: translation_key, name: translation_key, type: STRING }
              - column: { header: locale, name: locale, type: STRING }
              - column: { header: text_value, name: text_value, type: STRING }
      rollback:
        - delete: { tableName: translations, where: "id LIKE 'v125-%'" }
