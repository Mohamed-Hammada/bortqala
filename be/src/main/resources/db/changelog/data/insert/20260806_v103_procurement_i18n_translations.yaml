databaseChangeLog:
  - changeSet:
      id: 20260806-v103-procurement-i18n-translations
      author: codex
      comment: "Bilingual translations for the QA remediation batch: unsaved-changes confirm dialog (drawer dirty-check + route guard), journal entry line validators, invoice non-negative adjustments and discount-exceeds-total guard, PO issue/cancel confirmations, and the procurement page hardcoded-text audit (zero-static-labels policy)."
      changes:
        - loadData:
            tableName: translations
            file: db/changelog/data/insert/files/20260806_v103_procurement_i18n_translations.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            separator: ;
            columns:
              - column: { header: id, name: id, type: STRING }
              - column: { header: translation_key, name: translation_key, type: STRING }
              - column: { header: locale, name: locale, type: STRING }
              - column: { header: text_value, name: text_value, type: STRING }
      rollback:
        - delete: { tableName: translations, where: "id LIKE 'v103-%'" }
