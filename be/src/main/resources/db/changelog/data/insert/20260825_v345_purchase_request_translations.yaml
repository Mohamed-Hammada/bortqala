databaseChangeLog:
  - changeSet:
      id: 20260825-v345-purchase-request-translations
      author: bemo-erp
      validCheckSum: ANY
      comment: "WP-03: bilingual copy for purchase-request errors and UI labels."
      changes:
        - loadData:
            tableName: translations
            file: db/changelog/data/insert/files/20260825_v345_purchase_request_translations.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            separator: ;
            columns:
              - column: { header: id, name: id, type: STRING }
              - column: { header: translation_key, name: translation_key, type: STRING }
              - column: { header: locale, name: locale, type: STRING }
              - column: { header: text_value, name: text_value, type: STRING }
      rollback:
        - delete: { tableName: translations, where: "id LIKE 'v345-%'" }
