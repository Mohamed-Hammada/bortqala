databaseChangeLog:
  - changeSet:
      id: 20260806-v117-approval-menu-translations
      author: bemo-erp
      validCheckSum: ANY
      comment: "Bilingual translations for the approval menu access guidance need."
      changes:
        - loadData:
            tableName: translations
            file: db/changelog/data/insert/files/20260806_v117_approval_menu_translations.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            separator: ;
            columns:
              - column: { header: id, name: id, type: STRING }
              - column: { header: translation_key, name: translation_key, type: STRING }
              - column: { header: locale, name: locale, type: STRING }
              - column: { header: text_value, name: text_value, type: STRING }
      rollback:
        - delete: { tableName: translations, where: "id LIKE 'v117-%'" }
