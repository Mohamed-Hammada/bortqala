databaseChangeLog:
  - changeSet:
      id: 20260805-v98-qa-remediation-translations
      author: codex
      validCheckSum: ANY
      comment: Arabic/English translations for the QA remediation batch - journal posting confirmation and separated loading/error states.
      changes:
        - loadData:
            tableName: translations
            file: db/changelog/data/insert/files/20260805_v98_qa_remediation_translations.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            separator: ;
            columns:
              - column: { header: id, name: id, type: STRING }
              - column: { header: translation_key, name: translation_key, type: STRING }
              - column: { header: locale, name: locale, type: STRING }
              - column: { header: text_value, name: text_value, type: STRING }
      rollback:
        - delete: { tableName: translations, where: "id LIKE 'v98-%'" }
