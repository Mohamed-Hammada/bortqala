databaseChangeLog:
  - changeSet:
      id: 20260812-v194-exception-parity-translations
      author: codex
      validCheckSum: ANY
      changes:
        - loadData:
            file: db/changelog/data/insert/files/20260812_v194_exception_parity_translations.csv
            separator: ";"
            tableName: translations
            columns:
              - column: { header: id, name: id, type: STRING }
              - column: { header: key, name: translation_key, type: STRING }
              - column: { header: locale, name: locale, type: STRING }
              - column: { header: value, name: text_value, type: STRING }
      rollback:
        - delete: { tableName: translations, where: "id LIKE 'v194-%'" }
