databaseChangeLog:
  - changeSet:
      id: 20260813_v241_001_business_date_translation
      author: Mohamed-Hammada
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM translations WHERE translation_key = 'AR_AS_OF_DATE_REQUIRED'
      changes:
        - loadData:
            file: db/changelog/data/insert/files/20260813_v241_business_date_translation.csv
            separator: ";"
            tableName: translations
            encoding: UTF-8
      rollback:
        - delete:
            tableName: translations
            where: "translation_key IN ('AR_AS_OF_DATE_REQUIRED', 'sales.ar.asOfDate')"
