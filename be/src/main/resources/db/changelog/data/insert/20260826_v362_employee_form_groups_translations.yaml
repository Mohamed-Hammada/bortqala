databaseChangeLog:
  - changeSet:
      id: 20260826-v362-employee-form-groups-translations
      author: bemo-erp
      validCheckSum: ANY
      comment: "WP-20: bilingual copy for employee form grouped accordion sections and preview layout."
      changes:
        - loadData:
            tableName: translations
            file: db/changelog/data/insert/files/20260826_v362_employee_form_groups_translations.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            separator: ;
            columns:
              - column: { header: id, name: id, type: STRING }
              - column: { header: translation_key, name: translation_key, type: STRING }
              - column: { header: locale, name: locale, type: STRING }
              - column: { header: text_value, name: text_value, type: STRING }
      rollback:
        - delete: { tableName: translations, where: "id LIKE 'v362-%' OR translation_key LIKE 'employees.group.%' OR translation_key LIKE 'employees.previewLayout%'" }
