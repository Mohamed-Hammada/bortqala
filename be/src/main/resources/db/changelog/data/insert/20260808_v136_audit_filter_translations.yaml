databaseChangeLog:
  - changeSet:
      id: 20260808-v136-audit-filter-translations
      author: bemo-erp
      validCheckSum: ANY
      comment: "REM-003: bilingual labels for the audit-log filter panel (entity type + username) on the Audit Logs page."
      changes:
        - loadData:
            tableName: translations
            file: db/changelog/data/insert/files/20260808_v136_audit_filter_translations.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            separator: ;
            columns:
              - column: { header: id, name: id, type: STRING }
              - column: { header: translation_key, name: translation_key, type: STRING }
              - column: { header: locale, name: locale, type: STRING }
              - column: { header: text_value, name: text_value, type: STRING }
      rollback:
        - delete: { tableName: translations, where: "id LIKE 'v136-%'" }
