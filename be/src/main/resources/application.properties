spring.application.name=bemo-erp
spring.jpa.open-in-view=false
spring.cache.type=caffeine
spring.cache.cache-names=translationBundles
spring.cache.caffeine.spec=maximumSize=256,expireAfterAccess=30m
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bemo_erp}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
management.endpoints.web.exposure.include=health,info
hr.company-zone=${HR_COMPANY_ZONE:Africa/Cairo}
hr.workforce-import.max-file-bytes=${HR_WORKFORCE_IMPORT_MAX_FILE_BYTES:20971520}
hr.workforce-import.max-rows=${HR_WORKFORCE_IMPORT_MAX_ROWS:20000}
hr.workforce-import.preview-limit=${HR_WORKFORCE_IMPORT_PREVIEW_LIMIT:100}
hr.cors.allowed-origins=${HR_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
hr.jwt.secret=${HR_JWT_SECRET}
hr.jwt.issuer=${HR_JWT_ISSUER:bemo-erp}
hr.jwt.ttl=${HR_JWT_TTL:PT8H}
hr.jwt.refresh-ttl=${HR_JWT_REFRESH_TTL:P30D}
hr.security.device-credentials-secret=${HR_DEVICE_CREDENTIALS_SECRET}
hr.security.trusted-proxies=${HR_SECURITY_TRUSTED_PROXIES:}
hr.security.refresh-cookie-name=${HR_REFRESH_COOKIE_NAME:bemo_refresh}
hr.security.refresh-cookie-secure=${HR_REFRESH_COOKIE_SECURE:true}
hr.security.demo-no-login.enabled=${HR_DEMO_NO_LOGIN_ENABLED:false}
hr.security.demo-no-login.secret=${HR_DEMO_SECRET:}
hr.security.demo-no-login.app-code=${HR_DEMO_NO_LOGIN_APP_CODE:}
hr.security.demo-no-login.app-name=${HR_DEMO_NO_LOGIN_APP_NAME:}
hr.security.demo-no-login.profiles=${HR_DEMO_NO_LOGIN_PROFILES:test}
hr.bootstrap.app-code=${HR_BOOTSTRAP_APP_CODE}
hr.bootstrap.app-name=${HR_BOOTSTRAP_APP_NAME}
hr.bootstrap.admin-username=${HR_BOOTSTRAP_ADMIN_USERNAME}
hr.bootstrap.admin-password=${HR_BOOTSTRAP_ADMIN_PASSWORD}
hr.bootstrap.super-admin-username=${HR_BOOTSTRAP_SUPER_ADMIN_USERNAME}
hr.bootstrap.super-admin-password=${HR_BOOTSTRAP_SUPER_ADMIN_PASSWORD}
logging.structured.format.console=logstash
logging.structured.json.add.service.name=bemo-erp
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
hr.notifications.web-push.enabled=${HR_WEB_PUSH_ENABLED:false}
hr.notifications.web-push.public-key=${HR_WEB_PUSH_PUBLIC_KEY:}
hr.notifications.web-push.private-key=${HR_WEB_PUSH_PRIVATE_KEY:}
hr.notifications.web-push.subject=${HR_WEB_PUSH_SUBJECT:}
hr.notifications.web-push.ttl-seconds=${HR_WEB_PUSH_TTL_SECONDS:86400}
