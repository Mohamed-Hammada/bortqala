spring.application.name=hr-platform
spring.jpa.open-in-view=false
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hr_platform}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
management.endpoints.web.exposure.include=health,info
hr.company-zone=${HR_COMPANY_ZONE:Africa/Cairo}
hr.cors.allowed-origins=${HR_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
hr.jwt.secret=${HR_JWT_SECRET:local-development-jwt-secret-key-32bytes-minimum}
hr.jwt.issuer=${HR_JWT_ISSUER:hr-platform}
hr.jwt.ttl=${HR_JWT_TTL:PT8H}
logging.structured.format.console=logstash
logging.structured.json.add.service.name=hr-platform
