spring.datasource.url=jdbc:h2:mem:bemo-erp;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
# H2 exposes PostgreSQL TEXT as CLOB while PostgreSQL exposes it as VARCHAR/TEXT.
# Production startup keeps schema validation enabled against PostgreSQL.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/test.changelog-master.yaml
hr.company-zone=Africa/Cairo
hr.jwt.secret=test-only-secret-with-at-least-32-characters
hr.jwt.issuer=bemo-erp-test
hr.jwt.ttl=PT1H
hr.security.device-credentials-secret=ZGV2aWNlLWNyZWRlbnRpYWxzLTMyLWJ5dGVzLWtleSE=
hr.bootstrap.app-code=TEST
hr.bootstrap.app-name=Bemo Automated Test
hr.bootstrap.admin-username=admin
hr.bootstrap.admin-password=Admin@12345
hr.bootstrap.super-admin-username=superadmin
hr.bootstrap.super-admin-password=SuperAdmin@12345
hr.bootstrap.demo-data=false
