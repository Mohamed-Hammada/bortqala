databaseChangeLog:
  - changeSet:
      id: test-data-create-test-tenant
      author: Mohamed-Hammada
      comment: Test-only tenant used by automated fixture migrations and bootstrap-account tests.
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM apps WHERE code = 'TEST'
      changes:
        - insert:
            tableName: apps
            columns:
              - column: { name: id, value: "00000000-0000-0000-0000-000000000001" }
              - column: { name: code, value: TEST }
              - column: { name: name, value: "Bemo Automated Test" }
              - column: { name: active, valueBoolean: true }
              - column: { name: created_at, valueDate: "2026-07-29T00:00:00" }
              - column: { name: updated_at, valueDate: "2026-07-29T00:00:00" }
      rollback:
        - delete:
            tableName: apps
            where: code = 'TEST'
