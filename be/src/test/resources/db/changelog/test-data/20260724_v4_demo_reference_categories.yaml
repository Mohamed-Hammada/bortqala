                (id, app_id, code, name, expected_daily_minutes, pay_cycle, attendance_mode,
                 single_punch_counts, work_days_mask, active, version, created_at, updated_at)
              SELECT '10000000-0000-0000-0000-000000000001', a.id, 'ADMINISTRATION', 'الإداريون',
                     480, 'THIRTY_DAYS', 'BIOMETRIC', FALSE, 111, TRUE, 0, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP
              FROM apps a
              WHERE UPPER(a.code) = 'TEST'
                AND NOT EXISTS (SELECT 1 FROM attendance_categories c WHERE c.app_id = a.id AND c.code = 'ADMINISTRATION');

