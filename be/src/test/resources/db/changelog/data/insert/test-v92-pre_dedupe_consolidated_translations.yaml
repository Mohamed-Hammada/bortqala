databaseChangeLog:
  - changeSet:
      id: test-v92-pre-dedupe-consolidated-translations
      author: Mohamed-Hammada
      comment: >
        Test-only, replay-order-specific fix for test-v92-pre.changelog-master.yaml. The v1_v67
        baseline (via its own nested v3 changeset) loads db/changelog/data/insert/files/translations.csv,
        which is a single, continuously-growing file that has since (2026-09-01, "master translation
        file" commit) absorbed the content of the individual v70/v73/v74/v76/v81/v85/v88/v91 insert
        files this snapshot also replays for schema-version fidelity. Replaying both would violate
        uq_translations_key_locale on every key present in both. This changeset removes exactly the
        rows the upcoming v70/v73/v74/v76/v81/v85/v88/v91 changesets are about to re-insert, so the
        historical replay is faithful without duplicating the current file's already-absorbed copies.
      changes:
        - sql:
            sql: |
              DELETE FROM translations WHERE (translation_key, locale) IN (
              ('ACCOUNT_NOT_FOUND', 'ar-EG'),
              ('ACCOUNT_NOT_FOUND', 'en-US'),
