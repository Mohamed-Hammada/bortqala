  - changeSet:
      id: test-v16-fix-inventory-item-unique-constraint
      author: codex
      dbms: h2
      preConditions:
        onFail: HALT
        sqlCheck:
          expectedResult: 1
          sql: SELECT COUNT(*) FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_NAME = 'inventory_items'
      changes:
        - sql:
            sql: ALTER TABLE inventory_items DROP CONSTRAINT uk_inventory_items_app_code
        - sql:
            sql: ALTER TABLE inventory_items ADD CONSTRAINT uk_inventory_items_app_code UNIQUE (app_id, code)
      rollback:
        - sql:
            sql: ALTER TABLE inventory_items DROP CONSTRAINT uk_inventory_items_app_code
        - sql:
            sql: ALTER TABLE inventory_items ADD CONSTRAINT uk_inventory_items_app_code UNIQUE (app_id)
