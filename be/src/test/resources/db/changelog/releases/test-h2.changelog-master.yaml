  # Liquibase 5 cannot reliably resolve lowercase H2 tables in tableExists
  # preconditions. Apply the production V77 changeset directly as H2 SQL.
  - changeSet:
      id: test-v77-employee-assignments
      author: Mohamed-Hammada
      dbms: h2
      preConditions:
        onFail: MARK_RAN
        sqlCheck:
          expectedResult: 0
          sql: SELECT COUNT(*) FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_NAME = 'employee_assignments'
      changes:
        - sql:
            splitStatements: true
            sql: |
              CREATE TABLE employee_assignments (
                id VARCHAR(36) PRIMARY KEY,
                app_id VARCHAR(36) NOT NULL,
                employee_id VARCHAR(36) NOT NULL,
                category_id VARCHAR(36) NOT NULL,
                effective_from DATE NOT NULL,
                effective_to DATE,
                created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP NOT NULL,
                updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP NOT NULL,
                CONSTRAINT uq_employee_assignments_app_employee_from UNIQUE (app_id, employee_id, effective_from)
              );
              CREATE INDEX idx_employee_assignments_employee_dates ON employee_assignments (employee_id, effective_from, effective_to);
  # Liquibase 5 cannot reliably resolve lowercase H2 tables in tableExists
  # preconditions. Apply the skipped production column additions directly.
  - changeSet:
      id: test-current-schema-columns
      author: codex
      dbms: h2
      changes:
        - sql:
            splitStatements: true
            sql: |
              ALTER TABLE schedule_rules ADD COLUMN IF NOT EXISTS end_time TIME;
              ALTER TABLE schedule_rules ADD COLUMN IF NOT EXISTS scope VARCHAR(20) DEFAULT 'ALL' NOT NULL;
              ALTER TABLE schedule_rules ADD COLUMN IF NOT EXISTS scope_category_id VARCHAR(36);
              ALTER TABLE user_preferences ADD COLUMN IF NOT EXISTS default_page VARCHAR(100) DEFAULT '/dashboard' NOT NULL;
              ALTER TABLE business_parties ADD COLUMN IF NOT EXISTS managed_type VARCHAR(30) DEFAULT 'DIRECT' NOT NULL;
              ALTER TABLE business_parties ADD COLUMN IF NOT EXISTS responsible_party_id VARCHAR(36);
              ALTER TABLE business_parties ADD COLUMN IF NOT EXISTS currency_code VARCHAR(10) DEFAULT 'EGP' NOT NULL;
              ALTER TABLE business_parties ADD COLUMN IF NOT EXISTS invoice_policy VARCHAR(30) DEFAULT 'E_INVOICE' NOT NULL;
              ALTER TABLE business_parties ADD COLUMN IF NOT EXISTS payment_terms VARCHAR(30) DEFAULT 'CASH' NOT NULL;
              ALTER TABLE business_parties ADD COLUMN IF NOT EXISTS tax_id VARCHAR(50);
              ALTER TABLE business_parties ADD COLUMN IF NOT EXISTS bank_account VARCHAR(100);
              ALTER TABLE business_parties ADD COLUMN IF NOT EXISTS name_en VARCHAR(160);
              ALTER TABLE business_parties ADD COLUMN IF NOT EXISTS email VARCHAR(100);
              ALTER TABLE business_parties ADD COLUMN IF NOT EXISTS address VARCHAR(500);
              ALTER TABLE business_parties ADD COLUMN IF NOT EXISTS relationship_start_date VARCHAR(10);
              ALTER TABLE business_parties ADD COLUMN IF NOT EXISTS relationship_end_date VARCHAR(10);
              ALTER TABLE purchase_order_lines ADD COLUMN IF NOT EXISTS item_category VARCHAR(100);
              ALTER TABLE purchase_order_lines ADD COLUMN IF NOT EXISTS unit_of_measure VARCHAR(50);
              ALTER TABLE purchase_order_lines ADD COLUMN IF NOT EXISTS created_at BIGINT DEFAULT 0 NOT NULL;
              ALTER TABLE goods_receipts ADD COLUMN IF NOT EXISTS notes VARCHAR(500);
              ALTER TABLE supplier_invoices ADD COLUMN IF NOT EXISTS discount_amount NUMERIC(15,2);
              ALTER TABLE supplier_invoices ADD COLUMN IF NOT EXISTS tax_amount NUMERIC(15,2);
              ALTER TABLE supplier_invoices ADD COLUMN IF NOT EXISTS net_amount NUMERIC(15,2);
              ALTER TABLE supplier_invoices ADD COLUMN IF NOT EXISTS due_date DATE;
              ALTER TABLE supplier_invoices ADD COLUMN IF NOT EXISTS notes VARCHAR(500);
              ALTER TABLE supplier_payments ADD COLUMN IF NOT EXISTS operation_id VARCHAR(80) DEFAULT 'legacy' NOT NULL;
              ALTER TABLE biometric_devices ADD COLUMN IF NOT EXISTS device_username VARCHAR(150);
              ALTER TABLE biometric_devices ADD COLUMN IF NOT EXISTS device_password_enc VARCHAR(1000);
              ALTER TABLE reports ADD COLUMN IF NOT EXISTS generation_hash VARCHAR(64);
              ALTER TABLE daily_results ADD COLUMN IF NOT EXISTS version BIGINT DEFAULT 0 NOT NULL;
              CREATE TABLE IF NOT EXISTS attendance_report_decisions (
                id VARCHAR(36) NOT NULL PRIMARY KEY,
                app_id VARCHAR(36) NOT NULL,
                report_id VARCHAR(36) NOT NULL,
                result_id VARCHAR(36) NOT NULL,
                operation_id VARCHAR(64) NOT NULL,
                operation VARCHAR(30) NOT NULL,
                previous_decision VARCHAR(30),
                previous_manual_minutes INT,
                previous_note VARCHAR(500),
                previous_decided_by VARCHAR(100),
                previous_decided_at TIMESTAMP WITH TIME ZONE,
                new_decision VARCHAR(30) NOT NULL,
                new_manual_minutes INT,
                new_note VARCHAR(500),
                actor VARCHAR(100) NOT NULL,
                created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP NOT NULL,
                CONSTRAINT uq_report_decisions_operation UNIQUE (app_id, operation_id)
              );
              CREATE INDEX IF NOT EXISTS idx_report_decisions_report ON attendance_report_decisions (report_id);
              CREATE INDEX IF NOT EXISTS idx_report_decisions_result ON attendance_report_decisions (result_id);
              CREATE TABLE IF NOT EXISTS idempotency_keys (
                id VARCHAR(36) NOT NULL PRIMARY KEY,
                app_id VARCHAR(36) NOT NULL,
                operation_type VARCHAR(60) NOT NULL,
                operation_id VARCHAR(80) NOT NULL,
                request_hash VARCHAR(64) NOT NULL,
                status VARCHAR(20) NOT NULL,
                response_reference_or_body VARCHAR(4000),
                created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
                completed_at TIMESTAMP,
                CONSTRAINT uq_idempotency_app_type_operation UNIQUE (app_id, operation_type, operation_id)
              );
              ALTER TABLE app_users ADD COLUMN IF NOT EXISTS failed_login_attempts INT DEFAULT 0 NOT NULL;
              ALTER TABLE app_users ADD COLUMN IF NOT EXISTS locked_until TIMESTAMP WITH TIME ZONE;
              ALTER TABLE app_users ADD COLUMN IF NOT EXISTS must_change_password BOOLEAN DEFAULT FALSE NOT NULL;
              ALTER TABLE app_users ADD COLUMN IF NOT EXISTS last_login_at TIMESTAMP WITH TIME ZONE;
              ALTER TABLE app_users ADD COLUMN IF NOT EXISTS last_failed_login_at TIMESTAMP WITH TIME ZONE;
              ALTER TABLE app_users ADD COLUMN IF NOT EXISTS token_version INT DEFAULT 0 NOT NULL;
              CREATE TABLE IF NOT EXISTS refresh_tokens (
                id VARCHAR(36) NOT NULL PRIMARY KEY,
                app_id VARCHAR(36) NOT NULL,
                user_id VARCHAR(36) NOT NULL,
                family_id VARCHAR(36) NOT NULL,
                token_hash VARCHAR(64) NOT NULL,
                expires_at TIMESTAMP WITH TIME ZONE NOT NULL,
                device_id VARCHAR(100),
                created_at TIMESTAMP WITH TIME ZONE NOT NULL,
                revoked_at TIMESTAMP WITH TIME ZONE,
                revoked_by VARCHAR(100),
                replaced_by_token_id VARCHAR(36)
              );
              ALTER TABLE refresh_tokens ADD CONSTRAINT IF NOT EXISTS uq_refresh_tokens_app_hash UNIQUE (app_id, token_hash);
              ALTER TABLE refresh_tokens ADD CONSTRAINT IF NOT EXISTS fk_refresh_tokens_app FOREIGN KEY (app_id) REFERENCES apps(id) ON DELETE CASCADE;
              ALTER TABLE refresh_tokens ADD CONSTRAINT IF NOT EXISTS fk_refresh_tokens_user FOREIGN KEY (user_id) REFERENCES app_users(id) ON DELETE CASCADE;
              ALTER TABLE refresh_tokens ADD CONSTRAINT IF NOT EXISTS fk_refresh_tokens_replaced_by FOREIGN KEY (replaced_by_token_id) REFERENCES refresh_tokens(id) ON DELETE SET NULL;
              CREATE INDEX IF NOT EXISTS idx_refresh_tokens_app_user ON refresh_tokens (app_id, user_id);
              CREATE INDEX IF NOT EXISTS idx_refresh_tokens_app_family ON refresh_tokens (app_id, family_id);
              INSERT INTO roles (code, name_ar) SELECT 'FINANCE_MANAGER', 'مدير المالية' WHERE NOT EXISTS (SELECT 1 FROM roles WHERE code = 'FINANCE_MANAGER');
              INSERT INTO roles (code, name_ar) SELECT 'ACCOUNTANT', 'محاسب' WHERE NOT EXISTS (SELECT 1 FROM roles WHERE code = 'ACCOUNTANT');
              INSERT INTO roles (code, name_ar) SELECT 'TREASURY_USER', 'أمين خزينة' WHERE NOT EXISTS (SELECT 1 FROM roles WHERE code = 'TREASURY_USER');
              INSERT INTO roles (code, name_ar) SELECT 'PROCUREMENT_MANAGER', 'مدير المشتريات' WHERE NOT EXISTS (SELECT 1 FROM roles WHERE code = 'PROCUREMENT_MANAGER');
              INSERT INTO roles (code, name_ar) SELECT 'PROCUREMENT_USER', 'موظف مشتريات' WHERE NOT EXISTS (SELECT 1 FROM roles WHERE code = 'PROCUREMENT_USER');
              INSERT INTO roles (code, name_ar) SELECT 'SALES_MANAGER', 'مدير المبيعات' WHERE NOT EXISTS (SELECT 1 FROM roles WHERE code = 'SALES_MANAGER');
              INSERT INTO roles (code, name_ar) SELECT 'INVENTORY_MANAGER', 'مدير المخزون' WHERE NOT EXISTS (SELECT 1 FROM roles WHERE code = 'INVENTORY_MANAGER');
              INSERT INTO roles (code, name_ar) SELECT 'MANUFACTURING_MANAGER', 'مدير الإنتاج' WHERE NOT EXISTS (SELECT 1 FROM roles WHERE code = 'MANUFACTURING_MANAGER');
              INSERT INTO roles (code, name_ar) SELECT 'QUALITY_MANAGER', 'مدير الجودة' WHERE NOT EXISTS (SELECT 1 FROM roles WHERE code = 'QUALITY_MANAGER');
              INSERT INTO roles (code, name_ar) SELECT 'PAYROLL_MANAGER', 'مدير الرواتب' WHERE NOT EXISTS (SELECT 1 FROM roles WHERE code = 'PAYROLL_MANAGER');
              INSERT INTO roles (code, name_ar) SELECT 'WORKFORCE_MANAGER', 'مدير العمالة' WHERE NOT EXISTS (SELECT 1 FROM roles WHERE code = 'WORKFORCE_MANAGER');
              INSERT INTO roles (code, name_ar) SELECT 'WORKFORCE_REVIEWER', 'مراجع العمالة' WHERE NOT EXISTS (SELECT 1 FROM roles WHERE code = 'WORKFORCE_REVIEWER');
              INSERT INTO roles (code, name_ar) SELECT 'WORKFORCE_FINANCE', 'مالية العمالة' WHERE NOT EXISTS (SELECT 1 FROM roles WHERE code = 'WORKFORCE_FINANCE');
              INSERT INTO roles (code, name_ar) SELECT 'AUDITOR', 'مراجع حسابات' WHERE NOT EXISTS (SELECT 1 FROM roles WHERE code = 'AUDITOR');
              INSERT INTO user_roles (user_id, role_code)
              SELECT ur.user_id, r.code
              FROM user_roles ur
              CROSS JOIN (VALUES
                  ('FINANCE_MANAGER'),('ACCOUNTANT'),('TREASURY_USER'),('PROCUREMENT_MANAGER'),
                  ('PROCUREMENT_USER'),('SALES_MANAGER'),('INVENTORY_MANAGER'),('MANUFACTURING_MANAGER'),
                  ('QUALITY_MANAGER'),('PAYROLL_MANAGER'),('WORKFORCE_MANAGER'),('WORKFORCE_REVIEWER'),
                  ('WORKFORCE_FINANCE'),('AUDITOR')
              ) AS r(code)
              WHERE ur.role_code IN ('ADMIN','SUPER_ADMIN')
                AND NOT EXISTS (SELECT 1 FROM user_roles x WHERE x.user_id = ur.user_id AND x.role_code = r.code);
              INSERT INTO user_roles (user_id, role_code)
              SELECT ur.user_id, r.code
              FROM user_roles ur
              CROSS JOIN (VALUES
                  ('WORKFORCE_MANAGER'),('WORKFORCE_REVIEWER')
              ) AS r(code)
              WHERE ur.role_code = 'HR_MANAGER'
                AND NOT EXISTS (SELECT 1 FROM user_roles x WHERE x.user_id = ur.user_id AND x.role_code = r.code);
              INSERT INTO user_roles (user_id, role_code)
              SELECT ur.user_id, 'WORKFORCE_REVIEWER'
              FROM user_roles ur
              WHERE ur.role_code = 'HR_REVIEWER'
                AND NOT EXISTS (SELECT 1 FROM user_roles x WHERE x.user_id = ur.user_id AND x.role_code = 'WORKFORCE_REVIEWER');
