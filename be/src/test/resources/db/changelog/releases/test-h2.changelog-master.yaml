  - changeSet:
      id: test-v63-procurement-currency-prerequisites
      author: codex
      dbms: h2
      changes:
        - sql:
            splitStatements: true
            sql: |
              ALTER TABLE purchase_orders ADD COLUMN IF NOT EXISTS currency_code VARCHAR(10) DEFAULT 'EGP' NOT NULL;
              ALTER TABLE supplier_invoices ADD COLUMN IF NOT EXISTS currency_code VARCHAR(10) DEFAULT 'EGP' NOT NULL;
              ALTER TABLE supplier_invoices ADD COLUMN IF NOT EXISTS internal_reference VARCHAR(50);
              ALTER TABLE supplier_invoices ADD COLUMN IF NOT EXISTS missing_invoice_reason VARCHAR(255);
              ALTER TABLE supplier_invoices ADD COLUMN IF NOT EXISTS discount_amount NUMERIC(15,2) DEFAULT 0;
              ALTER TABLE supplier_invoices ADD COLUMN IF NOT EXISTS tax_amount NUMERIC(15,2) DEFAULT 0;
              ALTER TABLE supplier_invoices ADD COLUMN IF NOT EXISTS net_amount NUMERIC(15,2) DEFAULT 0;
              UPDATE supplier_invoices SET net_amount = total_amount - COALESCE(discount_amount, 0) + COALESCE(tax_amount, 0);
              CREATE TABLE IF NOT EXISTS workforce_advance_policies (
                id VARCHAR(36) PRIMARY KEY, app_id VARCHAR(36) NOT NULL, scope_type VARCHAR(20) NOT NULL,
                scope_id VARCHAR(36), deduction_mode VARCHAR(20) DEFAULT 'AUTO' NOT NULL,
                deduction_frequency VARCHAR(30) DEFAULT 'HALF_MONTH' NOT NULL,
                max_deduction_percent NUMERIC(5,2) DEFAULT 50 NOT NULL,
                default_installments INT DEFAULT 1 NOT NULL, deferral_periods INT DEFAULT 0 NOT NULL,
                active BOOLEAN DEFAULT TRUE NOT NULL, created_at TIMESTAMP WITH TIME ZONE NOT NULL,
                updated_at TIMESTAMP WITH TIME ZONE NOT NULL,
                CONSTRAINT uk_advance_policy_scope UNIQUE (app_id, scope_type, scope_id)
              );
