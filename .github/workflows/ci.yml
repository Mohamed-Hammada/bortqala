name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (Gradle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: gradle
      - name: Backend clean test check
        working-directory: be
        run: ./gradlew clean test check

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fe/package-lock.json
      - name: Install dependencies
        working-directory: fe
        run: npm ci
      - name: i18n key coverage
        working-directory: fe
        run: npm run check:i18n
      - name: Unit tests
        working-directory: fe
        run: npx ng test --watch=false
      - name: Production build
        working-directory: fe
        run: npm run build

  compose:
    name: Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose config (dev)
        run: docker compose -f docker-compose.yml config --quiet
      - name: Compose config (prod)
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
        env:
          POSTGRES_DB: bemo_erp
          POSTGRES_USER: bemo
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          HR_JWT_SECRET: ${{ secrets.HR_JWT_SECRET }}
          HR_JWT_ISSUER: bemo-erp-prod
          HR_CORS_ALLOWED_ORIGINS: https://erp.example.com
          HR_BOOTSTRAP_APP_CODE: PROD
          HR_BOOTSTRAP_APP_NAME: Bemo ERP
          HR_BOOTSTRAP_ADMIN_USERNAME: admin
          HR_BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.HR_BOOTSTRAP_ADMIN_PASSWORD }}
          HR_BOOTSTRAP_SUPER_ADMIN_USERNAME: superadmin
          HR_BOOTSTRAP_SUPER_ADMIN_PASSWORD: ${{ secrets.HR_BOOTSTRAP_SUPER_ADMIN_PASSWORD }}
      - name: Compose build
        run: docker compose build
