name: ci
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install -r gateway/requirements.txt pytest
      - run: PYTHONPATH=gateway pytest -q gateway/tests
      - run: python -m py_compile gateway/app/*.py gateway/app/drivers/*.py tools/device_probe.py
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - run: mkdir -p /tmp/classes && javac -d /tmp/classes $(find java-sdk/src/main/java java-sdk/src/test/java -name '*.java') && java -cp /tmp/classes org.example.devicehub.SelfTest
