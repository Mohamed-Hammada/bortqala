name: supplier-packages
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Test supplier route selectors
        run: |
          for d in packages/suppliers/*; do python "$d/tests/test_router.py"; done
          python tools/select_supplier_route.py hikvision DS-K1T341
          python tools/select_supplier_route.py suprema "BioEntry Plus v2"
