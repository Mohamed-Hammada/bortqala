server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  max-http-request-header-size: 32KB

spring:
  application:
    name: zkteco-universal-gateway
  lifecycle:
    timeout-per-shutdown-phase: 20s
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    org.example.zkteco: INFO
