[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-access-hikvision"
version = "0.3.0"
description = "Self-contained Hikvision biometric/access integration package"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
