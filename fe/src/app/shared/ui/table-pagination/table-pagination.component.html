<nav class="table-pagination" aria-label="Pagination">
  <label>
    <span>{{ i18n.t('pagination.rowsPerPage') }}</span>
    <select [value]="pageSize()" (change)="selectPageSize($event)">
      <option value="10">10</option>
      <option value="25">25</option>
      <option value="50">50</option>
      <option value="100">100</option>
    </select>
  </label>
  <span class="range ltr">{{ from() }}–{{ to() }} / {{ total() }}</span>
  <div class="pager-actions">
    <button type="button" [disabled]="page() <= 1" (click)="pageChange.emit(page() - 1)">
      {{ i18n.t('pagination.previous') }}
    </button>
    <span class="ltr">{{ page() }} / {{ totalPages() }}</span>
    <button type="button" [disabled]="page() >= totalPages()" (click)="pageChange.emit(page() + 1)">
      {{ i18n.t('pagination.next') }}
    </button>
  </div>
</nav>
