<div class="modal-backdrop" (click)="onCancel()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3 class="modal-title">{{ i18n.t('policy.userAssignments') }}</h3>
      <span class="user-subtitle">{{ userName }} ({{ userId }})</span>
      <button type="button" class="btn-close" (click)="onCancel()">✕</button>
    </div>

    <div class="modal-body">
      <div *ngIf="loading()" class="loading-state">
        <div class="spinner"></div>
      </div>

      <div *ngIf="errorMessage()" class="alert alert-danger">
        {{ errorMessage() }}
      </div>

      <div *ngIf="!loading()" class="assignment-list">
        <div class="assignment-item" *ngFor="let item of assignments()" [class.active]="item.selected">
          <div class="group-select-row" (click)="toggleGroup(item)">
            <input
              type="checkbox"
              [checked]="item.selected"
              (click)="$event.stopPropagation(); toggleGroup(item)"
              class="group-checkbox"
            />
            <span class="group-name">{{ item.groupName }}</span>
          </div>

          <div class="scope-inputs" *ngIf="item.selected">
            <div class="form-group">
              <label>{{ i18n.t('policy.scopeBranch') }}</label>
              <input
                type="text"
                [(ngModel)]="item.scopeBranchId"
                [placeholder]="i18n.t('policy.branchAll')"
                class="form-control form-control-sm"
              />
            </div>
            <div class="form-group">
              <label>{{ i18n.t('policy.scopeCostCenter') }}</label>
              <input
                type="text"
                [(ngModel)]="item.scopeCostCenterId"
                [placeholder]="i18n.t('policy.costCenterAll')"
                class="form-control form-control-sm"
              />
            </div>
          </div>
        </div>

        <div *ngIf="assignments().length === 0" class="empty-state">
          <p>{{ i18n.t('policy.noGroups') }}</p>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn btn-outline" (click)="onCancel()" [disabled]="saving()">
        {{ i18n.t('common.cancel') }}
      </button>
      <button type="button" class="btn btn-primary" (click)="onSave()" [disabled]="saving() || loading()">
        <span *ngIf="saving()">...</span>
        <span *ngIf="!saving()">{{ i18n.t('common.save') }}</span>
      </button>
    </div>
  </div>
</div>
