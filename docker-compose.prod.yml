name: bemo-erp

# Production overlay. Run with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Every secret is required (`:?`) and has no fallback; the command fails fast
# when any is missing. Database and backend are not published to the host: only
# the frontend reverse proxy is public; db and backend stay on the internal
# network only. `!reset []` is required because Compose merges sequence values:
# a plain `ports: []` would leave the development host ports from the base file
# published.

services:
  db:
    ports: !reset []
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}

  backend:
    ports: !reset []
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:?POSTGRES_DB must be set}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?POSTGRES_USER must be set}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      HR_JWT_SECRET: ${HR_JWT_SECRET:?HR_JWT_SECRET must be set}
      HR_JWT_ISSUER: ${HR_JWT_ISSUER:?HR_JWT_ISSUER must be set}
      HR_CORS_ALLOWED_ORIGINS: ${HR_CORS_ALLOWED_ORIGINS:?HR_CORS_ALLOWED_ORIGINS must be an explicit HTTPS allowlist}
      HR_DEVICE_CREDENTIALS_SECRET: ${HR_DEVICE_CREDENTIALS_SECRET:?HR_DEVICE_CREDENTIALS_SECRET must be a Base64-encoded 32-byte key}
      HR_BOOTSTRAP_APP_CODE: ${HR_BOOTSTRAP_APP_CODE:?HR_BOOTSTRAP_APP_CODE must be set}
      HR_BOOTSTRAP_APP_NAME: ${HR_BOOTSTRAP_APP_NAME:?HR_BOOTSTRAP_APP_NAME must be set}
      HR_BOOTSTRAP_ADMIN_USERNAME: ${HR_BOOTSTRAP_ADMIN_USERNAME:?HR_BOOTSTRAP_ADMIN_USERNAME must be set}
      HR_BOOTSTRAP_ADMIN_PASSWORD: ${HR_BOOTSTRAP_ADMIN_PASSWORD:?HR_BOOTSTRAP_ADMIN_PASSWORD must be set}
      HR_BOOTSTRAP_SUPER_ADMIN_USERNAME: ${HR_BOOTSTRAP_SUPER_ADMIN_USERNAME:?HR_BOOTSTRAP_SUPER_ADMIN_USERNAME must be set}
      HR_BOOTSTRAP_SUPER_ADMIN_PASSWORD: ${HR_BOOTSTRAP_SUPER_ADMIN_PASSWORD:?HR_BOOTSTRAP_SUPER_ADMIN_PASSWORD must be set}
      HR_COMPANY_ZONE: ${HR_COMPANY_ZONE:-Africa/Cairo}
