spring.application.name=bemo-license-service
server.port=${PORT:8091}
spring.datasource.url=${LICENSE_DB_URL:jdbc:postgresql://localhost:5432/bemo_license}
spring.datasource.username=${LICENSE_DB_USERNAME:root}
spring.datasource.password=${LICENSE_DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
license.admin.key=${LICENSE_ADMIN_KEY}
license.signing.private-key=${LICENSE_SIGNING_PRIVATE_KEY:}
license.signing.public-key=${LICENSE_SIGNING_PUBLIC_KEY:}
license.signing.allow-ephemeral=${LICENSE_ALLOW_EPHEMERAL_SIGNING_KEY:false}
license.proof.max-clock-skew=PT5M
logging.structured.format.console=logstash
logging.structured.json.add.service.name=bemo-license-service
