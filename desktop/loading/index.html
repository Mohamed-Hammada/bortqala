<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bemo ERP</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5efe2;color:#17232c;font-family:Tahoma,Arial,sans-serif}.card{width:min(470px,calc(100% - 40px));text-align:center;padding:38px;border:1px solid #e5d9c2;border-radius:24px;background:#fff;box-shadow:0 20px 60px #17232c18}.mark{width:64px;height:64px;margin:auto;border-radius:18px;display:grid;place-items:center;background:#17232c;color:#dcae52;font-size:30px;font-weight:700}.pulse{width:180px;height:3px;margin:24px auto;background:linear-gradient(90deg,transparent,#b8872d,transparent);animation:p 1.2s infinite}@keyframes p{50%{opacity:.25}}form{display:none;gap:12px;margin-top:22px}input,button{box-sizing:border-box;width:100%;padding:13px;border-radius:10px;font:inherit}input{direction:ltr;border:1px solid #cfc4b0}button{border:0;background:#17232c;color:#fff;cursor:pointer}.error{color:#a02b2b;min-height:1.5em}</style></head>
<body><main class="card"><div class="mark">ب</div><h1>بيمو لإدارة الشركة</h1><p id="message">جارٍ التحقق من الترخيص وتشغيل قاعدة البيانات والنظام…</p><div id="pulse" class="pulse"></div>
<form id="activation"><label for="key">مفتاح الترخيص / License key</label><input id="key" autocomplete="off" placeholder="BEMO-..." required><button type="submit">تفعيل هذا الجهاز / Activate</button><p id="error" class="error"></p></form></main>
<script>
const invoke=window.__TAURI__.core.invoke;const form=document.getElementById('activation');const message=document.getElementById('message');const pulse=document.getElementById('pulse');const error=document.getElementById('error');
(async()=>{try{if(!await invoke('license_status')){message.textContent='هذا الجهاز يحتاج إلى تفعيل صالح قبل فتح النظام.';pulse.style.display='none';form.style.display='grid'}}catch(e){error.textContent=String(e)}})();
form.addEventListener('submit',async event=>{event.preventDefault();error.textContent='';const button=form.querySelector('button');button.disabled=true;try{message.textContent='جارٍ تفعيل الجهاز…';await invoke('activate_license',{licenseKey:document.getElementById('key').value.trim()});message.textContent='تم التفعيل. جارٍ فتح النظام…';form.style.display='none';pulse.style.display='block'}catch(e){message.textContent='تعذر تفعيل الجهاز.';error.textContent=String(e);button.disabled=false}});
</script></body></html>
