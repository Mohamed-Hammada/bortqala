<!doctype html>
<html lang="ar" dir="rtl">
  <head><meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><title>Bemo HR</title>
    <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5efe2;color:#17232c;font-family:Tahoma,Arial,sans-serif}.card{text-align:center;padding:38px}.mark{width:64px;height:64px;margin:auto;border-radius:18px;display:grid;place-items:center;background:#17232c;color:#dcae52;font-size:30px;font-weight:700}.pulse{width:180px;height:3px;margin:24px auto;background:linear-gradient(90deg,transparent,#b8872d,transparent);animation:p 1.2s infinite}@keyframes p{50%{opacity:.25}}</style>
  </head>
  <body><main class="card"><div class="mark">ب</div><h1>بيمو لإدارة الموارد البشرية</h1><p>جارٍ تشغيل قاعدة البيانات والنظام…</p><div class="pulse"></div></main></body>
</html>
